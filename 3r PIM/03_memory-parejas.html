/* Layout: lámina centrada; selector de nivel y marcador arriba, tablero de 12 cartas (4×3, 3×4 en móvil) debajo */
:root{
  --paper:#ffffff; --ink:#1d1d1b; --ink-soft:#5f5f58; --line:#1d1d1b;
  --c1:#FCEB9E; --c2:#F4F4D6; --c3:#BFE1F6; --c4:#B5E0D6; --c5:#F9D3D9;
  --ok:#1f7a55; --bad:#b4233a; --focus:#1F5FAD;
  --f-display:'Fredoka',ui-rounded,system-ui,sans-serif;
  --f-body:'Andika','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;padding-inline:16px;padding-block:24px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{text-align:center;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--f-display);font-size:clamp(18px,4.5vw,24px);font-weight:500}
h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(34px,9vw,58px);line-height:1.05;text-wrap:balance}
p{margin:0;line-height:1.5}
button{font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 18px;cursor:pointer;min-height:44px}
button:hover{background:var(--c2)}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--c3)}
.help{text-align:center;color:var(--ink-soft);max-width:56ch;align-self:center}
.stats{display:flex;justify-content:center;gap:10px 26px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats b{font-family:var(--f-display);font-size:22px}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,14px)}
@media (max-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{aspect-ratio:4/5;max-width:100%;padding:0;border:0;background:transparent;perspective:800px;min-height:0;border-radius:12px}
.card:hover{background:transparent}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .4s ease}
.card.open .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border:2px solid var(--line);border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.back{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,7vw,40px);color:var(--ink-soft)}
.back.k1{background:var(--c1)} .back.k2{background:var(--c2)} .back.k3{background:var(--c3)} .back.k4{background:var(--c4)} .back.k5{background:var(--c5)}
.front{transform:rotateY(180deg);background:var(--paper);font-family:var(--f-display);font-weight:600;font-size:clamp(24px,6.5vw,38px);font-variant-numeric:tabular-nums;color:var(--ink)}
.card.done .front{background:var(--c4);box-shadow:0 0 0 3px var(--ink) inset}
.card.miss .front{background:var(--c5)}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.fr span{padding:0 8px}
.fr span:first-child{border-bottom:3px solid var(--ink)}

.msg{text-align:center;font-weight:700;font-size:19px;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.win{border:2px solid var(--line);border-radius:14px;padding:14px 18px;background:var(--c1);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.win p{font-size:19px}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">Tablas de multiplicar</span>
    <h1>Memory de parejas</h1>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="Nivel">
      <button id="l1" aria-pressed="true">Nivel 1 · Multiplicaciones</button>
      <button id="l2" aria-pressed="false">Nivel 2 · Fracciones</button>
    </div>
    <button id="new">Nueva partida</button>
  </div>
  <p class="help" id="help">Da la vuelta a dos cartas. Si la multiplicación y el resultado van juntos, ¡son pareja!</p>

  <div class="stats" aria-live="polite">
    <span>Parejas: <b id="pairs">0</b> / 6</span>
    <span>Intentos: <b id="tries">0</b></span>
  </div>

  <div class="grid" id="grid"></div>
  <p class="msg" id="msg" aria-live="polite"></p>

  <div class="win" id="win" hidden>
    <p id="winText"></p>
    <button id="up">Pasar al nivel 2</button>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  const frac=(n,d)=>'<span class="fr" aria-label="'+n+' entre '+d+'"><span>'+n+'</span><span>'+d+'</span></span>';

  let level=1, deck=[], open=[], pairs=0, tries=0, lock=false;

  function makePairs(){
    const out=[];
    if(level===1){
      const used=new Set();
      while(out.length<6){
        const r=rnd(3,9), c=rnd(3,9), p=r*c;
        if(used.has(p))continue; used.add(p);
        out.push([{html:r+' × '+c,say:r+' por '+c},{html:String(p),say:String(p)}]);
      }
    }else{
      const used=new Set();
      while(out.length<6){
        const d=rnd(2,9), n=rnd(1,d-1);
        if(gcd(n,d)!==1)continue;
        const v=(n/d).toFixed(4); if(used.has(v))continue;
        const k=rnd(2,5); if(n*k>50||d*k>50)continue;
        used.add(v);
        out.push([{html:frac(n,d),say:n+' entre '+d},{html:frac(n*k,d*k),say:(n*k)+' entre '+(d*k)}]);
      }
    }
    return out;
  }
  function deal(){
    pairs=0;tries=0;open=[];lock=false;
    $('pairs').textContent=0;$('tries').textContent=0;$('msg').textContent='';$('msg').className='msg';$('win').hidden=true;
    deck=[];
    makePairs().forEach((p,id)=>p.forEach(face=>deck.push({id,...face})));
    shuffle(deck);
    const g=$('grid'); g.innerHTML='';
    deck.forEach((c,i)=>{
      const b=document.createElement('button');
      b.className='card'; b.setAttribute('aria-label','Carta '+(i+1)+', boca abajo');
      b.innerHTML='<div class="inner"><div class="face back k'+((i%5)+1)+'">?</div><div class="face front">'+c.html+'</div></div>';
      b.onclick=()=>flip(i,b); c.el=b; g.appendChild(b);
    });
  }
  function flip(i,b){
    const c=deck[i];
    if(lock||c.done||open.includes(i))return;
    b.classList.add('open'); b.setAttribute('aria-label','Carta '+(i+1)+': '+c.say);
    open.push(i);
    if(open.length<2)return;
    tries++; $('tries').textContent=tries;
    const [a,z]=open.map(k=>deck[k]);
    if(a.id===z.id){
      a.done=z.done=true; a.el.classList.add('done'); z.el.classList.add('done'); open=[];
      pairs++; $('pairs').textContent=pairs;
      $('msg').textContent=level===1?'¡Pareja! '+a.say.replace(' por ',' × ')+' = '+(a.say.includes('por')?z.say:a.say):'¡Pareja! Son fracciones equivalentes.';
      if(level===1){const m=[a,z].find(x=>x.say.includes('por')),r=[a,z].find(x=>!x.say.includes('por'));$('msg').textContent='¡Pareja! '+m.say.replace(' por ',' × ')+' = '+r.say;}
      $('msg').className='msg ok';
      if(pairs===6)win();
    }else{
      lock=true; a.el.classList.add('miss'); z.el.classList.add('miss');
      $('msg').textContent='No son pareja. ¡Fíjate dónde estaban!'; $('msg').className='msg bad';
      setTimeout(()=>{[a,z].forEach((x,k)=>{x.el.classList.remove('open','miss');x.el.setAttribute('aria-label','Carta '+(open[k]+1)+', boca abajo');});open=[];lock=false;},1300);
    }
  }
  function win(){
    $('winText').innerHTML='<b>¡Todas las parejas!</b> Lo has conseguido en '+tries+' intentos.';
    $('up').textContent=level===1?'Pasar al nivel 2':'Jugar otra vez';
    $('win').hidden=false;
  }
  function setLevel(l){
    level=l; $('l1').setAttribute('aria-pressed',l===1); $('l2').setAttribute('aria-pressed',l===2);
    $('help').textContent=l===1?'Da la vuelta a dos cartas. Si la multiplicación y el resultado van juntos, ¡son pareja!'
      :'Da la vuelta a dos cartas. Si las dos fracciones valen lo mismo, ¡son pareja! Pista: multiplica arriba y abajo por el mismo número.';
    deal();
  }
  $('l1').onclick=()=>setLevel(1); $('l2').onclick=()=>setLevel(2);
  $('new').onclick=deal;
  $('up').onclick=()=>{ if(level===1)setLevel(2); else deal(); };
  deal();
})();
</script>

</body>
</html>
