/* Layout: consola de la Base Aurora; coberta amb radar i aurora boreal, HUD d'integritat i pistes, un repte per pantalla amb apartats com a camps interactius */
:root{
  --bg:#e2ecf0; --paper:#fbfdfe; --ink:#0b1f2c; --ink-soft:#48626f; --line:#0b1f2c; --rule:#9db8c4; --cell:#edf5f8;
  --slab:#07141c; --slab-2:#0f2a38; --slab-ink:#e6f3f6; --ice:#7fd8ee; --aur:#4fe3b0; --on-aur:#04241a; --warn:#ff6a3d;
  --ok:#17784f; --bad:#c2301a; --focus:#1f5fad; --grid:rgba(40,130,160,.18); --okbg:#d8f3e6; --badbg:#fbe0d9;
  --f-disp:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --f-body:'Barlow','Helvetica Neue',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#040c11; --paper:#0b1820; --ink:#e2eff3; --ink-soft:#8fa9b5; --line:#4a6878; --rule:#2a4351; --cell:#10222c;
  --slab:#081b25; --slab-2:#123140; --ok:#5fdca0; --bad:#ff7a59; --focus:#7db4ff; --grid:rgba(127,216,238,.12); --okbg:#0f3326; --badbg:#3a1a14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#040c11; --paper:#0b1820; --ink:#e2eff3; --ink-soft:#8fa9b5; --line:#4a6878; --rule:#2a4351; --cell:#10222c;
  --slab:#081b25; --slab-2:#123140; --ok:#5fdca0; --bad:#ff7a59; --focus:#7db4ff; --grid:rgba(127,216,238,.12); --okbg:#0f3326; --badbg:#3a1a14; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:18px 48px}
p{margin:0}
sup{font-size:.62em;line-height:0;vertical-align:super}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#main{display:flex;flex-direction:column;gap:18px}
h2{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(26px,5.5vw,34px);line-height:1.02;text-wrap:balance}
.ex{font-family:var(--f-mono);font-weight:600;font-size:1.06em;white-space:nowrap}
.mono{font-family:var(--f-mono)}

button{border:1.5px solid var(--line);background:var(--paper);border-radius:3px;padding:9px 16px;min-height:44px;cursor:pointer;font-weight:600;font-size:16px}
button:hover:not(:disabled):not([aria-pressed="true"]):not(.used){background:var(--cell)}
.chipd:hover:not(:disabled):not([aria-pressed="true"]){background:var(--slab-2)}
button.primary{background:var(--aur);color:var(--on-aur);border-color:var(--line)}
button.primary:hover:not(:disabled){filter:brightness(.94);background:var(--aur)}
button:disabled{cursor:default;opacity:.55}
button.small{min-height:38px;padding:5px 12px;font-size:14px;font-family:var(--f-mono)}

/* portada */
.cover{background:radial-gradient(110% 80% at 85% -10%,rgba(79,227,176,.32),transparent 55%),radial-gradient(90% 70% at 5% 0%,rgba(127,216,238,.2),transparent 60%),radial-gradient(70% 60% at 45% -25%,rgba(150,120,255,.26),transparent 60%),var(--slab);
  color:var(--slab-ink);border:1.5px solid var(--line);border-radius:3px;position:relative;overflow:hidden;padding:22px clamp(16px,4vw,30px) 26px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.cover::before{content:"";position:absolute;inset:0;background:var(--topo) center/cover;pointer-events:none}
.cover>*{position:relative}
.cover .ref{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--f-mono);font-size:12.5px;color:var(--ice)}
.cover .kick{font-family:var(--f-mono);font-size:14px;color:var(--aur);font-weight:600}
.cover h1{margin:6px 0 0;font-family:var(--f-disp);font-weight:800;font-size:clamp(54px,14vw,104px);line-height:.88;text-transform:uppercase;text-wrap:balance}
.cover .org{grid-column:1/-1;font-size:15px;color:#b9d3dc;max-width:52ch}
.radar{width:clamp(130px,26vw,200px);aspect-ratio:1;position:relative;border-radius:50%;border:1.5px solid rgba(127,216,238,.7);
  background:repeating-radial-gradient(circle,transparent 0 22%,rgba(127,216,238,.38) 22% 22.8%),linear-gradient(rgba(127,216,238,.3),rgba(127,216,238,.3)) center/1px 100% no-repeat,linear-gradient(rgba(127,216,238,.3),rgba(127,216,238,.3)) center/100% 1px no-repeat,rgba(4,36,26,.35)}
.radar::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(79,227,176,.55),rgba(79,227,176,0) 28%,transparent 28%);animation:sweep 6s linear infinite}
.radar i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px rgba(255,106,61,.3)}
@keyframes sweep{to{transform:rotate(360deg)}}
@media (max-width:560px){.cover{grid-template-columns:minmax(0,1fr)}.radar{justify-self:end;grid-row:2;width:120px;margin-bottom:-4px}}
@media (prefers-reduced-motion:reduce){.radar::after{animation:none}}

/* targetes */
.card{border:1.5px solid var(--line);border-radius:3px;background:var(--paper);padding:18px clamp(14px,3vw,22px);display:flex;flex-direction:column;gap:14px}
.card .txt{display:grid;gap:10px;max-width:66ch}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-mono);font-size:13px;color:var(--ink-soft);font-weight:600}
input[type=text]{border:1.5px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);padding:8px 12px;font-family:var(--f-mono);font-weight:600;font-size:18px;min-width:0;max-width:100%}
input.name{font-family:var(--f-body);font-weight:400;font-size:19px;width:100%}
.warn{display:grid;grid-template-columns:2.2rem 1fr;border:1.5px solid var(--line);border-radius:3px;overflow:hidden;background:var(--paper)}
.warn i{background:repeating-linear-gradient(-45deg,var(--warn) 0 9px,#0b1f2c 9px 18px)}
.warn p{padding:10px 14px;font-weight:600}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.rules b{font-family:var(--f-mono);background:var(--slab);color:var(--aur);padding:1px 8px;border-radius:2px;font-size:13px;margin-top:3px}

/* HUD */
.hud{border:1.5px solid var(--line);border-radius:3px;background:var(--paper);padding:12px 14px;display:grid;gap:10px}
.hud-row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between;font-family:var(--f-mono);font-size:13px;font-weight:600}
.hud-row b{font-family:var(--f-disp);font-size:24px;font-weight:800;margin-left:4px}
.meter{height:14px;border:1.5px solid var(--line);border-radius:2px;background:var(--cell);overflow:hidden}
.meter>i{display:block;height:100%;width:100%;background:var(--aur);transition:width .5s ease,background-color .5s ease}
.meter.mid>i{background:#f0b429}.meter.low>i{background:var(--warn)}
.tagx{border:1.5px solid var(--line);border-radius:2px;padding:1px 9px;font-family:var(--f-mono);font-size:12.5px;font-weight:600;background:var(--slab);color:var(--aur)}
.tagx.w{background:var(--warn);color:#1a0a04}
.map{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.node{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.node .c{width:32px;height:32px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:19px;background:var(--paper)}
.node .nm{font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.1;overflow-wrap:anywhere}
.node.now .c{background:var(--aur);color:var(--on-aur);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--line)}
.node.ok .c{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.node.part .c{background:#fbeab9;border-color:#a77a00;color:#6b4e00}
.node.bad .c{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .node.part .c{background:#3a2f0a;color:#f0b429;border-color:#f0b429}}
:root[data-theme="dark"] .node.part .c{background:#3a2f0a;color:#f0b429;border-color:#f0b429}
@media (max-width:560px){.node .nm{display:none}}

/* repte */
.repte{border:1.5px solid var(--line);border-radius:3px;background:var(--paper);overflow:hidden}
.rh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--slab);color:var(--slab-ink);padding:12px 16px 12px 12px}
.rn{width:58px;height:58px;display:grid;place-items:center;background:var(--aur);color:var(--on-aur);font-family:var(--f-disp);font-weight:800;font-size:38px;border-radius:2px;line-height:1}
.rh h3{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(24px,5.5vw,32px);line-height:1;text-wrap:balance}
.rh .topic{font-family:var(--f-mono);font-size:12.5px;color:var(--ice);margin-top:3px}
.pts{font-family:var(--f-disp);font-weight:800;font-size:34px;line-height:.9;text-align:right;color:var(--aur)}
.pts small{display:block;font-family:var(--f-mono);font-weight:500;font-size:11.5px;color:#b9d3dc;margin-top:3px}
.term{background:var(--slab-2);color:var(--ice);font-family:var(--f-mono);font-size:12.5px;padding:7px 16px;overflow-wrap:anywhere}
.term::before{content:"AURORA> ";color:var(--aur);font-weight:600}.term::after{content:"_";color:var(--aur)}
.rb{padding:16px clamp(14px,3vw,20px) 20px;display:grid;gap:14px}
.story{display:grid;gap:10px;max-width:66ch}
.note{border:1.5px solid var(--line);border-left:6px solid var(--warn);border-radius:3px;padding:9px 14px;background:var(--cell);font-size:15.5px;max-width:66ch}
.data{border:1.5px dashed var(--ink-soft);border-radius:3px;padding:12px 16px;display:grid;gap:4px;background:var(--cell)}
.data b{font-family:var(--f-mono)}
.grp{font-weight:700;margin-top:6px}
.parts{display:grid;gap:12px}
.part{border:1.5px solid var(--rule);border-radius:3px;padding:10px 12px 12px;display:grid;gap:8px;background:var(--paper)}
.part.ok{border-color:var(--ok);background:var(--okbg)}
.part.bad{border-color:var(--bad);background:var(--badbg)}
.part.rev{border-color:var(--ink-soft);border-style:dashed}
.ph{display:flex;gap:10px;align-items:baseline}
.ph>b{font-family:var(--f-mono);font-size:13px;color:var(--ink-soft);min-width:1.4rem}
.pq{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.pfb{font-size:15px;display:grid;gap:3px;min-height:0}
.pfb:empty{display:none}
.pfb .st{font-family:var(--f-mono);font-weight:600;font-size:13px}
.part.ok .st{color:var(--ok)} .part.bad .st{color:var(--bad)}
.pfb .expl{color:var(--ink);max-width:62ch}
.ans{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans input[type=text]{width:8.5rem}
.ans input.wide{width:min(100%,22rem)}
.ans .pre{font-family:var(--f-mono);font-weight:600}
.pw{display:inline-flex;align-items:flex-start;gap:3px;font-family:var(--f-mono);font-weight:600;font-size:1.25rem}
.pw input[type=text]{width:3.6rem;font-size:16px;padding:4px 6px;margin-top:-6px;text-align:center}
.tog{font-family:var(--f-mono);font-size:14px}
.tog[aria-pressed="true"]{background:var(--slab);color:var(--aur)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{font-family:var(--f-mono);font-weight:600;font-size:17px;min-width:3.4rem}
.choices button[aria-pressed="true"]{background:var(--aur);color:var(--on-aur)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tiles button{font-family:var(--f-mono);font-weight:600;font-size:18px;min-width:3.4rem;min-height:48px}
.tiles button.used,.tiles button.used:disabled{background:var(--slab);color:var(--aur);opacity:1}
.seq{font-family:var(--f-mono);font-weight:600;min-height:1.7em;overflow-wrap:anywhere}
.tray{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:48px}
.chipd{font-family:var(--f-mono);font-weight:600;border:1.5px solid var(--line);background:var(--slab);color:var(--aur);border-radius:3px;padding:6px 12px;min-height:44px}
.chipd[aria-pressed="true"]{background:var(--aur);color:var(--on-aur);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--line)}
.nl{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));margin-top:4px}
.nc{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.mk{height:2rem;display:flex;align-items:flex-end;justify-content:center}
.mk .chipd{padding:2px 1px;min-height:0;min-width:0;width:100%;font-size:11.5px;text-align:center;border-radius:2px}
.mk .chipd.badm{background:var(--bad);color:#fff}
.nc>button{border:0;background:transparent;padding:0;min-height:52px;position:relative;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-family:var(--f-mono);font-size:11.5px;font-weight:600;gap:2px}
.nc>button::before{content:"";width:100%;height:0;border-top:2.5px solid var(--ink)}
.nc>button::after{content:"";position:absolute;top:-6px;width:2px;height:15px;background:var(--ink)}
.nc.zero>button::after{height:21px;top:-9px;width:3px}
.nc>button:hover:not(:disabled):not([aria-pressed="true"]):not(.used){background:var(--cell)}
.chipd:hover:not(:disabled):not([aria-pressed="true"]){background:var(--slab-2)}
.nc>button:disabled{opacity:1}
.nc:first-child>button::before{border-top-style:dashed}
.hintline{font-size:14px;color:var(--ink-soft)}
.rt{display:inline-flex;align-items:flex-end;vertical-align:baseline;line-height:1}
.rad{width:.78em;height:1.3em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:square;stroke-linejoin:miter;margin-right:-.04em}
.rx{border-top:.09em solid currentColor;padding:.12em .18em 0 .14em;line-height:1.1}

.act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.msg{font-weight:700;min-height:1.4em}
.tip{border:1.5px solid var(--line);border-radius:3px;background:var(--cell);padding:10px 14px;font-size:15.5px;max-width:66ch}
.fx{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:3px;padding:3px 12px;font-family:var(--f-mono);font-size:13px;font-weight:600;background:var(--paper)}
.chip.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.chip.badc{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.pill{display:inline-block;border:1.5px solid var(--line);border-radius:3px;padding:1px 10px;font-family:var(--f-mono);font-size:12.5px;font-weight:700;background:var(--aur);color:var(--on-aur)}
.pill.bad{background:var(--warn);color:#1a0a04}.pill.part{background:#f0b429;color:#2a1d00}
.kicker{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:15px;color:var(--ink-soft)}
.kicker b{color:var(--ink)}

/* final */
.big{font-family:var(--f-disp);font-weight:800;font-size:clamp(44px,12vw,76px);line-height:.9}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:1.5px solid var(--line);border-radius:3px;padding:10px 12px;background:var(--cell);display:flex;flex-direction:column;min-width:0}
.stat b{font-family:var(--f-disp);font-size:30px;font-weight:800;line-height:1}
.stat span{font-size:13.5px;color:var(--ink-soft);font-family:var(--f-mono)}
.recap{display:grid;gap:6px}
.recap div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:7px 12px;border:1.5px solid var(--line);border-radius:3px;background:var(--cell)}
.recap div.ok{background:var(--okbg);border-color:var(--ok)}.recap div.bad{background:var(--badbg);border-color:var(--bad)}.recap div.part{background:var(--cell)}
.recap b{font-family:var(--f-mono);font-size:13px}.recap em{font-style:normal;font-family:var(--f-mono);font-size:13px;font-weight:600}
.review{display:grid;gap:8px}
.review>div{border:1.5px solid var(--line);border-radius:3px;padding:10px 14px;background:var(--cell);display:grid;gap:3px}
.copybox{font-family:var(--f-mono);font-size:13px;border:1.5px dashed var(--ink-soft);border-radius:3px;padding:10px 14px;background:var(--paper);overflow-wrap:anywhere}
@media (max-width:520px){
  .stats{grid-template-columns:minmax(0,1fr)}
  .rh{grid-template-columns:auto minmax(0,1fr)}
  .rh .pts{grid-column:1/-1;text-align:left;display:flex;gap:8px;align-items:baseline}.pts small{margin:0}
  .rn{width:50px;height:50px;font-size:32px}
}

    </div>
    <div class="meter" id="meter" role="img" aria-label="Integritat de la base"><i id="meterFill"></i></div>
    <div class="map" id="map" aria-label="Reptes de la missió"></div>
  </section>
  <main id="main"></main>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const MN='−';
const sg=n=>n<0?MN+Math.abs(n):String(n);
const sp=(b,e)=>b+'<sup>'+e+'</sup>';
const ex=s=>'<span class="ex">'+s+'</span>';
const RAD=n=>'<span class="rt" role="img" aria-label="arrel quadrada de '+n+'"><svg class="rad" viewBox="0 0 14 20" aria-hidden="true"><path d="M1 12 L4 10 L7.5 18.5 L13.5 1 L14 1"/></svg><span class="rx">'+n+'</span></span>';
const fp=x=>String(Math.round(x*100)/100).replace('.',',');
const SHORT=['Radar','Reactors','Energia','Nucli','Bateries','Estalvi','Portes','Combustible'];
const FLAGS={fosc:'Mode fosc: sense pistes al repte 5',sensecom:'Comunicacions caigudes',fred:'Interior fred',portes:'Portes lentes',racio:'Combustible mal comptat'};
const FLAGSHORT={fosc:'Mode fosc',sensecom:'Sense comunicacions',fred:'Interior fred',portes:'Portes lentes',racio:'Combustible'};
const nf=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');

/* ---------- lectura i correcció ---------- */
function pint(s){s=String(s).trim().replace(/[−–—﹣－]/g,'-').replace(/\s+/g,'');return /^[+-]?\d+$/.test(s)?parseInt(s,10):null;}
function exprOK(t,E){let s=String(t).replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/=\d+$/,'');
  if(!/^[0-9+\-()]+$/.test(s))return false;
  const nums=(s.match(/\d+/g)||[]).map(Number).sort((a,b)=>a-b);
  if(nums.join()!==E.nums.slice().sort((a,b)=>a-b).join())return false;
  if(/^[+-]/.test(s)&&s[0]==='-')return false;
  try{const v=Function('"use strict";return ('+s.replace(/\+\+/g,'+').replace(/-\+/g,'-').replace(/\+-/g,'-').replace(/--/g,'+')+')')();return v===E.val;}catch(e){return false;}}
function check(p,v){
  switch(p.type){
    case 'num':case 'pow':{const n=pint(v.text);return n!==null&&n===p.answer;}
    case 'choice':return v.val===p.answer;
    case 'order':return v.val.length===p.nums.length&&v.val.every((x,i)=>x===p.sorted[i]);
    case 'line':return p.nums.every(n=>v.val[n]===n);
    case 'expr':return exprOK(v.text,p.expr);
  }
  return false;
}
function isEmpty(p,v){
  switch(p.type){
    case 'choice':return v.val===null;
    case 'order':return v.val.length===0;
    case 'line':return Object.keys(v.val).length===0;
    default:return v.text.trim()==='';
  }
}
const LT=ex('&lt;'),GT=ex('&gt;'),EQ=ex('=');
const cmp=(a,b,ans,why)=>({type:'choice',cmp:true,prompt:ex(a+' ? '+b),opts:[{v:'<',t:'&lt;'},{v:'>',t:'&gt;'},{v:'=',t:'='}],answer:ans,explain:why});

/* ---------- reptes ---------- */
const P=(o)=>o;
const BASE='<svg viewBox="0 0 28 24" width="26" height="22" aria-hidden="true" style="margin-top:3px"><path d="M3 21 V14 A11 11 0 0 1 25 14 V21 Z" fill="var(--slab)" stroke="var(--ink)" stroke-width="1.5"/><path d="M14 3 V9 M10 5 H18" stroke="var(--ink)" stroke-width="1.6"/><rect x="11" y="15" width="6" height="6" fill="var(--aur)"/></svg>';
const REPTES=[
 {n:1,name:'Sistema de localització',topic:'Recta numèrica',pts:1,term:'RADAR EN LÍNIA. 5 DRONS SENSE SENYAL.',
  intro:["Els sensors detecten diversos drons de reconeixement avariats en diferents posicions de les instal·lacions. Els drons apareixen a la pantalla del radar sobre una recta lluminosa. La base és el punt de partida (el 0) i cada marca és una unitat. Cada dron porta un codi:"],
  data:'<b>'+[9,2,5,12,7].join(' , ')+'</b>',
  hint:"La base és el 0 i cada marca de la recta és una unitat més. Per situar el dron 5, compta cinc marques des de la base. Com més lluny de la base, més gran és el nombre.",
  parts:[
   P({label:'1',type:'line',prompt:'Representa en la recta numèrica les posicions dels drons.',nums:[9,2,5,12,7],explain:'Cada dron va a tantes marques de la base com indica el seu codi.'}),
   P({label:'2',type:'choice',prompt:'Indica quin dron està més lluny de la base.',opts:[9,2,5,12,7].map(n=>({v:n,t:String(n)})),answer:12,explain:'Està més lluny de la base el dron amb el nombre més gran: el 12.'}),
   P({label:'3',type:'order',prompt:"Ordena'ls de menor a major per prioritzar-ne la recuperació.",nums:[9,2,5,12,7],explain:'2 &lt; 5 &lt; 7 &lt; 9 &lt; 12. A la recta, com més a la dreta, més gran.'})],
  out:{ok:{title:'El radar els recupera tots',text:["Les posicions són correctes i els cinc drons tornen a la base. Un d'ells porta un manual tècnic al disc: tens una pista més."]},
       part:{title:'El radar en perd alguns',text:["Part dels drons es recuperen. La resta queden perduts a la ventisca i el sistema perd precisió."]},
       bad:{title:'El radar es descalibra',text:["Els drons es mouen a les posicions equivocades i es perden entre la neu. La base s'ha quedat sense ulls."]}},
  eff:{ok:{p:1},part:{},bad:{}}},
 {n:2,name:"Control d'estabilitat",topic:'Comparar i arrodonir',pts:1.5,term:'VIBRACIÓ CRÍTICA ALS REACTORS. COMPARA LES LECTURES.',
  intro:["La vibració excessiva dels reactors pot provocar que acabin explotant. Per mantenir-los sota control, el sistema ha de comparar les lectures dels sensors i registrar-les arrodonides:"],
  hint:"Compara xifra a xifra, començant per l'esquerra, fins que en trobis una de diferent. Per arrodonir, mira la xifra que ve just després: si és 5 o més, puges; si és menys de 5, et quedes.",
  parts:[
   Object.assign(cmp(nf(4807),nf(4870),'<','Coincideixen fins a les centenes. A les desenes, 0 &lt; 7: '+nf(4807)+' &lt; '+nf(4870)+'.'),{label:'a',group:'Compara les lectures de dos sensors (marca <, > o =):'}),
   Object.assign(cmp(nf(15060),nf(15006),'>','Coincideixen fins a les centenes. A les desenes, 6 &gt; 0: '+nf(15060)+' &gt; '+nf(15006)+'.'),{label:'b'}),
   Object.assign(cmp('3'+' '+'000 + 500 + 4',nf(3504),'=','3 000 + 500 + 4 = 3 504, per tant són iguals.'),{label:'c'}),
   P({label:'a',group:'Arrodoneix les lectures per al registre:',type:'num',prompt:ex(nf(48637))+' a les <b>centenes</b>',answer:48600,explain:'La xifra de les desenes és 3 (menys de 5): es queda. '+nf(48600)+'.'}),
   P({label:'b',type:'num',prompt:ex(nf(7951))+' als <b>milers</b>',answer:8000,explain:'La xifra de les centenes és 9 (5 o més): puja. '+nf(8000)+'.'})],
  out:{ok:{title:'Els reactors es calmen',text:["Les lectures queden ben registrades i les vibracions baixen fins a un brunzit suau. Tens una pista més."]},
       part:{title:'Vibracions dins de límits',text:["El registre té alguns errors, però els reactors continuen dins dels límits de seguretat."]},
       bad:{title:'Una esquerda al mur',text:["Amb les lectures mal registrades, les vibracions esquerden un dels murs del reactor. Hi ha una fuita de calor i perds una pista de la consola."]}},
  eff:{ok:{p:1},part:{},bad:{p:-1}}},
 {n:3,name:"Transferència d'energia",topic:'Operacions combinades (jerarquia)',pts:1.5,term:'SOBRECÀRREGA ALS SERVIDORS. EVITA EL COL·LAPSE.',
  pre:(S)=>S.results.r2==='bad'?['Les esquerdes del reactor fan soroll a la xarxa elèctrica: el sistema té menys capacitat de resposta.']:[],
  intro:["Ara que has controlat les vibracions, el perill és que arriba massa energia als servidors. Has d'evitar les sobrecàrregues perquè no col·lapsin. Per això, calcula correctament les operacions següents, respectant la jerarquia: primer multiplicacions i divisions, i després sumes i restes."],
  hint:"Sense parèntesis, primer es fan les multiplicacions i les divisions (d'esquerra a dreta) i després les sumes i les restes. Exemple: 2 + 3 · 4 = 2 + 12 = 14.",
  parts:[
   P({label:'1',type:'num',prompt:ex('18 + 6 · 4'),answer:42,explain:'18 + 6 · 4 = 18 + 24 = 42.'}),
   P({label:'2',type:'num',prompt:ex('50 '+MN+' 24 : 6'),answer:46,explain:'50 '+MN+' 24 : 6 = 50 '+MN+' 4 = 46.'}),
   P({label:'3',type:'num',prompt:ex('7 · 8 '+MN+' 36 : 9'),answer:52,explain:'7 · 8 '+MN+' 36 : 9 = 56 '+MN+' 4 = 52.'}),
   P({label:'4',type:'num',prompt:ex('45 : 5 + 3 · 12 '+MN+' 10'),answer:35,explain:'45 : 5 + 3 · 12 '+MN+' 10 = 9 + 36 '+MN+' 10 = 45 '+MN+' 10 = 35.'})],
  out:{ok:{title:'Els servidors aguanten',text:["L'energia sobrant es desvia cap als acumuladors del subsòl. Els servidors no col·lapsen."]},
       part:{title:'Es cremen alguns servidors',text:["Alguns servidors es cremen, però la xarxa central aguanta."]},
       bad:{title:'Els servidors cauen',text:["La sobrecàrrega fon els servidors de comunicacions. La base queda aïllada de l'exterior."]}},
  eff:{ok:{},part:{},bad:{flag:'sensecom'}}},
 {n:4,name:'Nucli central',topic:'Operacions combinades (parèntesis i claudators)',pts:2,term:'NUCLI INESTABLE. ORDRE D\'OPERACIONS REQUERIT.',
  intro:["Malgrat els teus esforços, el nucli està a punt d'explotar! Necessites resoldre a tot córrer aquestes operacions combinades mitjançant càlculs precisos seguint l'ordre correcte, o tot estarà perdut:"],
  hint:"Primer el que hi ha dins dels parèntesis i dels claudators, de dins cap a fora. Després multiplicacions i divisions, d'esquerra a dreta. Al final sumes i restes.",
  parts:[
   P({label:'1',type:'num',prompt:ex('(18 + 6) · 4'),answer:96,explain:'(18 + 6) · 4 = 24 · 4 = 96.'}),
   P({label:'2',type:'num',prompt:ex('60 : (3 + 7) + 2 · 5'),answer:16,explain:'60 : (3 + 7) + 2 · 5 = 60 : 10 + 10 = 6 + 10 = 16.'}),
   P({label:'3',type:'num',prompt:ex('3 · (14 '+MN+' 5) + 40 : 8'),answer:32,explain:'3 · (14 '+MN+' 5) + 40 : 8 = 3 · 9 + 5 = 27 + 5 = 32.'}),
   P({label:'4',type:'num',prompt:ex('100 '+MN+' [20 + (9 '+MN+' 4) · 6] : 2'),answer:75,explain:'100 '+MN+' [20 + 5 · 6] : 2 = 100 '+MN+' [20 + 30] : 2 = 100 '+MN+' 50 : 2 = 100 '+MN+' 25 = 75.'})],
  out:{ok:{title:'Nucli estabilitzat',text:["Fas la seqüència sense errors i el nucli passa a una parada controlada. Tens una pista més."]},
       part:{title:'Apagada brusca',text:["El nucli s'estabilitza, però s'apaga de cop. La base queda a les fosques i la consola d'ajuda deixa de respondre."]},
       bad:{title:'El nucli gairebé explota',text:["El nucli s'apaga en un cop sec que sacseja tota la base. Queda tot a les fosques i la consola d'ajuda deixa de respondre."]}},
  eff:{ok:{p:1},part:{flag:'fosc'},bad:{flag:'fosc'}}},

/* ---------- estat ---------- */
let S;
function newState(){S={name:'',i:0,integ:100,pistes:2,pts:0,flags:{},results:{},tries:{},story:[],miss:[],extra:null,cur:null,flow:['intro','brief','r1','r2','r3','r4','r5','r6','r7','r8','extra','final']};}
const main=$('main');
function screen(h){main.innerHTML=h;window.scrollTo(0,0);}
function go(){S.i++;enter(S.flow[S.i]);}
function enter(id){drawHud();
  if(id==='intro')return screenIntro();if(id==='brief')return screenBrief();
  if(id==='extra')return screenRepte(EXTRA,true);if(id==='final')return screenFinal();
  screenRepte(REPTES[+id.slice(1)-1]);}
function drawHud(){
  const id=S.flow[S.i];const on=/^r\d$|^extra$/.test(id);$('hud').hidden=!on;
  const v=S.integ;$('integTxt').textContent=v+' %';$('meterFill').style.width=v+'%';
  $('meter').className='meter'+(v<35?' low':v<65?' mid':'');
  $('pistTxt').textContent='Pistes: '+S.pistes;
  $('flagRow').innerHTML=Object.keys(S.flags).filter(k=>S.flags[k]).map(k=>'<span class="tagx w" title="'+FLAGS[k]+'">'+FLAGSHORT[k]+'</span>').join(' ');
  const cur=/^r\d$/.test(id)?+id[1]:(id==='extra'?9:0);const mp=$('map');mp.innerHTML='';
  for(let n=1;n<=8;n++){const st=S.results['r'+n];const d=document.createElement('div');
    d.className='node'+(st?' '+st:'')+(!st&&cur===n?' now':'');
    d.innerHTML='<span class="c">'+n+'</span><span class="nm">'+SHORT[n-1]+'</span>';
    d.setAttribute('aria-label','Repte '+n+', '+SHORT[n-1]+(st==='ok'?', superat':st==='part'?', parcial':st==='bad'?', fallit':''));mp.appendChild(d);}
}

/* ---------- components d'apartat ---------- */
function mkPart(p){
  const el=document.createElement('div');el.className='part';
  el.innerHTML='<div class="ph"><b>'+p.label+'</b><div class="pq"><span>'+p.prompt+'</span></div></div><div class="pbody"></div><div class="pfb" aria-live="polite"></div>';
  const body=el.querySelector('.pbody');const pq=el.querySelector('.pq');
  const o={el,locked:false};
  const mkInput=(cls)=>{const i=document.createElement('input');i.type='text';i.autocomplete='off';i.setAttribute('inputmode','text');i.setAttribute('aria-label','Resposta '+p.label);if(cls)i.className=cls;return i;};
  if(p.type==='num'||p.type==='frac'||p.type==='pow'||p.type==='expr'){
    const wrap=document.createElement('div');wrap.className='ans';let inp;
    if(p.type==='pow'){const pw=document.createElement('span');pw.className='pw';pw.innerHTML='<span>'+p.base+'</span>';inp=mkInput();pw.appendChild(inp);wrap.appendChild(pw);}
    else{inp=mkInput(p.type==='expr'?'wide':'');if(p.type==='expr')inp.placeholder='250 − …';wrap.appendChild(inp);}
    body.appendChild(wrap);
    o.read=()=>({text:inp.value});
    o.lock=()=>{inp.disabled=true;};
    o.fill=()=>{if(p.type==='expr')inp.value=p.expr.nums[0]+' '+MN+' '+p.expr.nums[1]+' + '+p.expr.nums[2]+' '+MN+' '+p.expr.nums[3];else inp.value=String(p.answer);};
    o.focus=()=>inp.focus({preventScroll:true});
  }else if(p.type==='choice'||p.type==='multi'){
    const ch=document.createElement('div');ch.className='choices';let val=p.type==='choice'?null:[];const bs=[];
    p.opts.forEach(op=>{const b=document.createElement('button');b.type='button';b.innerHTML=op.t;b.setAttribute('aria-pressed','false');if(p.cmp)b.setAttribute('aria-label',op.v==='<'?'menor que':op.v==='>'?'major que':'igual a');
      b.onclick=()=>{if(p.type==='choice'){val=op.v;bs.forEach(x=>x.setAttribute('aria-pressed',x===b));}else{const k=val.indexOf(op.v);if(k>=0)val.splice(k,1);else val.push(op.v);b.setAttribute('aria-pressed',k<0);}};
      ch.appendChild(b);bs.push(b);b._v=op.v;});
    body.appendChild(ch);
    o.read=()=>({val:p.type==='choice'?val:val.slice()});
    o.lock=()=>bs.forEach(b=>b.disabled=true);
    o.fill=()=>{const ans=p.type==='choice'?[p.answer]:p.answer;val=p.type==='choice'?p.answer:ans.slice();bs.forEach(b=>b.setAttribute('aria-pressed',ans.includes(b._v)));};
    o.focus=()=>bs[0].focus({preventScroll:true});
  }else if(p.type==='order'){
    const seq=document.createElement('div');seq.className='seq';seq.setAttribute('aria-live','polite');const tiles=document.createElement('div');tiles.className='tiles';
    let val=[];const bs=[];const draw=()=>{seq.textContent=val.length?val.map(sg).join(' < '):'Toca els nombres de menor a major';bs.forEach(b=>{b.classList.toggle('used',val.includes(b._v));b.disabled=o.locked||val.includes(b._v);});};
    p.nums.forEach(n=>{const b=document.createElement('button');b.type='button';b.textContent=sg(n);b._v=n;b.onclick=()=>{val.push(n);draw();};tiles.appendChild(b);bs.push(b);});
    const clr=document.createElement('button');clr.type='button';clr.className='small';clr.textContent='Esborrar';clr.onclick=()=>{val=[];draw();};
    body.appendChild(tiles);body.appendChild(seq);body.appendChild(clr);draw();
    o.read=()=>({val:val.slice()});o.lock=()=>{o.locked=true;clr.disabled=true;draw();};
    o.fill=()=>{val=p.sorted.slice();draw();};o.focus=()=>bs[0].focus({preventScroll:true});
  }else if(p.type==='line'){
    const tray=document.createElement('div');tray.className='tray';const nl=document.createElement('div');nl.className='nl';
    const placed={};let sel=null;const hl=document.createElement('p');hl.className='hintline';
    const cols=[];const bad=new Set();
    for(let t=0;t<=12;t++){const c=document.createElement('div');c.className='nc'+(t===0?' zero':'');c.innerHTML='<div class="mk"></div>';
      const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',t===0?'La base (el 0)':'Marca '+t+' comptant des de la base');b.innerHTML=t===0?BASE:'';b.style.paddingTop='6px';
      b.onclick=()=>{if(o.locked)return;tickClick(t);};c.appendChild(b);nl.appendChild(c);cols.push({t,c,b,mk:c.firstChild});}
    function tickClick(t){const there=Object.keys(placed).find(k=>placed[k]===t);
      if(sel!==null){if(there!==undefined&&+there!==sel)delete placed[there];placed[sel]=t;sel=null;}
      else if(there!==undefined){sel=+there;delete placed[there];}
      draw();}
    function draw(){tray.innerHTML='';
      p.nums.forEach(n=>{if(placed[n]!==undefined)return;const b=document.createElement('button');b.type='button';b.className='chipd';b.textContent=sg(n);b.setAttribute('aria-pressed',sel===n);b.setAttribute('aria-label','Dron '+sg(n));b.disabled=o.locked;b.onclick=()=>{sel=sel===n?null:n;draw();};tray.appendChild(b);});
      cols.forEach(({t,mk,b})=>{mk.innerHTML='';const n=Object.keys(placed).find(k=>placed[k]===t);
        if(n!==undefined){const ch=document.createElement('button');ch.type='button';ch.className='chipd'+(bad.has(+n)?' badm':'');ch.textContent=sg(+n);ch.disabled=o.locked;ch.setAttribute('aria-label','Dron '+sg(+n)+' a la marca '+sg(t));ch.onclick=()=>{if(o.locked)return;tickClick(t);};mk.appendChild(ch);}
        b.disabled=o.locked;});
      hl.textContent=o.locked?'':sel!==null?'Ara toca la marca de la recta on va el dron '+sg(sel)+'.':(tray.children.length?'Tria un dron i toca la seva marca a la recta.':'Pots tocar un dron de la recta per moure\'l.');}
    body.appendChild(tray);body.appendChild(nl);body.appendChild(hl);draw();
    o.read=()=>({val:Object.assign({},placed)});o.lock=()=>{o.locked=true;draw();};
    o.mark=(v)=>{bad.clear();p.nums.forEach(n=>{if(v.val[n]!==n)bad.add(n);});draw();};
    o.fill=()=>{bad.clear();p.nums.forEach(n=>placed[n]=n);sel=null;draw();};o.focus=()=>{};
  }
  o.setState=(cls,fb)=>{el.className='part'+(cls?' '+cls:'');el.querySelector('.pfb').innerHTML=fb||'';};
  return o;
}

function screenRepte(R,isExtra){

  const pre=R.pre?R.pre(S):[];
  const fosc=R.n===5&&S.flags.fosc;
  const group=[];let lastG=null;
  let html='<section class="repte" aria-label="Repte '+R.n+'"><div class="rh"><div class="rn">'+(isExtra?'+':R.n)+'</div><div><h3>'+R.name+'</h3><div class="topic">'+R.topic+'</div></div><div class="pts">'+(isExtra?'extra':fp(R.pts))+'<small>'+(isExtra?'voluntària':(R.pts===1?'punt':'punts'))+'</small></div></div>'
   +'<div class="term">'+R.term+'</div><div class="rb">'
   +'<div class="story">'+R.intro.map(t=>'<p>'+t+'</p>').join('')+'</div>'
   +(R.data?'<div class="data">'+(R.n===1?R.data:R.data)+'</div>':'')
   +pre.map(t=>'<p class="note">'+t+'</p>').join('')
   +'<div class="parts" id="parts"></div>'
   +'<p class="msg" id="msg" aria-live="polite"></p><div id="tipbox"></div>'
   +'<div class="act"><span>'+(R.hint?'<button type="button" class="small" id="hint"'+(fosc?' disabled':'')+'>Pista (−1)</button>':'')+'</span><span id="actw"><button class="primary" id="send" type="button">Enviar al sistema</button>'+(isExtra?' <button type="button" id="skip">Ometre</button>':'')+'</span></div>'
   +'</div></section>';
  screen(html);
  const cont=$('parts');
  R.parts.forEach(p=>{if(p.group&&p.group!==lastG){const g=document.createElement('p');g.className='grp';g.textContent=p.group;cont.appendChild(g);lastG=p.group;}
    const c=mkPart(p);cont.appendChild(c.el);st.parts.push({p,c,tries:0,done:false,res:null,pts:0});});
  const hint=$('hint');
  const updHint=()=>{if(!hint)return;hint.textContent='Pista (−1)';hint.disabled=fosc||S.pistes<1||st.pistaUsed;if(fosc)hint.title='La consola d\'ajuda no respon';else if(S.pistes<1)hint.title='No et queden pistes';};
  updHint();
  if(hint)hint.onclick=()=>{if(st.pistaUsed||S.pistes<1)return;st.pistaUsed=true;S.pistes--;drawHud();$('tipbox').innerHTML='<div class="tip"><b>Pista:</b> '+R.hint+'</div>';updHint();};
  if(isExtra)$('skip').onclick=()=>{S.extra='skip';go();};
  $('send').onclick=()=>submit(isExtra);
}
function submit(isExtra){
  const st=S.cur,R=st.R;if(st.done)return;
  const open=st.parts.filter(x=>!x.done);
  const empties=open.filter(x=>isEmpty(x.p,x.c.read()));
  if(empties.length&&!st.warned){st.warned=true;$('msg').textContent=empties.length===1?'Hi ha 1 apartat sense resposta. Si envies ara, comptarà com a error.':'Hi ha '+empties.length+' apartats sense resposta. Si envies ara, comptaran com a error.';$('msg').style.color='var(--bad)';empties[0].c.focus();return;}
  $('msg').style.color='';
  const w=isExtra?1:R.pts/R.parts.length;let okN=0;
  open.forEach(x=>{
    x.tries++;const v=x.c.read();const ok=check(x.p,v);
    if(ok){x.done=true;x.res=x.tries===1?'first':'second';x.pts=w*(x.tries===1?1:.5);x.c.lock();
      x.c.setState('ok','<span class="st">'+(x.tries===1?'Correcte':'Correcte al segon intent')+'</span><span class="expl">'+x.p.explain+'</span>');okN++;}
    else if(x.tries>=2){x.done=true;x.res='rev';x.pts=0;x.c.fill();x.c.lock();
      x.c.setState('rev','<span class="st">Solució</span><span class="expl">'+x.p.explain+'</span>');}
    else{x.c.setState('bad','<span class="st">Revisa-ho</span><span class="expl">Aquest apartat no és correcte. Torna-ho a provar.</span>');if(x.c.mark)x.c.mark(v);}
  });
  const left=st.parts.filter(x=>!x.done).length;
  if(left){$('msg').textContent=left===1?'Queda 1 apartat per revisar. És el teu segon i últim intent.':'Queden '+left+' apartats per revisar. És el teu segon i últim intent.';return;}
  st.done=true;
  const hintBtn=$('hint');if(hintBtn)hintBtn.disabled=true;
  $('msg').textContent='';
  $('actw').innerHTML='<button class="primary" id="next" type="button">'+(isExtra?'Veure el final':'Veure què passa')+'</button>';
  $('next').focus({preventScroll:true});$('next').onclick=()=>finish(isExtra);
}
function finish(isExtra){
  const st=S.cur,R=st.R;const earned=st.parts.reduce((a,x)=>a+x.pts,0);
  st.parts.forEach(x=>{if(x.res!=='first')S.miss.push({n:R.n,topic:R.topic,prompt:x.p.prompt,explain:x.p.explain,res:x.res});});
  if(isExtra){S.extra=earned>0?'ok':'fail';S.pts+=0;S.story.push({n:9,name:R.name,title:earned>0?'Dada recuperada':'Dada sense resoldre',tier:earned>0?'ok':'part',extra:true});
    screen('<section class="card"><div class="kicker"><span class="pill'+(earned>0?'':' part')+'">'+(earned>0?'Extra superada':'Extra fallada')+'</span><b>'+R.name+'</b></div><h2>'+(earned>0?'Dada recuperada':'Dada sense resoldre')+'</h2><div class="story"><p>'+(earned>0?'Resols l\'objectiu secundari i el terminal registra el resultat: 16 + 48 '+MN+' 9 = 55. Aquest punt extra queda anotat per apujar nota.':'El terminal queda sense resoldre. No passa res: era voluntari. La solució queda al resum final.')+'</p></div><button class="primary" id="go" style="align-self:flex-start">Veure el final</button></section>');
    $('go').onclick=go;return;}
  const pct=earned/R.pts;const tier=pct>=.75?'ok':pct>=.4?'part':'bad';
  const dmg=Math.round((1-pct)*R.pts*100/11);S.integ=Math.max(0,S.integ-dmg);S.pts+=earned;S.results['r'+R.n]=tier;
  const e=R.eff[tier]||{};const chips=[];
  if(dmg>0)chips.push({k:'badc',t:MN+dmg+' % d\'integritat'});
  if(e.p>0){S.pistes+=e.p;chips.push({k:'good',t:'+'+e.p+' pista'});}
  if(e.p<0&&S.pistes>0){S.pistes=Math.max(0,S.pistes+e.p);chips.push({k:'badc',t:MN+'1 pista'});}
  if(e.flag){S.flags[e.flag]=true;chips.push({k:'badc',t:FLAGS[e.flag]});}
  S.story.push({n:R.n,name:R.name,title:R.out[tier].title,tier,pts:earned,max:R.pts});
  drawHud();
  const o=R.out[tier];const next=S.flow[S.i+1];
  screen('<section class="card"><div class="kicker"><span class="pill'+(tier==='ok'?'':tier==='part'?' part':' bad')+'">'+(tier==='ok'?'Superat':tier==='part'?'Parcial':'Fallit')+'</span><b>Repte '+R.n+' · '+R.name+'</b><span class="mono">'+fp(earned)+' de '+fp(R.pts)+' punts</span></div>'
   +'<h2>'+o.title+'</h2><div class="story">'+o.text.map(t=>'<p>'+t+'</p>').join('')+'</div>'
   +(chips.length?'<div class="fx">'+chips.map(c=>'<span class="chip '+c.k+'">'+c.t+'</span>').join('')+'</div>':'')
   +(S.integ===0?'<p class="note">La integritat de la base ha arribat a 0. Encara pots acabar els reptes, però ja no hi ha manera de salvar la base.</p>':'')
   +'<button class="primary" id="go" style="align-self:flex-start">'+(next==='extra'?'Cap a la pregunta extra':'Repte '+(R.n+1))+'</button></section>');
  $('go').onclick=go;
}

/* ---------- final ---------- */
function screenFinal(){
  drawHud();const v=S.integ;
  const end=v>=80?{t:'Base Aurora fora de perill',x:"Les alarmes s'apaguen i els sistemes es reinicien. La base torna a ser operativa i l'equip pot respirar."}
    :v>=50?{t:'La base resisteix',x:"La base surt de la crisi amb danys importants, però continua dempeus. Caldrà reparar-la durant dies."}
    :v>0?{t:"Evacuació d'emergència",x:"No hi ha manera de salvar les instal·lacions. L'equip s'evacua cap als vehicles amb el que ha pogut agafar."}
    :{t:'La base ha volat',x:"Els errors acumulats superen la capacitat del sistema. Les instal·lacions no aguanten i la base ha volat per l'aire."};
  const fl=Object.keys(S.flags).filter(k=>S.flags[k]).map(k=>NOTE_FLAG[k]);
  const passed=Object.values(S.results).filter(x=>x==='ok').length;
  const sum='Missió Base Aurora'+(S.name?' · '+S.name:'')+' · Puntuació: '+fp(S.pts)+' / 11 · Integritat: '+v+' % · Reptes superats: '+passed+'/8 · Pregunta extra: '+(S.extra==='ok'?'correcta':S.extra==='fail'?'fallada':'no feta')+' · Apartats per repassar: '+S.miss.length;
  screen('<section class="card"><div class="kicker"><span class="pill'+(v>=50?'':v>0?' part':' bad')+'">'+(v>0?'Missió acabada':'Missió fallida')+'</span>'+(S.name?'<b>'+S.name+'</b>':'')+'</div>'
   +'<h2>'+end.t+'</h2><div class="story"><p>'+end.x+'</p>'+(fl.length?'<p>'+fl.join(' ')+'</p>':'')+'</div>'
   +'<div class="stats"><div class="stat"><b>'+fp(S.pts)+' / 11</b><span>Puntuació</span></div><div class="stat"><b>'+v+' %</b><span>Integritat de la base</span></div><div class="stat"><b>'+passed+' / 8</b><span>Reptes superats</span></div></div>'
   +(S.extra==='ok'?'<p class="tip"><b>Pregunta extra resolta:</b> punt extra per apujar nota.</p>':'')
   +'<h2>Què ha passat</h2><div class="recap">'+S.story.map(x=>'<div class="'+x.tier+'"><b>'+(x.extra?'Extra':'Repte '+x.n)+'</b><span>'+x.title+'</span><em>'+(x.extra?'':fp(x.pts)+'/'+fp(x.max))+'</em></div>').join('')+'</div>'
   +(S.miss.length?'<h2>Per repassar</h2><div class="review">'+S.miss.map(m=>'<div><b class="mono" style="font-size:13px">Repte '+m.n+' · '+m.topic+'</b><span>'+m.prompt+'</span><span>'+m.explain+'</span></div>').join('')+'</div>':'<p class="tip"><b>Cap apartat per repassar.</b> Ho has resolt tot a la primera.</p>')
   +'<h2>Resum per al professorat</h2><div class="copybox" id="sum"></div>'
   +'<div class="act"><button id="cp" type="button">Copiar resum</button><button class="primary" id="again" type="button">'+(v>0?'Tornar a jugar':'Tornar-ho a provar')+'</button></div><p class="msg" id="cpm" aria-live="polite"></p></section>');
  $('sum').textContent=sum;
  $('cp').onclick=()=>{const done=ok=>{$('cpm').textContent=ok?'Copiat!':'Selecciona el text i copia\'l manualment.';};
    try{navigator.clipboard.writeText(sum).then(()=>done(true),()=>done(false));}catch(e){done(false);}};
  $('again').onclick=()=>{const nm=S.name;newState();S.name=nm;S.i=1;enter('brief');};
}
window.__AURORA={get S(){return S}};
newState();enter('intro');
})();
</script>
