let S,LOG,RV;
function newState(nm){S={name:nm||'',res:START,results:{},story:[],totalQ:0,okQ:0,rooms:ROOMS,ri:0,room:null,order:[],nb:new Set(),extraRes:null,lastRes:START};LOG=KIT.newLog('escala-far-v2');LOG.name=S.name;}
const addRes=d=>{const o=S.res;S.res=Math.max(0,Math.min(START,S.res+d));hud();return S.res-o;};
const lit=()=>S.order.filter(id=>id!=='extra').length;
const mi=v=>v+(v===1?' milla':' milles');

/* ====================== maquetació ====================== */
const view=$('view'),dlg=$('dlg'),panel=$('panel');
function mode(m){document.body.dataset.mode=m;$('top').hidden=(m==='title'||m==='story');}
function setScene(h){view.innerHTML=h;ART.fx(view);}
function hud(){if(!S)return;
  $('hsea').innerHTML=ART.hudSea(S.res,lit());$('hmiles').innerHTML='<b>'+mi(S.res)+'</b><span>fins a les roques</span>';
  const lv=S.res<=8?'low':S.res<=16?'mid':'';$('hmiles').className='hmiles '+lv;
  $('trams').innerHTML=ROOMS.map((R,k)=>{const st=S.results[R.id];const cur=S.room&&S.room.R.id===R.id;
    return '<button type="button" class="tr'+(st?' '+st:'')+(cur&&!st?' now':'')+'" data-id="'+R.id+'"'+(st?'':' disabled')+' aria-label="'+R.name+(st==='ok'?', superat':st==='bad'?', amb problemes':'')+(st?'. Toca per revisar-lo':'')+'"><i>'+(k+1)+'</i></button>';}).join('');
  $('trams').querySelectorAll('button.tr:not(:disabled)').forEach(b=>b.onclick=()=>RV.openKey(b.dataset.id));
  $('bRev').hidden=!LOG.units.some(u=>u.items.length);$('bNb').classList.toggle('new',!!S.nbNew);}
/* diàlegs */
function line(l){const w=l.w;const t=(l.t||'').replace(/@NOM@/g,NM());
  return (w==='narr'?'':'<div class="pt">'+ART.portrait(w)+'</div>')+'<div class="dtx"><span class="who">'+(w==='jo'?esc(S.name||'Tu'):WHO[w])+'</span><p>'+t+'</p></div>';}
function speaking(w){view.classList.toggle('joan-talks',w==='joan');view.classList.toggle('rita-talks',w==='rita');}
function talk(lines,done,o){o=o||{};let i=0;
  const show=()=>{const l=lines[i];if(l.sc&&o.onScene)o.onScene(l.sc,i);if(l.nb)learn(l.nb);if(l.give)toast(ART.notebookIcon()+'<span>Has aconseguit el <b>quadern del farer</b></span>');
    dlg.className='dlg w-'+l.w;dlg.innerHTML=line(l)+'<div class="dbt">'+(o.skip&&i<lines.length-1?'<button type="button" class="small ghost" id="dSkip">Saltar la història</button>':'')
      +'<button type="button" class="primary" id="dNext">'+(i<lines.length-1?'Continua ▸':(o.endLabel||'Continua ▸'))+'</button></div>';
    speaking(l.w);const b=$('dNext');b.focus({preventScroll:true});
    b.onclick=()=>{i++;if(i<lines.length)show();else{speaking('');done&&done();}};
    if($('dSkip'))$('dSkip').onclick=()=>{lines.slice(i+1).forEach(x=>{if(x.nb)learn(x.nb,true);});i=lines.length-1;show();};};
  show();}
function say(w,t,cls){dlg.className='dlg w-'+w+(cls?' '+cls:'');dlg.innerHTML=line({w,t});speaking(w);clearTimeout(say._t);say._t=setTimeout(()=>speaking(''),3500);}
let toastT=0;function toast(h){const t=$('toast');t.innerHTML=h;t.hidden=false;t.classList.remove('in');void t.offsetWidth;t.classList.add('in');clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3200);}
/* quadern */
function learn(k,quiet){if(S.nb.has(k))return;S.nb.add(k);S.nbNew=true;hud();if(!quiet)toast(ART.notebookIcon()+'<span>Nova línia al quadern · <b>'+NBP[NB[k].p].split(' · ')[1]+'</b></span>');}
function openNb(){S.nbNew=false;hud();const o=$('nbov');o.hidden=false;
  o.innerHTML='<div class="nb" role="dialog" aria-modal="true" aria-labelledby="nbT"><div class="nb-h"><h2 id="nbT">El quadern del farer</h2><button type="button" class="small" id="nbX">Tancar</button></div><div class="nb-pages">'
    +[1,2,3].map(p=>{const ks=Object.keys(NB).filter(k=>NB[k].p===p);return '<section class="nb-p"><h3>'+NBP[p]+'</h3>'+ks.map(k=>S.nb.has(k)?'<div class="nb-l"><p>'+NB[k].t+'</p><p class="nb-ex">'+NB[k].ex+'</p></div>':'<div class="nb-l blank"><p>…</p></div>').join('')+'</section>';}).join('')
    +'</div><p class="nb-f">L\'avi Joan et dicta les línies a mesura que puges.</p></div>';
  $('nbX').focus({preventScroll:true});$('nbX').onclick=()=>{o.hidden=true;o.innerHTML='';};o.onclick=e=>{if(e.target===o){o.hidden=true;o.innerHTML='';}};}

/* ====================== pantalles ====================== */
function screenTitle(){mode('title');panel.innerHTML='';dlg.className='dlg';dlg.innerHTML='';
  setScene(ART.exterior({miles:30,lv:1,lit:0})+'<div class="title-card"><p class="kick">T2 · Criteris de divisibilitat · 1r ESO</p><h1>L\'Escala del Far</h1><p class="sub">Una aventura de farers, temporals i nombres divisibles</p>'
    +'<label for="nm">Com et dius, aprenent de farer?</label><input class="name" type="text" id="nm" maxlength="30" autocomplete="off" placeholder="Escriu el teu nom" value="'+esc(S&&S.name||'')+'">'
    +'<div class="tc-b"><button type="button" class="primary" id="go">Començar l\'aventura ▸</button></div></div>');
  const go=()=>{newState($('nm').value.trim());story();};$('go').onclick=go;$('nm').onkeydown=e=>{if(e.key==='Enter')go();};$('nm').focus({preventScroll:true});}
function story(){mode('story');let sc='';
  talk(STORY,()=>enterRoom(0),{skip:true,endLabel:'Cap al far ▸',onScene:s=>{if(s===sc)return;sc=s;setScene(s==='ext'?ART.exterior({miles:30,lv:1,lit:0}):ART.cottageIn());}});}
function stormOpts(){return {lv:ART.stormLv(S.res),shipLight:Math.min(1,(1-S.res/START))};}
function enterRoom(i){const R=i==='extra'?EXTRA:ROOMS[i];S.ri=i;S.room={R,qi:0,errs:0,dotres:[]};mode('full');hud();
  setScene(ART.room(R.id,Object.assign({walk:true},stormOpts())));panel.innerHTML='';
  const ctxTxt='<div class="story"><p>'+R.ctx+'</p></div>';
  talk(R.arrive(),()=>startChallenge(),{endLabel:R.extra?'Provar l\'enigma ▸':'Obrir el pany ▸'});
  if(R.extra){/* opció d'ometre al costat */const d=$('dlg');setTimeout(()=>{const b=document.createElement('button');b.type='button';b.className='small ghost';b.textContent='Ometre';b.onclick=()=>{S.extraRes='skip';screenFinal();};const bt=d.querySelector('.dbt');if(bt)bt.prepend(b);},0);}
  S.room.ctxHTML=ctxTxt;}
function startChallenge(){const rm=S.room,R=rm.R;rm.qs=R.gen();mode('split');
  KIT.unit(LOG,R.id,{label:R.extra?'+':String(S.order.length+1),title:R.name,topic:R.topic,context:rm.ctxHTML});
  hud();drawQuestion();}
const stepsOf=q=>q.steps;

/* ---------- preguntes per passos (motor 1G1) ---------- */
function skinFor(R,st){if(st.kind==='pick')return 'sk-'+(R.skin.pick||'paper');
  if(st.kind==='choice'&&st.options.every(o=>/^\d+$/.test(strip(o.html))))return 'sk-tiles';
  if(st.kind==='choice'&&st.options.length===2&&/^(Sí|No)/.test(strip(st.options[0].html)))return 'sk-yn';
  if(st.kind==='choice')return 'sk-talk';return 'sk-code';}
function drawQuestion(){
  const rm=S.room,R=rm.R,q=rm.qs[rm.qi],steps=stepsOf(q),multi=steps.length>1;
  const c=rm.cur={err:false,failed:false,done:false,hinted:false,attempts:[],tips:false,scratch:null};
  const dots=rm.qs.map((_,i)=>'<span class="'+(i<rm.qi?rm.dotres[i]:i===rm.qi?'now':'')+'"></span>').join('');
  const hasDiv=q.div&&q.div.length;
  const tools=(q.calc||hasDiv)?'<div class="k-tools">'+(q.calc?'<button type="button" class="small" id="scrBtn" aria-expanded="'+(!!hasDiv)+'" aria-controls="scrBox">✎ Esborrany</button>':'')
    +(hasDiv?'<button type="button" class="small" id="divBtn" aria-expanded="false" aria-controls="divBox">÷ Estratègies per dividir</button>':'')+'</div>'
    +(hasDiv?'<div id="divBox" hidden>'+KIT.divTipsHTML(q.div)+'</div>':'')+(q.calc?'<div id="scrBox"'+(hasDiv?'':' hidden')+'></div>':''):'';
  panel.innerHTML='<div class="qhead"><div class="kicker"><span class="pill">'+(R.extra?'Repte extra':R.short)+'</span><b>'+R.name+'</b></div><div class="dots" role="img" aria-label="Pany '+(rm.qi+1)+' de '+rm.qs.length+'">'+dots+'</div></div>'
    +'<div class="note-q"><p class="qprompt">'+q.prompt+'</p></div><div class="stps" id="stps"></div>'
    +'<p class="msg" id="msg" aria-live="polite"></p><div id="tipbox"></div>'+tools
    +'<div class="rowbtn"><span>'+(q.hint?'<button class="small" id="hint" type="button">'+ART.portrait('joan').replace('<svg ','<svg class="mini" ')+' Pregunta a l\'avi Joan (−1 milla)</button>':'')+'</span><span id="nxw"></span></div>';
  panel.scrollTop=0;
  const qt=(R.qtalk&&R.qtalk[rm.qi])||(rm.qi===0?R.during:null);if(qt)say('joan',qt);
  if(q.calc){const sc=KIT.Scratch(null,{ink:'#1d1d1b',height:200});c.scratch=sc.state;$('scrBox').appendChild(sc.el);
    $('scrBtn').onclick=()=>{const b=$('scrBox');b.hidden=!b.hidden;$('scrBtn').setAttribute('aria-expanded',String(!b.hidden));};}
  if(hasDiv)$('divBtn').onclick=()=>{const b=$('divBox');b.hidden=!b.hidden;$('divBtn').setAttribute('aria-expanded',String(!b.hidden));if(!b.hidden)c.tips=true;};
  const msg=(t,k)=>{const m=$('msg');m.textContent=t;m.className='msg'+(k?' '+k:'');};
  const shake=el=>{if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');};
  const stepCorrect=st=>st.kind==='num'?fmt(st.answer):st.kind==='pick'?(st.answer.slice().sort((a,b)=>a-b).map(fmt).join(', ')||'cap'):(()=>{const o=st.options.find(o=>o.ok);return o?(o.txt||o.html):'';})();
  function finishQ(){
    c.done=true;const correct=!c.failed;rm.dotres[rm.qi]=c.err?'bad':'ok';
    S.totalQ++;if(c.err)rm.errs++;else S.okQ++;
    const h=$('hint');if(h)h.disabled=true;
    msg(!c.err?'Correcte!':correct?'Ara sí.':'Aquesta se t\'ha resistit.',correct?'ok':'bad');
    const u=KIT.unit(LOG,R.id,{});
    u.items.push({label:String(rm.qi+1),prompt:q.prompt,attempts:c.attempts,res:!c.err?'first':correct?'second':'fail',
      correct:steps.map(s=>(multi?s.label+': ':'')+stepCorrect(s)).join(' · '),explain:steps.map(s=>s.fb).filter(Boolean).join('<br>'),
      hint:c.hinted?q.hint:null,tips:c.tips,scratch:c.scratch&&!KIT.scratchEmpty(c.scratch)?c.scratch:null});
    if(!c.err)say('joan',pick(GOOD)+(rm.qi+1<rm.qs.length?' Següent pany!':''));
    hud();
    const lastQ=rm.qi+1>=rm.qs.length;
    $('nxw').innerHTML='<button class="primary" id="nx" type="button">'+(lastQ?'Veure què passa ▸':'Següent pany ▸')+'</button>';
    $('nx').focus({preventScroll:true});$('nx').scrollIntoView({block:'nearest',behavior:RMo()?'auto':'smooth'});
    $('nx').onclick=()=>{if(lastQ)finishRoom();else{rm.qi++;drawQuestion();}};}
  function runStep(si){
    const st=steps[si];let tries=0,done=false;const skin=skinFor(R,st);
    const box=document.createElement('div');box.className='stp '+skin+(multi?' multi':'');
    box.innerHTML=(multi||st.ask?'<p class="stp-h">'+(multi?'<span class="stp-n">Pas '+(si+1)+' de '+steps.length+'</span> ':'')+(st.ask||'')+'</p>':'')+'<div class="stp-b"></div>'+(st.tips?'<div class="stp-tips"></div>':'')+'<div class="stp-fb" aria-live="polite"></div>';
    $('stps').appendChild(box);const body=box.querySelector('.stp-b');const fbEl=box.querySelector('.stp-fb');
    if(st.tips){const tb=box.querySelector('.stp-tips');tb.innerHTML='<div class="k-tools"><button type="button" class="small" aria-expanded="false">Pistes per decidir</button></div><div hidden>'+st.tips+'</div>';
      const bt=tb.querySelector('button'),bx=tb.lastElementChild;bt.onclick=()=>{bx.hidden=!bx.hidden;bt.setAttribute('aria-expanded',String(!bx.hidden));if(!bx.hidden)c.tips=true;};}
    const tag=t=>(multi?st.label+': ':'')+t;const ui={};
    function end(ok){done=true;if(!ok)c.failed=true;ui.lock(ok);
      fbEl.innerHTML='<span class="st '+(ok?'ok':'bad')+'">'+(ok?(tries===0?'Correcte!':'Ara sí!'):'Solució:')+'</span> '+(st.fb||'');
      fbEl.className='stp-fb '+(ok?'ok':'bad');box.classList.add('done');
      if(si+1<steps.length){msg('','');runStep(si+1);}else finishQ();}
    function miss(el,whyT){tries++;c.err=true;shake(el);
      if(q.single||tries>=2){end(false);say('joan','No passa res: mira la solució i aprèn-ne el truc.');return;}
      addRes(-1);msg((whyT?whyT+' ':'')+'Torna-ho a provar. La Sirena s\'acosta 1 milla.','bad');say('joan',pick(MISS));}
    const chkBtn=()=>{const B=document.createElement('button');B.type='button';B.className='primary chk';B.textContent='Comprovar';return B;};
    if(st.kind==='num'){
      const inp='<input type="text" inputmode="numeric" autocomplete="off" aria-label="La teva resposta"'+(st.inline?' class="k-inbox"':'')+'>';
      body.innerHTML=st.inline?'<div class="answer"><span class="expr inl">'+st.inline[0]+'<span class="k-qwrap">'+inp+'</span>'+st.inline[1]+'</span></div>':'<div class="answer">'+inp+'</div>';
      const I=body.querySelector('input'),B=chkBtn();body.querySelector('.answer').appendChild(B);
      const chk=()=>{if(done)return;const raw=I.value.replace(/[\s. ]/g,'');if(raw==='')return;const ok=/^\d+$/.test(raw)&&+raw===st.answer;
        c.attempts.push({text:tag(I.value.trim()),ok});if(ok){msg('','');end(true);}else{miss(I);if(!done)I.select();}};
      B.onclick=chk;I.onkeydown=e=>{if(e.key==='Enter')chk();};I.focus({preventScroll:true});
      ui.lock=ok=>{I.disabled=true;B.disabled=true;if(!ok)I.value=st.answer;};
    }else if(st.kind==='choice'){
      body.innerHTML='<div class="choices">'+st.options.map((o,i)=>'<button type="button" data-i="'+i+'">'+o.html+'</button>').join('')+'</div>';
      const bs=body.querySelectorAll('.choices button');
      bs.forEach(b=>b.onclick=()=>{if(done)return;const o=st.options[+b.dataset.i];c.attempts.push({text:tag(o.txt||strip(o.html)),ok:!!o.ok});
        if(o.ok){b.classList.add('right');msg('','');end(true);}else{b.classList.add('wrong');b.disabled=true;miss(b);}});
      ui.lock=()=>bs.forEach(b=>{b.disabled=true;if(st.options[+b.dataset.i].ok)b.classList.add('right');});
    }else if(st.kind==='pick'){
      const sel=new Set();
      body.innerHTML='<div class="pick'+(st.items.length>12?' dense':'')+'">'+st.items.map(n=>'<button type="button" aria-pressed="false" data-n="'+n+'"><span>'+fmt(n)+'</span></button>').join('')+'</div><p class="hintline">'+(st.pickHelp||(R.pickHelp&&R.pickHelp[rm.qi])||'Toca per marcar o desmarcar. Pots marcar-ne tants com calgui.')+'</p>';
      const bs=body.querySelectorAll('.pick button'),B=chkBtn();body.appendChild(B);
      bs.forEach(b=>b.onclick=()=>{if(done)return;const n=+b.dataset.n;if(sel.has(n))sel.delete(n);else sel.add(n);b.setAttribute('aria-pressed',String(sel.has(n)));b.classList.remove('wrong','miss');});
      const ans=new Set(st.answer);
      B.onclick=()=>{if(done)return;const v=[...sel].sort((a,b)=>a-b);const ok=v.length===ans.size&&v.every(x=>ans.has(x));
        c.attempts.push({text:tag(v.length?v.map(fmt).join(', '):'(cap)'),ok});
        if(ok){msg('','');end(true);return;}
        const extra=v.filter(x=>!ans.has(x)).length,falta=[...ans].filter(x=>!sel.has(x)).length;
        miss(body.querySelector('.pick'),(extra?'Has marcat '+extra+(extra===1?' nombre que no hi va':' nombres que no hi van'):'')+(extra&&falta?' i ':'')+(falta?(extra?'en ':'En ')+'falten '+falta:'')+'.');};
      ui.lock=()=>{B.disabled=true;bs.forEach(b=>{const n=+b.dataset.n;b.disabled=true;b.setAttribute('aria-pressed','false');
        if(ans.has(n))b.classList.add(sel.has(n)?'right':'miss');else if(sel.has(n))b.classList.add('wrong');});};
    }
  }
  runStep(0);
  if(q.hint)$('hint').onclick=()=>{if(c.hinted||c.done)return;c.hinted=true;$('hint').disabled=true;addRes(-1);
    $('tipbox').innerHTML='<div class="tip"><b>Pista de l\'avi Joan:</b> '+q.hint+'</div>';say('joan',q.hint);msg('Pista: la Sirena s\'acosta 1 milla.','');};
}

/* ---------- resolució d'un tram: mentrestant, al mar… ---------- */
function finishRoom(){
  const rm=S.room,R=rm.R;
  const svg=view.querySelector('svg.scene');
  if(R.extra){const ok=rm.errs<rm.qs.length;S.extraRes=ok?'ok':'fail';
    const u=KIT.unit(LOG,R.id,{});u.done=true;u.outcome={title:ok?R.ok.title:R.bad.title,text:(ok?R.ok:R.bad).text};u.ptsTxt=ok?'superat':'no superat';S.order.push(R.id);
    mode('full');if(svg)svg.classList.add(ok?'st-ok':'st-bad');
    talk([{w:'narr',t:(ok?R.ok:R.bad).text[0]}].concat((ok?R.ok:R.bad).lines),()=>screenFinal(),{endLabel:'Veure el final ▸'});return;}
  const ok=rm.errs<=1;const out=ok?R.ok:R.bad;const before=S.res;
  if(svg)svg.classList.add(ok?'st-ok':'st-bad');
  const d=out.res?addRes(out.res):0;
  S.results[R.id]=ok?'ok':'bad';S.order.push(R.id);S.story.push({id:R.id,name:R.name,title:out.title,ok});
  const u=KIT.unit(LOG,R.id,{});u.outcome={title:out.title,text:out.text};u.done=true;
  u.ptsTxt=(rm.qs.length-rm.errs)+' de '+rm.qs.length+' a la primera';u.pts=(rm.qs.length-rm.errs)+'/'+rm.qs.length;
  S.room=null;hud();mode('full');
  panel.innerHTML='';
  if(R.id==='t8')return setTimeout(()=>screenEnding(),RMo()?50:900);
  /* escena del mar: la Sirena es mou de la posició anterior a la nova */
  setTimeout(()=>{
    setScene(ART.exterior({miles:before,lit:lit(),on:false})+'<div class="sea-cap"><b>Mentrestant, al mar…</b><span>'+mi(S.res)+' fins a les Roques del Corb'+(d>0?' (+'+d+')':d<0?' ('+d+')':'')+'</span></div>');
    const w=view.querySelector('.shipwrap');requestAnimationFrame(()=>requestAnimationFrame(()=>{if(w)w.style.setProperty('--sx',ART.shipX(S.res)+'px');}));
    if(ART.stormLv(S.res)!==ART.stormLv(before))setTimeout(()=>{const ns=ART.exterior({miles:S.res,lit:lit(),on:false});const cap=view.querySelector('.sea-cap');setScene(ns);if(cap)view.appendChild(cap);},2300);
    const nxt=S.order.filter(x=>x!=='extra').length;
    talk([{w:'narr',t:'<b>'+out.title+'.</b> '+out.text.join(' ')}].concat(out.lines),()=>enterRoom(nxt),{endLabel:'Puja al '+(ROOMS[nxt].short==='Llanterna'?'capdamunt':ROOMS[nxt].short.toLowerCase())+' ▸'});
    const bt=dlg.querySelector('.dbt');if(bt){const b=document.createElement('button');b.type='button';b.className='small ghost';b.textContent='◀ Revisar aquest tram';b.onclick=()=>RV.openKey(R.id);bt.prepend(b);}
  },RMo()?50:700);
}
/* ---------- desenllaç ---------- */
function screenEnding(){const E=endOf();S.end=E;mode('full');
  setScene(ART.exterior({miles:S.res,lit:8,on:true,mode:'end-'+E.k}));
  talk(E.lines,()=>{if(true)offerExtra();},{endLabel:'Continua ▸'});}
function offerExtra(){mode('full');setScene(ART.room('t8',Object.assign({},stormOpts(),{state:'ok'}))); /* llanterna encesa */
  const svg=view.querySelector('svg.scene');if(svg)svg.classList.add('st-ok');
  talk([{w:'joan',t:'Ja que ets a dalt… al calaix hi ha el meu diari. Hi tinc un enigma que no he sabut resoldre mai. Vols provar-ho? És voluntari: no costa milles.'}],()=>enterRoom('extra'),{endLabel:'Provar l\'enigma ▸'});
  const bt=dlg.querySelector('.dbt');const b=document.createElement('button');b.type='button';b.className='small ghost';b.textContent='Ara no, anem al final';b.onclick=()=>{S.extraRes='skip';screenFinal();};bt.prepend(b);}
function screenFinal(){S.room=null;LOG.end=Date.now();hud();const E=S.end||endOf();S.end=E;mode('split');
  setScene(ART.exterior({miles:S.res,lit:8,on:true,mode:'end-'+E.k+' still'}));
  const okN=Object.values(S.results).filter(x=>x==='ok').length;
  const sum='L\'Escala del Far (v2)'+(S.name?' · '+S.name:'')+' · Marge de la Sirena: '+mi(S.res)+' · Trams superats: '+okN+'/'+ROOMS.length+' · Encerts a la primera: '+S.okQ+'/'+S.totalQ+' · Repte extra: '+(S.extraRes==='ok'?'superat':S.extraRes==='fail'?'no superat':'no fet');
  dlg.className='dlg w-joan';dlg.innerHTML=line({w:'joan',t:'Ara, escriu-ho tot al llibre de registre del far: és l\'informe. Serveix per estudiar i per ensenyar-lo al professorat.'});
  panel.innerHTML='<div class="fin"><p class="kick">'+(E.k==='lost'?'Missió a mitges':'Missió complerta')+(S.name?' · '+esc(S.name):'')+'</p><h2>'+E.title+'</h2><p>'+E.txt+'</p>'
    +'<div class="stats"><div class="stat"><b>'+mi(S.res)+'</b><span>Marge de la Sirena</span></div><div class="stat"><b>'+okN+' / '+ROOMS.length+'</b><span>Trams superats</span></div><div class="stat"><b>'+S.okQ+' / '+S.totalQ+'</b><span>Encerts a la primera</span></div></div>'
    +'<div class="recap">'+S.order.map((id,k)=>{const R=id==='extra'?EXTRA:ROOMS.find(r=>r.id===id);const x=S.story.find(s=>s.id===id);const ok=id==='extra'?S.extraRes==='ok':x&&x.ok;
      return '<div class="'+(ok?'ok':'bad')+'"><b>'+(id==='extra'?'Extra':(k+1))+' · '+R.name+'</b><span>'+(id==='extra'?(ok?'Enigma resolt':'No resolt'):x.title)+'</span></div>';}).join('')+'</div>'
    +'<div class="repbar"><button type="button" class="primary" id="pdf">Informe en PDF</button><button type="button" id="html">Informe en HTML</button><button type="button" id="revAll">◀ Revisar tram per tram</button><button type="button" id="revHtml">Revisió (HTML)</button><button type="button" id="cp">Copiar el resum</button></div>'
    +'<p class="msg" id="pdfm" aria-live="polite"></p><div class="k-repbox" id="repBox" hidden>'+report()+'</div>'
    +'<div class="act"><span></span><button type="button" class="primary" id="again">Tornar a jugar amb números nous</button></div></div>';
  panel.scrollTop=0;
  const sayM=t=>{const m=$('pdfm');m.className='msg';m.textContent=t;};
  const stTxt=(s,okT)=>s==='done'?okT:s==='declined'?'Descàrrega cancel·lada.':s==='loading'?'Preparant el fitxer…':s==='fail'?'No s\'ha pogut crear el fitxer.':'';
  const fn=k=>k+'_Escala_del_Far_v2'+(S.name?'_'+KIT.slug(S.name):'');
  $('cp').onclick=()=>{try{navigator.clipboard.writeText(sum).then(()=>sayM('Resum copiat.'),()=>sayM('No s\'ha pogut copiar.'));}catch(e){sayM('No s\'ha pogut copiar.');}};
  $('revAll').onclick=()=>RV.show(0);
  $('pdf').onclick=()=>KIT.savePDF($('repBox'),fn('Informe')+'.pdf',s=>{$('pdf').disabled=s==='loading';sayM(stTxt(s,'PDF descarregat.'));});

  $('revHtml').onclick=()=>{const doc=KIT.reviewHTMLDoc(LOG.units.filter(u=>u.done),{title:'Revisió · L\'Escala del Far'+(S.name?' · '+S.name:''),name:S.name,unitWord:'tram per tram',headHTML:'<header style="text-align:center"><p class="kick" style="margin:0">T2 · Criteris de divisibilitat</p><h1 style="margin:0;font-family:var(--f-disp);font-weight:400">L\'Escala del Far</h1></header>'});
    KIT.saveDoc(doc,fn('Revisio')+'.html',s=>sayM(stTxt(s,'Revisió descarregada.')));};

/* ====================== informe ====================== */
function report(){
  const units=LOG.units.filter(u=>u.items.length);const all=[].concat.apply([],units.map(u=>u.items));
  const c={first:0,second:0,fail:0,skip:0};all.forEach(i=>c[i.res]=(c[i.res]||0)+1);
  const mins=Math.max(1,Math.round(((LOG.end||Date.now())-LOG.start)/60000));const E=S.end||endOf();
  const okN=Object.values(S.results).filter(x=>x==='ok').length;const date=KIT.fmtDate(LOG.end||Date.now());
  const pages=[];const N=2+units.length;
  const ph=i=>'<div class="fr-ph"><span>L\'Escala del Far · '+(S.name?esc(S.name):'')+'</span><span>'+date+'</span></div>';
  const pf=i=>'<div class="fr-pf"><span>T2 · Criteris de divisibilitat · 1r ESO</span><span>Pàgina '+i+' de '+N+'</span></div>';
  const att=it=>{const seen={};return it.attempts.map(a=>{const m=String(a.text).match(/^([^:]{1,14}): /);const k=m?m[1]:'';seen[k]=(seen[k]||0)+1;return (seen[k]===1?'1r':'2n')+': '+(a.text===''?'(en blanc)':esc(a.text))+' '+(a.ok?'✓':'✗');}).join(' &nbsp;·&nbsp; ')||'(sense resposta)';};
  /* portada */
  pages.push('<section class="fr-page fr-cover">'+ph(1)+'<div class="fr-cv"><p class="fr-kick">Llibre de registre del far · Informe de l\'activitat</p><h1>L\'Escala del Far</h1><p class="fr-sub">Una aventura de farers, temporals i nombres divisibles · 1r ESO · T2 Criteris de divisibilitat (2, 3, 5 i 10)</p>'
    +'<div class="fr-art"><img alt="" src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ART.printCover().replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '))+'"></div>'
    +'<table class="kr-id fr-id"><tr><th>Alumne/a</th><td>'+(S.name?esc(S.name):'_____________________')+'</td></tr><tr><th>Data</th><td>'+date+'</td></tr><tr><th>Durada</th><td>'+mins+' min</td></tr><tr><th>Desenllaç</th><td>'+E.title+'</td></tr></table></div>'+pf(1)+'</section>');
  /* resum */
  const weak=units.filter(u=>u.items.some(i=>i.res!=='first')),strong=units.filter(u=>u.items.every(i=>i.res==='first'));
  pages.push('<section class="fr-page kr-u">'+ph(2)+'<h2 class="fr-h2">Resum de la travessa</h2>'
    +'<div class="fr-stats"><div><b>'+mi(S.res)+'</b><span>Marge de la Sirena</span></div><div><b>'+okN+' / '+ROOMS.length+'</b><span>Trams superats</span></div><div><b>'+c.first+' / '+all.length+'</b><span>Encerts al primer intent</span></div><div><b>'+c.second+'</b><span>Encerts al segon intent</span></div><div><b>'+(c.fail+c.skip)+'</b><span>No resolts</span></div><div><b>'+(S.extraRes==='ok'?'Superat':S.extraRes==='fail'?'No superat':'No fet')+'</b><span>Repte extra</span></div></div>'
    +'<div class="fr-out"><b>'+E.title+'.</b> '+E.txt+'</div>'
    +'<h3 class="fr-h3">Tram per tram</h3><table class="fr-sum"><thead><tr><th>Tram</th><th>Contingut</th><th>1r intent</th><th>2n intent</th><th>No resolts</th><th>Punts</th><th>Pista</th></tr></thead><tbody>'
    +units.map(u=>{const k={first:0,second:0,fail:0,skip:0};u.items.forEach(i=>k[i.res]++);return '<tr><td>'+esc(u.label)+' · '+u.title+'</td><td>'+u.topic+'</td><td>'+k.first+'</td><td>'+k.second+'</td><td>'+(k.fail+k.skip)+'</td><td>'+(u.pts!=null?u.pts:(u.ptsTxt||''))+'</td><td>'+(u.items.some(i=>i.hint)?'Sí':'—')+'</td></tr>';}).join('')+'</tbody></table>'
    +'<div class="fr-cols"><div class="fr-good"><b>Punts forts</b>'+(strong.length?'<ul>'+strong.map(u=>'<li>'+u.topic+'</li>').join('')+'</ul>':'<p>Encara cap tram sense errors. Endavant!</p>')+'</div><div class="fr-weak"><b>Per repassar</b>'+(weak.length?'<ul>'+weak.map(u=>{const n=u.items.filter(i=>i.res!=='first').length;return '<li>'+u.topic+' ('+n+(n===1?' pany':' panys')+')</li>';}).join('')+'</ul>':'<p>Res a repassar: tot correcte al primer intent.</p>')+'</div></div>'
    +'<p class="fr-note">Cada partida genera números nous. Cada pas té dos intents; «Punts» indica els panys oberts al primer intent. Les explicacions són les que l\'applet ha mostrat a l\'alumne/a.</p>'+pf(2)+'</section>');
  /* trams */
  units.forEach((u,ui)=>{let h='<section class="fr-page kr-u">'+ph(ui+3)+'<div class="fr-uh kr-top">'+ART.printVignette(u.key)+'<div><p class="fr-kick">'+(u.key==='extra'?'Repte extra':'Tram '+esc(u.label))+'</p><h2>'+u.title+'</h2><p class="fr-topic">'+u.topic+(u.ptsTxt?' · <b>'+u.ptsTxt+'</b>':'')+'</p></div></div>'
      +(u.context?'<div class="fr-ctx">'+u.context+'</div>':'');
    u.items.forEach((it,i)=>{h+='<div class="kr-q fr-q kr-'+it.res+'"><div class="kr-qh"><span class="kr-l">Pany '+esc(it.label||String(i+1))+'</span><div>'+it.prompt+'</div><span class="kr-badge">'+({first:'✓ 1r intent',second:'✓ 2n intent',fail:'✗ no resolt',skip:'✗ en blanc'})[it.res]+'</span></div>'
      +'<table class="kr-qt"><tr><th>Respostes</th><td>'+att(it)+'</td></tr><tr><th>Correcta</th><td><b>'+it.correct+'</b></td></tr><tr><th>Explicació</th><td>'+it.explain+'</td></tr>'
      +(it.hint?'<tr><th>Pista</th><td>'+it.hint+'</td></tr>':'')+(it.tips?'<tr><th>Suport</th><td>Ha consultat les pistes per decidir o les estratègies de càlcul mental.</td></tr>':'')+'</table>';
      if(it.scratch&&!KIT.scratchEmpty(it.scratch)){const img=KIT.scratchImage(it.scratch,640,200);h+='<div class="kr-scr"><span>Esborrany</span>'+(img?'<img alt="" src="'+img+'">':'')+(it.scratch.text&&it.scratch.text.trim()?'<pre>'+esc(it.scratch.text)+'</pre>':'')+'</div>';}
      h+='</div>';});
    if(u.outcome)h+='<p class="kr-o fr-o"><b>Conseqüència:</b> '+u.outcome.title+'. '+(u.outcome.text||[]).join(' ')+'</p>';
    pages.push(h+pf(ui+3)+'</section>');});
  return '<div class="krep frep"><style>'+REPCSS+'</style>'+pages.join('')+'</div>';}
const REPCSS='.frep{padding:0!important;max-width:780px;font-size:13.5px;line-height:1.6}'
 +'.frep .fr-page{background:#fff;padding:26px 34px 22px;margin:0 auto 18px;box-shadow:0 1px 8px rgba(0,0,0,.18);min-height:1050px;display:flex;flex-direction:column;gap:14px}'
 +'.frep .fr-ph,.frep .fr-pf{display:flex;justify-content:space-between;font-size:11px;color:#777;border-bottom:1px solid #ccc;padding-bottom:6px}.frep .fr-pf{border-bottom:0;border-top:1px solid #ccc;padding:6px 0 0;margin-top:auto}'
 +'.k-pdfbox .frep .fr-ph,.k-pdfbox .frep .fr-pf{display:none}.k-pdfbox .frep .fr-page{box-shadow:none;margin:0;padding:16px 0 0;min-height:0;gap:10px}.k-pdfbox .frep .fr-sum th,.k-pdfbox .frep .fr-sum td{padding:4px 8px;font-size:12.5px}.k-pdfbox .frep .fr-stats div{padding:6px 10px}'
 +'.frep .fr-cv{display:flex;flex-direction:column;gap:16px;text-align:center;padding-top:30px}.frep .fr-cv h1{font-family:Georgia,serif;font-size:44px;margin:0;color:#10283a}'
 +'.frep .fr-kick{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#8a6a2a;font-weight:700;margin:0}.frep .fr-sub{color:#444;margin:0}'
 +'.frep .fr-art{border:1px solid #c9c9c9;border-radius:6px;overflow:hidden}.frep .fr-art img{display:block;width:100%;height:auto}'
 +'.frep .fr-id{width:70%;margin:6px auto 0;text-align:left}.frep .fr-id th{width:120px;background:#f2f2f2}'
 +'.frep .fr-h2,.frep .fr-uh h2{font-family:Georgia,serif;font-size:24px;color:#10283a;margin:0;background:none;padding:0;font-style:normal}'
 +'.frep .fr-h3{font-size:15px;margin:6px 0 0;color:#10283a}'
 +'.frep .fr-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.frep .fr-stats div{background:#f2f2f2;border:1px solid #d0d0d0;border-radius:5px;padding:9px 12px;display:flex;flex-direction:column}.frep .fr-stats b{font-size:19px;color:#1F4E79}.frep .fr-stats span{font-size:12px;color:#555}'

 +'.frep .fr-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.frep .fr-cols>div{border:1px solid #c0c0c0;border-radius:5px;padding:10px 14px}.frep .fr-good{background:#eef7f1}.frep .fr-weak{background:#fbefeb}.frep .fr-cols ul{margin:6px 0 0;padding-left:18px}'
 +'.frep .fr-note{font-size:11.5px;color:#666}'
 +'.frep .fr-uh{display:flex;gap:16px;align-items:center;border-bottom:3px solid #c9a03a;padding-bottom:10px}.frep .fr-uh p{margin:0}.frep .fr-topic{color:#555}'
 +'.frep .fr-ctx{font-size:13px;color:#333;background:#f7f7f7;border:1px dashed #b0b0b0;border-radius:5px;padding:8px 12px}.frep .fr-ctx p{margin:0}'
 +'.frep .fr-q{margin-top:4px;padding:10px 12px}.frep .fr-o{border-top:1px solid #ddd;padding-top:8px}';
