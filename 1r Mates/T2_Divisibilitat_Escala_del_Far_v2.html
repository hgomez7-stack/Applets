/* ===== KIT: esborrany, estratègies, revisió, informe ===== */
.k-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.k-tools button{font-size:15px;min-height:38px;padding:5px 12px}
.k-tools button[aria-expanded="true"]{background:var(--k-acc);color:var(--k-on-acc)}
.k-scr{border:var(--k-bw) solid var(--k-line);border-radius:var(--k-r);background:var(--k-paper);padding:10px;display:grid;gap:8px}
.k-scr-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.k-scr-bar span{display:inline-flex;flex-wrap:wrap;gap:6px}
.k-scr-bar button{font-size:14px;min-height:36px;padding:4px 11px}
.k-scr-bar button[aria-pressed="true"]{background:var(--k-acc);color:var(--k-on-acc)}
.k-scr-pad{border:1.5px solid var(--k-soft);border-radius:calc(var(--k-r) - 2px);overflow:hidden;background-color:#fff;
  background-image:linear-gradient(#e3e8ee 1px,transparent 1px),linear-gradient(90deg,#e3e8ee 1px,transparent 1px);background-size:20px 20px}
.k-scr-pad canvas{display:block;touch-action:none;cursor:crosshair}
.k-scr-txt{width:100%;min-height:150px;resize:vertical;border:1.5px solid var(--k-soft);border-radius:calc(var(--k-r) - 2px);padding:8px 10px;font-family:var(--k-mono);font-size:17px;line-height:1.6;background:var(--k-paper);color:var(--k-ink)}
.k-scr-note{font-size:13px;color:var(--k-soft)}
.k-div{border:var(--k-bw) solid var(--k-line);border-left:6px solid var(--k-acc);border-radius:var(--k-r);background:var(--k-cell);padding:10px 14px;font-size:15.5px;max-width:68ch}
.k-div-t{font-weight:700;margin-bottom:4px}
.k-div ul{margin:0;padding-left:18px;display:grid;gap:5px}
/* revisió */
.k-rv{display:flex;flex-direction:column;gap:14px}
.k-rv-bar{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center;border:var(--k-bw) solid var(--k-line);border-radius:var(--k-r);background:var(--k-cell);padding:8px 10px}
.k-rv-badge{font-weight:700;font-size:14px}
.k-rv-nav{display:inline-flex;gap:8px;align-items:center}
.k-rv-nav button{font-size:15px;min-height:38px;padding:5px 12px}
.k-rv-count{font-family:var(--k-mono);font-size:14px}
.k-rv-body{border:var(--k-bw) solid var(--k-line);border-radius:var(--k-r);background:var(--k-paper);padding:16px;display:grid;gap:12px}
.k-rv-head{display:flex;gap:12px;align-items:center}
.k-rv-n{min-width:46px;height:46px;padding:0 6px;display:grid;place-items:center;background:var(--k-acc);color:var(--k-on-acc);font-family:var(--k-disp);font-weight:700;font-size:22px;border-radius:calc(var(--k-r) - 2px)}
.k-rv-head div{display:flex;flex-direction:column}
.k-rv-head b{font-family:var(--k-disp);font-size:24px;line-height:1.05}
.k-rv-head span{font-size:14px;color:var(--k-soft)}
.k-rv-ctx{font-size:15.5px;display:grid;gap:6px;color:var(--k-ink)}
.k-rv-q{border:1.5px solid var(--k-soft);border-radius:var(--k-r);padding:10px 12px;display:grid;gap:8px}
.k-rv-q.k-first,.k-rv-q.k-second{border-color:var(--k-ok);background:var(--k-okbg)}
.k-rv-q.k-fail,.k-rv-q.k-skip{border-color:var(--k-bad);background:var(--k-badbg)}
.k-rv-qh{display:flex;gap:10px;align-items:baseline}
.k-rv-l{font-family:var(--k-mono);font-weight:700;font-size:13px;min-width:1.4rem;color:var(--k-soft)}
.k-rv-p{font-size:17px}
.k-rv-a,.k-rv-s{display:flex;flex-direction:column;gap:3px;font-size:15.5px}
.k-rv-tag{font-family:var(--k-mono);font-size:12.5px;font-weight:700;color:var(--k-soft)}
.k-att{font-family:var(--k-mono);font-weight:600;font-size:14.5px}
.k-att.ok{color:var(--k-ok)}.k-att.bad{color:var(--k-bad)}
.k-rv-mini{font-size:13.5px;color:var(--k-soft)}
.k-rv-hint{border:1.5px dashed var(--k-soft);border-radius:var(--k-r);padding:8px 12px;font-size:15px}
.k-rv-scr{display:grid;gap:6px}
.k-rv-scr img{width:100%;max-width:720px;border:1.5px solid var(--k-soft);border-radius:calc(var(--k-r) - 2px);background:#fff}
.k-rv-scr pre{margin:0;white-space:pre-wrap;font-family:var(--k-mono);font-size:14px;border:1.5px solid var(--k-soft);border-radius:calc(var(--k-r) - 2px);padding:8px 10px;background:var(--k-paper)}
.k-rv-out{border-top:1.5px solid var(--k-soft);padding-top:10px;display:grid;gap:4px;font-size:15px}
.k-back{align-self:flex-start}
.k-revbtn{font-size:14px;min-height:36px;padding:4px 12px}
/* informe (sempre clar, també per al PDF) */
.k-repwrap{display:grid;gap:12px}
.k-repbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.k-repbox{border:var(--k-bw) solid var(--k-line);border-radius:var(--k-r);overflow:auto;max-height:70vh;background:#fff}
.k-pdfout{position:fixed;left:-12000px;top:0;width:680px;overflow:hidden}
.k-pdfbox{width:680px;background:#fff}
.k-pdfbox .krep{max-width:none;width:auto;margin:0;padding:0}
@media print{
  body.k-printing{background:#fff!important;padding:0!important}
  body.k-printing *{visibility:hidden!important}
  body.k-printing .k-print-target,body.k-printing .k-print-target *{visibility:visible!important}
  body.k-printing .k-print-target{position:absolute;left:0;top:0;width:100%;max-height:none!important;overflow:visible!important;border:0!important}
  .kr-q,.kr-scr,.kr-uh{break-inside:avoid}
}

/* termes de la divisió (colors fixos, també en mode fosc per contrast) */
.k-mult{font-weight:700;color:var(--k-mult,#1F4E79)}
.t-dvd,.t-dvs,.t-quo,.t-res{font-weight:700;border-radius:4px;padding:1px 6px;margin:0 1px;white-space:nowrap}
.t-dvd{color:#1F4E79;background:#e3edf8}.t-dvs{color:#6b2fa0;background:#efe5f8}
.t-quo{color:#14613d;background:#dff2e7;border:.5px solid #14613d}.t-res{color:#a34a00;background:#fdebd8;border:.5px solid #a34a00}
.k-qbox{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;border:.5px solid #a34a00;border-radius:6px;padding:1px 8px;color:#a34a00;font-weight:700;background:#fff8f0}
.k-legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:14px}

/* botonera de potències */
.pp{display:grid;gap:10px;justify-items:start}
.pp-disp{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:var(--k-bw) solid var(--k-line);border-radius:var(--k-r);background:var(--k-paper);padding:12px 18px 10px;min-width:240px;outline-offset:3px}
.pp-pow{display:inline-flex;align-items:flex-start;gap:4px;font-family:var(--k-disp);font-weight:600;line-height:1.1}
.pp-base{display:inline-block;font-size:46px;min-width:1.3em;padding:4px 10px;border-radius:10px;text-align:center;border:2px solid transparent}
.pp-sup{display:inline-block;margin-top:-6px}
.pp-exp{display:inline-block;font-size:26px;min-width:1.5em;padding:2px 8px;border-radius:8px;text-align:center;border:2px solid transparent}
.pp-base.ed,.pp-exp.ed{border:2px dashed var(--k-soft);cursor:pointer;background:var(--k-cell)}
.pp-base.on,.pp-exp.on{border:2.5px solid var(--k-focus,#1F5FAD);background:var(--k-paper);box-shadow:0 0 0 3px rgba(31,95,173,.18)}
.pp-base i,.pp-exp i,.pp-seq i{font-style:normal;color:var(--k-soft)}
.pp-labels{display:flex;gap:16px;font-size:13px;color:var(--k-soft)}
.pp-labels .on{color:var(--k-focus,#1F5FAD)}
.pp-seq{font-family:var(--k-disp);font-weight:600;font-size:28px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:1.3em}
.pp-seq b{color:var(--k-soft)}
.pp-keys{display:flex;flex-direction:column;gap:6px}
.pp-digits{display:grid;grid-template-columns:repeat(5,52px);gap:6px}
.pp-ctl{display:flex;flex-wrap:wrap;gap:6px}
.pp-keys button{min-height:46px;padding:4px 12px;font-size:19px}
.pp-digits button{padding:4px 0}
.pp-ctl .pp-sw{background:var(--k-cell);font-size:16px}
.pp-ctl .pp-del{font-size:15px}
@media (max-width:420px){.pp-digits{grid-template-columns:repeat(5,minmax(0,1fr));width:100%}.pp-disp{min-width:0}}

.krep{--kr-acc:#1f5fad;--kr-accbg:#e8f0fb;color:#1d1d1b;background:#fff;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.42;padding:22px 24px;max-width:780px;margin:0 auto}
.krep h1,.krep h2{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;text-transform:none}
.krep h1{font-size:24px;margin:2px 0 2px;line-height:1.1}
.krep h2{font-size:16px;margin:18px 0 8px;padding:5px 10px;background:#d9d9d9;font-style:italic}
.krep sup{font-size:.68em;vertical-align:super;line-height:0}
.krep table{border-collapse:collapse;width:100%}
.krep th,.krep td{border:1px solid #9a9a9a;padding:4px 7px;text-align:left;vertical-align:top}
.krep th{background:#e7e6e6;font-weight:700}
.kr-head{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start;border-bottom:3px solid var(--kr-acc);padding-bottom:10px}
.kr-kick{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#555;font-weight:700}
.kr-sub{color:#444}
.kr-id th{width:80px}
.kr-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
.kr-stats div{border:1px solid #9a9a9a;border-radius:4px;padding:6px 9px;background:#f2f2f2;display:flex;flex-direction:column}
.kr-stats b{font-size:19px;color:#1F4E79}
.kr-stats span{font-size:11.5px;color:#444}
.kr-out{margin-top:10px;border-left:5px solid var(--kr-acc);background:var(--kr-accbg);padding:7px 10px}
.kr-sum td:nth-child(n+3){text-align:center;width:62px}
.kr-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kr-cols>div{border:1px solid #9a9a9a;border-radius:4px;padding:7px 10px}
.kr-cols ul{margin:4px 0 0;padding-left:18px}
.kr-good{background:#e9f6ee}.kr-weak{background:#fdeeea}
.kr-u{margin-top:12px;break-inside:auto}
.kr-uh{display:flex;gap:10px;align-items:center;background:#f2f2f2;border-left:5px solid var(--kr-acc);padding:6px 10px;break-after:avoid;page-break-after:avoid}
.kr-uh>span{font-weight:700;font-size:16px;min-width:26px}
.kr-uh div{display:flex;flex-direction:column;flex:1}
.kr-uh i{font-style:normal;color:#555;font-size:12px}
.kr-uh em{font-style:normal;font-weight:700;color:#1F4E79}
.kr-ctx{font-size:12.5px;color:#333;padding:6px 2px;display:grid;gap:3px}
.kr-ctx .data,.kr-ctx ul{margin:0}
.kr-q{border:1px solid #bdbdbd;border-radius:4px;margin-top:7px;padding:6px 8px;break-inside:avoid;page-break-inside:avoid}
.kr-qh{display:flex;gap:8px;align-items:baseline;margin-bottom:5px}
.kr-qh>div{flex:1}
.kr-l{font-weight:700;color:#555}
.kr-badge{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:3px;white-space:nowrap}
.kr-first .kr-badge,.kr-second .kr-badge{background:#d8f0e2;color:#14613d}
.kr-fail .kr-badge,.kr-skip .kr-badge{background:#fbe0d9;color:#a3281a}
.kr-second .kr-badge{background:#fff1c9;color:#6b4e00}
.kr-qt th{width:92px;font-size:12px}
.kr-hint{margin-top:6px;font-size:12.5px;border:1px dashed #9a9a9a;padding:5px 8px}
.kr-o{margin-top:5px;font-size:12.5px;color:#333}
.kr-scr{margin-top:6px;display:grid;gap:3px;break-inside:avoid;page-break-inside:avoid}
.kr-scr span{font-size:11.5px;font-weight:700;color:#555}
.kr-scr img{width:100%;max-width:560px;border:1px solid #bdbdbd}
.kr-scr pre{margin:0;white-space:pre-wrap;font-family:'Courier New',monospace;font-size:12px;border:1px solid #bdbdbd;padding:5px 7px}
.krep mark,.krep .rt{background:none;color:inherit}
.krep .rad{width:.78em;height:1.3em;stroke:currentColor;fill:none;stroke-width:1.7;margin-right:-.04em;vertical-align:-.2em}
.krep .rx{border-top:1px solid currentColor;padding:0 .15em}
@media (max-width:560px){.kr-head{grid-template-columns:1fr}.kr-cols{grid-template-columns:1fr}.krep{padding:14px}}
.kr-keep,.kr-top{break-inside:avoid;page-break-inside:avoid}
.kr-top h2{margin-top:6px}
.kr-scr img{max-height:200px;object-fit:contain;object-position:left top}
.krep .k-mult{font-weight:700;color:#1F4E79}
.krep .t-dvd,.krep .t-dvs,.krep .t-quo,.krep .t-res{font-weight:700;border-radius:3px;padding:1px 5px;margin:0 1px}
.krep .t-dvd{color:#1F4E79;background:#e3edf8}.krep .t-dvs{color:#6b2fa0;background:#efe5f8}
.krep .t-quo{color:#14613d;background:#dff2e7;border:.5px solid #14613d}.krep .t-res{color:#a34a00;background:#fdebd8;border:.5px solid #a34a00}
.krep .k-qbox{display:inline-block;min-width:1.6em;text-align:center;border:.5px solid #a34a00;border-radius:3px;padding:1px 6px;color:#a34a00;font-weight:700}
.krep .pp-pw{font-weight:700}
.krep .k-rowpick{border-collapse:collapse;width:auto}.krep .k-rowpick td{border:0;padding:1px 6px;text-align:center}
.krep .data{border:1px dashed #9a9a9a;border-radius:4px;padding:6px 10px;list-style:none;margin:4px 0;display:grid;gap:2px}
.krep .expr{font-weight:700;white-space:nowrap}
.krep .k-legend{display:flex;flex-wrap:wrap;gap:6px}
.krep .story p+p{margin-top:4px}

/* maquetació aireada: cada repte comença a una pàgina nova */
.krep{font-size:13.5px;line-height:1.55}
.krep h2{margin:22px 0 10px;padding:6px 12px}
.krep th,.krep td{padding:6px 9px}
.kr-u{break-before:page;page-break-before:always;margin-top:0}
.kr-uh{padding:9px 12px;margin-bottom:6px}
.kr-uh>span{font-size:18px}
.kr-ctx{padding:8px 2px 4px;gap:5px}
.kr-q{margin-top:12px;padding:9px 11px}
.kr-qh{margin-bottom:7px}
.kr-qt th{width:100px}
.kr-hint,.kr-o{margin-top:10px}
.kr-cols{margin-top:16px;gap:14px}
.kr-cols>div{padding:10px 12px}
.kr-stats{margin-top:16px;gap:10px}
.kr-note{margin-top:18px;font-size:11.5px;color:#666}
.kr-tail{break-inside:avoid;page-break-inside:avoid}

/* tokens clars: l'informe i la impressió sempre amb fons blanc, encara que l'applet sigui en mode fosc */
.krep{--bg:#ffffff;--paper:#ffffff;--ink:#1d1d1b;--ink-soft:#555c60;--line:#8a959b;--rule:#b9c4c9;--cell:#f3f5f6;--grid:rgba(0,0,0,.08);--slab:#eef2f4;--slab-2:#e6ecef;--slab-ink:#1d1d1b;--ice:#1F4E79;--aur:#17784f;--on-aur:#ffffff;--warn:#c2301a;--ok:#17784f;--bad:#c2301a;--okbg:#e4f4ec;--badbg:#fbe6e0;--c1:#FCEB9E;--c2:#F4F4D6;--c3:#BFE1F6;--c4:#B5E0D6;--c5:#F9D3D9;--miss:#eeeeea;--k-paper:#ffffff;--k-ink:#1d1d1b;--k-soft:#555c60;--k-line:#8a959b;--k-cell:#f3f5f6;--k-okbg:#e4f4ec;--k-badbg:#fbe6e0;--k-acc:#FCEB9E;--k-on-acc:#1d1d1b;color-scheme:light}
.krep .data,.krep .note,.krep .tip,.krep .k-div{background:#f5f7f8!important;color:#1d1d1b!important;border-color:#9a9a9a!important}
.krep .data b,.krep .ex,.krep .expr{color:#1d1d1b}

.pa-wrap{display:grid;gap:8px}
.pa-open{justify-self:start}
.pa{border:1.5px solid var(--k-line);border-radius:3px;background:var(--pa-bg);color:var(--pa-ink);padding:12px clamp(10px,2.4vw,16px);display:grid;gap:10px}
.pa-top{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;font-family:var(--k-mono);font-size:13px;color:var(--pa-acc)}
.pa-cnt{color:var(--pa-soft)}
.pa-track{position:relative;display:flex;align-items:stretch;gap:4px;padding-bottom:54px}
.pa-st{flex:1 1 0;min-width:0;border:1.5px solid var(--pa-soft);border-radius:3px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:var(--pa-2);transition:background-color .3s,border-color .3s}
.pa-st b{font-family:var(--k-disp);font-weight:800;font-size:24px;line-height:1;color:var(--pa-soft)}
.pa-st span{font-size:11.5px;line-height:1.15;color:var(--pa-soft)}
.pa-st.on{background:var(--pa-acc);border-color:var(--pa-acc)}
.pa-st.on b,.pa-st.on span{color:var(--pa-on)}
.pa-st.in{border-color:var(--pa-hot);box-shadow:inset 0 0 0 2px var(--pa-hot)}
.pa-ar{align-self:center;color:var(--pa-soft);font-style:normal;font-size:14px}
.spr{width:48px;height:48px;background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.pa-bot{position:absolute;left:0;bottom:2px;background-image:var(--bot-idle);background-size:96px 48px;animation:sp2 1.3s steps(2) infinite;transition:transform .6s ease,opacity .3s}
.pa-bot.walk{background-image:var(--bot-walk);animation-duration:.28s}
.pa-stage{position:relative;overflow-x:auto;padding-top:54px}
.pa-drone{position:absolute;left:0;top:2px;background-image:var(--dr-hover);background-size:96px 48px;animation:sp2 .34s steps(2) infinite;transition:transform .7s cubic-bezier(.4,.1,.3,1);z-index:1}
.pa-drone.zap{background-image:var(--dr-zap);animation-duration:.16s}
@keyframes sp2{from{background-position:0 0}to{background-position:-96px 0}}
.pa-row{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;width:max-content;min-width:100%;padding:6px 4px 8px}
.pa-t{font-family:var(--k-mono);font-weight:600;font-size:clamp(17px,4.2vw,24px);white-space:nowrap;line-height:1}
.pa-n{border:1.5px solid var(--pa-soft);background:var(--pa-2);color:var(--pa-ink);padding:8px 10px;border-radius:3px}
.pa-o{color:var(--pa-soft);padding:0 2px}
.pa-b{color:var(--pa-hot);font-size:clamp(21px,5vw,30px)}
.pa-t.tg{outline:3px solid var(--pa-acc);outline-offset:3px}
.pa-o.tg{color:var(--pa-acc)}
.pa-t.hit{animation:hit .3s ease 2}
@keyframes hit{50%{background:var(--pa-hot);color:#1a0a04;border-color:var(--pa-hot)}}
.pa-t.nw{background:var(--pa-acc);color:var(--pa-on);border-color:var(--pa-acc);animation:popin .45s ease}
@keyframes popin{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.pa-t .rad{width:.78em;height:1.3em;stroke:currentColor;fill:none;stroke-width:1.7;vertical-align:-.25em}
.pa-cap{font-size:15.5px;min-height:2.6em}
.pa-cap b{color:var(--pa-acc)}
.pa-res{display:inline-block;background:var(--pa-acc);color:var(--pa-on);font-family:var(--k-mono);font-weight:700;padding:1px 8px;border-radius:2px}
.pa-ctl{display:flex;flex-wrap:wrap;gap:8px}
.pa-ctl button{background:var(--pa-2);color:var(--pa-ink);border-color:var(--pa-soft)}
.pa .pa-ctl button:hover:not(:disabled):not([aria-pressed="true"]):not(.used){background:var(--pa-2)}
.pa .pa-ctl button.primary:hover:not(:disabled){background:var(--pa-acc);filter:brightness(.94)}
.pa-ctl button.primary{background:var(--pa-acc);color:var(--pa-on)}
@media (max-width:560px){.pa-st span{display:none}.pa-st b{font-size:20px}}
@media (prefers-reduced-motion:reduce){.pa-bot,.pa-drone,.pa-t.hit,.pa-t.nw{animation:none!important;transition:none!important}}

/* Layout: aventura gràfica a pantalla completa, sense desplaçament de pàgina. Barra superior fina (mar amb la Sirena, milles, trams, quadern).
   A l'esquerra l'escena il·lustrada i, a sota, el quadre de diàleg amb retrat; a la dreta el panell del pany (prop de la sala).
   Escenes sempre de nit; el panell canvia entre pergamí (clar) i fusta fosca (fosc). */
:root{
  --bg:#140e0b;--paper:#f6eedb;--ink:#2a1d14;--soft:#6b5a48;--line:#8a6a44;--cell:#ece0c4;
  --acc:#f2b632;--on-acc:#2a1d14;--acc2:#c2412d;--ok:#1d7a52;--bad:#b8362a;--okbg:#dff1e7;--badbg:#f9e1dc;--warn:#c98a12;--focus:#1f5fad;
  --brass:#b8862b;--brass2:#e0b862;--wood:#3a281c;
  --r:8px;--bw:2px;
  --f-disp:'Alfa Slab One',Rockwell,'Roboto Slab',Georgia,serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',Verdana,sans-serif;
  --f-mono:'Share Tech Mono','Courier New',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#241a14;--ink:#f4ead2;--soft:#c9b89a;--line:#7a5c3a;--cell:#2f231a;
  --ok:#5fd09a;--bad:#ff7a66;--okbg:#14301f;--badbg:#3a1a15;--focus:#86b6ff;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#241a14;--ink:#f4ead2;--soft:#c9b89a;--line:#7a5c3a;--cell:#2f231a;--ok:#5fd09a;--bad:#ff7a66;--okbg:#14301f;--badbg:#3a1a15;--focus:#86b6ff;color-scheme:dark}
:root{--k-paper:var(--paper);--k-ink:var(--ink);--k-soft:var(--soft);--k-line:var(--line);--k-cell:var(--cell);--k-ok:var(--ok);--k-okbg:var(--okbg);--k-bad:var(--bad);--k-badbg:var(--badbg);
  --k-acc:var(--acc);--k-on-acc:var(--on-acc);--k-r:var(--r);--k-bw:var(--bw);--k-mono:var(--f-mono);--k-disp:var(--f-disp);--k-focus:var(--focus)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:clamp(15px,1.05vw + 6px,17px);line-height:1.45}
p{margin:0}h1,h2,h3{margin:0;font-weight:400}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button{border:var(--bw) solid var(--line);background:var(--paper);border-radius:var(--r);padding:8px 14px;min-height:44px;cursor:pointer;font-weight:700;font-size:15.5px;color:var(--ink)}
button:hover:not(:disabled){filter:brightness(1.05)}
button.primary{background:var(--acc);color:var(--on-acc);border-color:#7a5a1c;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
button.small{min-height:38px;padding:4px 11px;font-size:14px}
button.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#f4ead2}
button:disabled{cursor:default;opacity:.55}
input[type=text]{font-family:var(--f-mono);font-size:24px;width:7ch;border:var(--bw) solid var(--line);border-radius:var(--r);padding:6px 10px;background:var(--paper);color:var(--ink);text-align:center}
input.name{font-family:var(--f-body);font-size:19px;width:100%;text-align:left}

/* ---------- estructura ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));gap:8px;
  background:radial-gradient(ellipse at 50% 0,#2a1d14,#0c0806 75%)}
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;background:linear-gradient(#3a281c,#2a1d14);border:2px solid var(--brass);border-radius:10px;padding:6px 10px;color:#f4ead2;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.brand{font-family:var(--f-disp);font-size:18px;color:var(--acc);letter-spacing:.02em;white-space:nowrap}
.hsea{width:200px;height:40px;flex:none}.hsea svg{width:100%;height:100%;display:block}
.hmiles{display:flex;flex-direction:column;line-height:1.1;min-width:96px}.hmiles b{font-family:var(--f-mono);font-size:20px;color:#7fe0a8}.hmiles span{font-size:12px;color:#c9b89a}
.hmiles.mid b{color:#f2b632}.hmiles.low b{color:#ff7a66;animation:blinkb 1s steps(2) infinite}
@keyframes blinkb{50%{opacity:.45}}
.trams{display:flex;gap:5px;flex:1;justify-content:center;min-width:0}
.tr{min-height:0;width:30px;height:34px;padding:0;border-radius:6px 6px 3px 3px;border:2px solid #6b5236;background:#1d1510;color:#c9b89a;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px}
.tr i{font-style:normal}.tr.now{background:var(--acc);color:#2a1d14;border-color:#fff3c4;box-shadow:0 0 10px #f2b632}
.tr.ok{background:#ffe7a3;color:#2a1d14;border-color:#f2b632;box-shadow:0 0 8px #ffd98a}.tr.bad{background:#7a2b24;color:#fff;border-color:#c2412d}
.tr:disabled{opacity:1}
.tbtn{display:flex;gap:6px}
.nbbtn{display:inline-flex;align-items:center;gap:6px;background:#8a3229;color:#f4ead2;border-color:#5a1f19;position:relative}.nbbtn svg{width:22px;height:22px}
.nbbtn.new::after{content:'';position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:blinkb 1s steps(2) infinite}
#bRev{background:#2a1d14;color:#f4ead2;border-color:var(--brass)}
.stage{flex:1;display:grid;min-height:0;gap:10px;grid-template-columns:minmax(0,1fr)}
body[data-mode="split"] .stage{grid-template-columns:minmax(0,1.12fr) minmax(360px,1fr)}
.scol{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.view{position:relative;flex:1;min-height:0;border:3px solid var(--brass);border-radius:12px;overflow:hidden;background:#000;box-shadow:0 0 0 3px #1d1510,0 10px 30px rgba(0,0,0,.5)}
.view>svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.view>canvas.rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.panel{display:none;min-height:0;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--brass);border-radius:12px;padding:14px clamp(12px,1.6vw,20px);box-shadow:0 0 0 3px #1d1510,inset 0 0 40px rgba(122,90,28,.12);flex-direction:column;gap:12px;overscroll-behavior:contain}
body[data-mode="split"] .panel{display:flex}
body[data-mode="title"] .dlg{display:none}

/* ---------- diàleg ---------- */
.dlg{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"pt tx" "bt bt";gap:6px 12px;align-items:start;min-height:96px;
  background:linear-gradient(#20160f,#140e0b);border:3px solid var(--brass);border-radius:12px;padding:10px 12px;color:#f4ead2;box-shadow:0 0 0 3px #1d1510}
.dlg:empty{display:none}
.dlg .pt{grid-area:pt;width:72px;height:72px;border-radius:10px;overflow:hidden;border:2px solid var(--brass2);background:#000}.dlg .pt svg{width:100%;height:100%;display:block}
.dlg .dtx{grid-area:tx;display:flex;flex-direction:column;gap:3px;animation:dIn .25s ease}
.dlg.w-narr{grid-template-columns:minmax(0,1fr);grid-template-areas:"tx" "bt"}
.dlg.w-narr .dtx p{font-style:italic;color:#e8dcc0}
.dlg .who{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass2)}
.dlg.w-rita .who{color:#8fc3e8}.dlg.w-jo .who{color:#f2b632}
.dlg .dtx p{font-size:clamp(15px,.9vw + 7px,18px);line-height:1.45}
.dlg .dtx b{color:#ffd98a}
.dbt{grid-area:bt;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@keyframes dIn{from{opacity:0;transform:translateY(4px)}}
.dlg.w-rita .pt{animation:radio .6s steps(2) 3}
@keyframes radio{50%{filter:brightness(1.4) contrast(1.2)}}

/* ---------- títol ---------- */
.title-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,520px);background:rgba(20,14,11,.86);border:3px solid var(--brass);border-radius:14px;padding:20px 22px;color:#f4ead2;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);backdrop-filter:blur(2px)}
.title-card h1{font-family:var(--f-disp);font-size:clamp(34px,5.5vw,58px);line-height:1;color:var(--acc);text-shadow:3px 3px 0 #7a2b24,6px 6px 0 rgba(0,0,0,.4);text-transform:uppercase}
.kick{font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass2)}
.title-card .sub{color:#c9d6e2}
.title-card label{font-weight:700;margin-top:4px}
.title-card input{background:#f6eedb;color:#2a1d14;border-color:var(--brass)}
.tc-b{display:flex;justify-content:flex-end}
.sea-cap{position:absolute;left:14px;top:14px;background:rgba(20,14,11,.82);border:2px solid var(--brass);border-radius:10px;padding:8px 14px;color:#f4ead2;display:flex;flex-direction:column}
.sea-cap b{font-family:var(--f-disp);font-weight:400;color:var(--acc);font-size:18px}
.toast{position:fixed;left:24px;top:84px;z-index:40;display:flex;align-items:center;gap:10px;background:#f6eedb;color:#2a1d14;border:3px solid var(--brass);border-radius:12px;padding:8px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* ---------- panell del pany ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:2px solid #7a5a1c;border-radius:999px;padding:1px 12px;font-weight:700;font-size:13.5px;background:var(--acc);color:#2a1d14}
.dots{display:flex;gap:5px}.dots span{width:18px;height:12px;border-radius:3px;border:1.5px solid var(--line);background:var(--paper)}
.dots span.ok{background:var(--ok)}.dots span.bad{background:var(--bad)}.dots span.now{background:var(--acc)}
.note-q{position:relative;background:#fbf5e4;color:#2a1d14;border:1px solid #c9b48a;border-radius:4px;padding:12px 14px 12px 18px;box-shadow:2px 3px 0 rgba(0,0,0,.12);transform:rotate(-.3deg)}
.note-q::before{content:'';position:absolute;left:-6px;top:10px;width:12px;height:12px;border-radius:50%;background:radial-gradient(#e0b862,#7a5a1c)}
.qprompt{font-weight:700;font-size:clamp(16.5px,1vw + 8px,20px);line-height:1.4}
.qprompt .expr,.stp-h .expr{display:inline-block;font-family:var(--f-mono);font-size:1.12em;background:linear-gradient(#e0b862,#b8862b);color:#2a1d14;border:1px solid #7a5a1c;border-radius:4px;padding:0 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.stps{display:flex;flex-direction:column;gap:10px}
.stp{display:flex;flex-direction:column;gap:8px}
.stp.multi{border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--cell)}
.stp.multi.done{opacity:.92}
.stp-n{display:inline-block;border:1.5px solid #7a5a1c;border-radius:999px;padding:0 10px;font-size:12.5px;font-weight:700;background:var(--acc);color:#2a1d14;margin-right:4px}
.stp-fb:empty{display:none}
.stp-fb{font-size:15.5px;line-height:1.5;border-radius:8px;padding:7px 11px;border:1.5px solid var(--line)}
.stp-fb.ok{background:var(--okbg)}.stp-fb.bad{background:var(--badbg);border-color:var(--bad)}
.stp-fb .st{font-weight:700;margin-right:4px}.stp-fb .st.ok{color:var(--ok)}.stp-fb .st.bad{color:var(--bad)}
.msg{font-weight:700;min-height:1.3em;text-align:center}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.msg:empty{min-height:0}
.hintline{font-size:13.5px;color:var(--soft)}
.tip{border:2px dashed var(--line);border-radius:8px;background:var(--cell);padding:8px 12px;font-size:15px}
.rowbtn,.act{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#hint{display:inline-flex;align-items:center;gap:8px}#hint svg.mini{width:28px;height:28px;border-radius:6px}
.shake{animation:shake .35s ease}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.expr{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.expr.inl{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;white-space:normal;font-size:22px}
.k-qwrap{display:inline-flex}
input.k-inbox{width:3.6ch;min-width:3.6ch;font-size:24px;padding:4px 8px;border:1px solid #a34a00;background:#fff8f0;color:#a34a00}
/* finestreta de comptador per a les respostes numèriques */
.sk-code .answer input:not(.k-inbox){background:#1a1410;color:#ffd98a;border:3px solid var(--brass);box-shadow:inset 0 3px 8px rgba(0,0,0,.6);letter-spacing:.12em;width:6.5ch;font-size:26px}
.sk-code .answer input:disabled{opacity:1;color:#7fe0a8}
/* opcions de diàleg (com a les aventures gràfiques) */
.choices{display:grid;gap:6px}
.choices button{text-align:left;font-weight:400;font-size:16px;line-height:1.35;padding:9px 12px 9px 30px;position:relative}
.sk-talk .choices,.sk-yn .choices{background:#1d1510;border:2px solid var(--brass);border-radius:10px;padding:8px}
.sk-talk .choices button,.sk-yn .choices button{background:transparent;border:0;color:#f4ead2;min-height:40px}
.sk-talk .choices button::before,.sk-yn .choices button::before{content:'▸';position:absolute;left:10px;color:var(--brass2)}
.sk-talk .choices button:hover:not(:disabled),.sk-yn .choices button:hover:not(:disabled){background:rgba(242,182,50,.14);color:#ffd98a}
.sk-yn .choices{grid-template-columns:1fr 1fr}
.choices button.right{background:#1f6a3a!important;color:#fff!important;font-weight:700;opacity:1}
.choices button.wrong{background:#7a2b24!important;color:#fff!important;text-decoration:line-through}
.choices button:disabled{opacity:.8}
/* targetes de llautó amb xifres */
.sk-tiles .choices{display:flex;gap:12px;flex-wrap:wrap}
.sk-tiles .choices button{width:72px;height:88px;padding:0;text-align:center;font-family:var(--f-mono);font-size:40px;color:#2a1d14;border:2px solid #7a5a1c;border-radius:8px;
  background:linear-gradient(160deg,#f0d48a,#c99a3a 55%,#a07020);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 4px 0 #6b4a1c;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.sk-tiles .choices button::before{content:'';position:absolute;top:6px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#6b4a1c}
.sk-tiles .choices button.right{transform:translateY(-6px)}
/* botons per marcar: estil base */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.pick button{font-family:var(--f-mono);font-size:18px;padding:6px 2px;min-height:48px;font-variant-numeric:tabular-nums;position:relative}
.pick button.right{outline:3px solid var(--ok);outline-offset:1px;opacity:1}
.pick button.miss{outline:3px dashed var(--ok);outline-offset:1px;opacity:1}
.pick button.wrong{outline:3px solid var(--bad);outline-offset:1px;text-decoration:line-through;opacity:1}
.pick button:disabled{opacity:1}
/* teclat de llautó */
.sk-keys .pick button{border-radius:999px;border:2px solid #6b4a1c;color:#2a1d14;background:radial-gradient(circle at 35% 30%,#fff1c4,#e0b862 40%,#a07020);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 3px 0 #4a321c;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.sk-keys .pick button[aria-pressed="true"]{transform:translateY(3px);box-shadow:inset 0 3px 6px rgba(0,0,0,.4),0 0 0 #4a321c,0 0 14px #7cf0a0;background:radial-gradient(circle at 50% 50%,#d9ffe6,#7cd99a 60%,#2f8a4f)}
/* calaixos de la caixa forta */
.sk-safe .pick button{border:3px solid #1d3a30;border-radius:6px;background:linear-gradient(#3a6b58,#2f5a4a);color:#2a1d14;padding:14px 4px 8px}
.sk-safe .pick button span{display:inline-block;background:linear-gradient(#f0d48a,#b8862b);border:1px solid #6b4a1c;border-radius:3px;padding:1px 6px}
.sk-safe .pick button::after{content:'';position:absolute;top:5px;left:50%;width:18px;height:4px;margin-left:-9px;border-radius:2px;background:#c9d3dc}
.sk-safe .pick button[aria-pressed="true"]{background:linear-gradient(#1d3a30,#2f5a4a);box-shadow:0 0 0 3px #f2b632,inset 0 0 12px #000}
/* bombetes */
.sk-bulbs .pick{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
.sk-bulbs .pick button{background:#2a2e34;color:#e8eef2;border:2px solid #1d1d1b;border-radius:10px;padding:36px 2px 6px}
.sk-bulbs .pick button::before{content:'';position:absolute;top:6px;left:50%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#4a5058;border:2px solid #1d1d1b;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3)}
.sk-bulbs .pick button[aria-pressed="true"]::before{background:radial-gradient(#fff6c4,#ffd23f 60%,#e09a1c);box-shadow:0 0 18px 6px rgba(255,210,63,.7)}
.sk-bulbs .pick button[aria-pressed="true"]{color:#ffd98a}
/* ràdio: botons de baquelita */
.sk-dial .pick button{background:linear-gradient(#5a3a22,#3a2414);color:#ffe7a3;border:2px solid #1d1510;border-radius:8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 3px 0 #1d1510}
.sk-dial .pick button[aria-pressed="true"]{background:linear-gradient(#ffd98a,#e0a526);color:#2a1d14;box-shadow:0 0 14px rgba(255,217,138,.7);transform:translateY(2px)}
/* tambors del comptador */
.sk-drums .pick{grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;background:#1d1d1b;padding:6px;border-radius:8px;border:3px solid #8a6a3a}
.sk-drums .pick button{min-height:60px;font-size:24px;border-radius:4px;border:1px solid #3a2e1a;color:#10283a;background:linear-gradient(#bdb6a4,#f4f1e8 30%,#f4f1e8 70%,#bdb6a4)}
.sk-drums .pick button[aria-pressed="true"]{background:linear-gradient(#c9a03a,#ffe7a3 30%,#ffe7a3 70%,#c9a03a);box-shadow:0 0 10px #ffd98a}
/* capses de fusta */
.sk-crates .pick{grid-template-columns:repeat(4,minmax(0,1fr))}
.sk-crates .pick button{min-height:84px;color:#f4ead2;border:3px solid #4a321c;border-radius:4px;background:repeating-linear-gradient(0deg,#a07a4a 0 12px,#8a6a3a 12px 14px);font-family:var(--f-body);font-weight:700}
.sk-crates .pick button span::before{content:'Capses de ';font-size:13px;display:block;font-weight:400}
.sk-crates .pick button span{display:block;font-size:26px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.sk-crates .pick button[aria-pressed="true"]::after{content:'✓';position:absolute;top:4px;right:6px;font-size:22px;color:#7fe0a8;text-shadow:0 0 6px #000}
.sk-crates .pick button[aria-pressed="true"]{border-color:#f2b632}
/* plaques de llautó per als panys */
.sk-tags .pick button{border-radius:6px 22px 22px 6px;border:2px solid #6b4a1c;color:#2a1d14;background:linear-gradient(#f0d48a,#c99a3a);padding-left:18px;box-shadow:0 3px 0 #6b4a1c}
.sk-tags .pick button::before{content:'';position:absolute;left:6px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#1d1510}
.sk-tags .pick button[aria-pressed="true"]{background:linear-gradient(#c8f5d6,#5fbf85);box-shadow:0 0 0 3px #1d7a52,0 0 12px rgba(95,208,154,.8)}.sk-tags .pick button[aria-pressed="true"]::after{content:'✓';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#0d4a2a;font-family:var(--f-body)}
.sk-paper .pick button{background:#fbf5e4;border-color:#c9b48a}
.sk-paper .pick button[aria-pressed="true"]{background:var(--acc)}
.k-tools{display:flex;flex-wrap:wrap;gap:8px}
/* ---------- quadern ---------- */
.nbov{position:fixed;inset:0;z-index:30;background:rgba(10,7,5,.55);display:flex;align-items:center;justify-content:center;padding:14px}
.nb{width:min(980px,100%);max-height:100%;overflow:auto;background:#8a3229;border:3px solid #5a1f19;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;color:#f4ead2;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.nb-h{display:flex;justify-content:space-between;align-items:center}.nb-h h2{font-family:var(--f-disp);font-size:24px;color:#ffe7a3}
.nb-pages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.nb-p{background:repeating-linear-gradient(#fbf5e4 0 26px,#d9e4ee 26px 27px);color:#2a1d14;border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 6px 0 0 #e8b4a8}
.nb-p h3{font-family:var(--f-disp);font-size:16px;color:#8a3229}
.nb-l{font-family:'Segoe Print','Bradley Hand','Comic Sans MS',var(--f-body);font-size:15.5px}
.nb-ex{font-family:var(--f-mono);font-size:14px;color:#1f5fad}
.nb-l.blank{color:#b0a490}
.nb-f{font-size:13px;color:#f4d6cf}
@media (max-width:760px){.nb-pages{grid-template-columns:1fr}}
/* ---------- final ---------- */
.fin{display:flex;flex-direction:column;gap:12px}
.fin h2{font-family:var(--f-disp);font-size:clamp(22px,2vw + 8px,30px);line-height:1.1}
.fin .kick{color:#8a6a2a}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:2px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--cell);display:flex;flex-direction:column}
.stat b{font-family:var(--f-disp);font-weight:400;font-size:20px}.stat span{font-size:13px;color:var(--soft)}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:5px}
.recap div{display:flex;flex-direction:column;padding:5px 10px;border:1.5px solid var(--line);border-radius:6px;font-size:14px}
.recap .ok{background:var(--okbg)}.recap .bad{background:var(--badbg);border-color:var(--bad)}
.repbar{display:flex;flex-wrap:wrap;gap:8px}
/* revisió a pantalla completa */
#review{position:fixed;inset:0;z-index:35;overflow:auto;background:var(--paper);padding:14px}
.k-repbox{max-height:none}

/* ---------- animacions de les escenes ---------- */
.scene .stars circle{fill:#f4ecd2}.scene .tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.scene .cl{animation:drift 26s linear infinite}@keyframes drift{50%{transform:translateX(-30px)}}
.scene .flash{animation:flash 7s linear infinite}.scene .bolt{animation:bolt 7s linear infinite}
.lv3 .flash,.lv3 .bolt{animation-duration:4s}
@keyframes flash{0%,88%,92%,96%,100%{opacity:0}90%,94%{opacity:.45}}
@keyframes bolt{0%,88%,92%,100%{opacity:0}89%,91%{opacity:1}}
.scene .fw{fill:#2c3d4c}.scene .fw.lit{fill:#ffd98a}
.scene .glow{animation:glow 2.6s ease-in-out infinite}@keyframes glow{50%{opacity:.18}}
.scene .beam{animation:beam 5s ease-in-out infinite}@keyframes beam{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.scene .bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.scene .ship.rock .bob{animation:rock 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px) rotate(-1.5deg)}}
@keyframes rock{25%{transform:translateY(4px) rotate(-6deg)}75%{transform:translateY(-2px) rotate(6deg)}}
.scene .pennant{animation:flag .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}@keyframes flag{to{transform:scaleX(.7)}}
.scene .slight{animation:glow 1.4s ease-in-out infinite}
.scene .shipwrap{transform:translateX(var(--sx,90px));transition:transform 2.2s cubic-bezier(.45,0,.3,1)}
.scene .wv{animation:wave 6s linear infinite}.scene .w2{animation-duration:4.5s;animation-direction:reverse}
.sl2 .wv{animation-duration:3s}.sl3 .wv{animation-duration:2s}
@keyframes wave{to{transform:translateX(-80px)}}
.scene .splash{animation:spl 2.4s ease-in-out infinite}@keyframes spl{50%{opacity:.2}}
.scene .chim circle,.scene .smoke circle{animation:smoke 3s ease-out infinite}.scene .chim circle:nth-child(2),.scene .smoke circle:nth-child(2){animation-delay:-1s}.smoke circle:nth-child(3){animation-delay:-2s}
@keyframes smoke{from{transform:translateY(4px);opacity:.8}to{transform:translateY(-10px);opacity:0}}
.scene .blink,.pt .blink{animation:blinkE 4.2s infinite;transform-box:fill-box;transform-origin:center}@keyframes blinkE{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.scene .lglow{animation:flick 1.8s ease-in-out infinite}.scene .flame{animation:flame .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{opacity:.08}}@keyframes flame{to{transform:scale(.85,1.1)}}
.scene .fire{animation:flame .4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.scene .fglow{animation:flick 1.2s ease-in-out infinite}
.scene .rwave{animation:spl 1s ease-in-out infinite}
.scene .h-body,.scene .h-head{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(1.015)}}
.scene .walkin{animation:walkin 1.4s ease-out}
@keyframes walkin{from{transform:translateX(-200px)}}
.scene .tube .snd{opacity:0}
.joan-talks .scene .tube .snd{animation:snd .7s ease-out infinite}
@keyframes snd{from{opacity:1;transform:translateX(4px)}to{opacity:0;transform:translateX(-14px)}}
.scene .wflash{animation:flash 7s linear infinite}
.scene .slight2{animation:glow 1.2s ease-in-out infinite}
/* sales resoltes */
.r-t1.st-ok .kp{fill:#7cf0a0}
.r-t2 .dial{transition:transform 1.5s ease}.r-t2.st-ok .dial{transform:rotate(540deg)}
.r-t3.st-ok .bulb circle{fill:#ffd23f;filter:drop-shadow(0 0 6px #ffd23f)}
.r-t3 .gear{transition:none}.r-t3.st-ok .gear{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.r-t4 .needle{animation:needle 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes needle{50%{transform:rotate(20deg)}}
.r-t5 .gauge{animation:gauge 1.4s ease-in-out infinite}@keyframes gauge{50%{transform:rotate(30deg)}}
.r-t5.st-ok .drum rect{fill:#ffe7a3}
.r-t7.st-ok .lock{animation:unlock .9s ease-in forwards}@keyframes unlock{to{transform:translateY(150px) rotate(25deg);opacity:.7}}
.r-t8.st-ok .core{fill:#fff6c4;filter:drop-shadow(0 0 30px #ffd23f)}.r-t8.st-ok .lens ellipse{stroke:#fff6c4}
.st-bad .lamp .lglow{animation-duration:.5s}
/* desenllaç */
.end-ok .shipwrap{animation:sail-ok 6s ease-in-out forwards}
@keyframes sail-ok{0%{transform:translateX(var(--sx))}35%{transform:translateX(calc(var(--sx) + 10px))}50%{transform:translateX(calc(var(--sx) + 10px)) scale(-1,1)}100%{transform:translate(200px,-26px) scale(-.78,.78)}}
.end-close .shipwrap{animation:sail-close 7s ease-in-out forwards}
@keyframes sail-close{0%{transform:translateX(var(--sx))}40%{transform:translateX(370px)}55%{transform:translateX(370px) scale(-1,1)}100%{transform:translate(230px,-20px) scale(-.82,.82)}}
.end-lost .shipwrap{animation:sail-lost 8s ease-in-out forwards}
@keyframes sail-lost{0%{transform:translateX(var(--sx))}100%{transform:translateX(150px)}}
.end-lost .far .glow{animation-delay:3s}
.still .shipwrap{animation-delay:-20s!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

/* ---------- mòbil i pantalles estretes ---------- */
@media (max-width:860px),(max-aspect-ratio:1/1){
  .brand,.hsea{display:none}
  .top{gap:6px 10px;padding:5px 8px}.trams{justify-content:flex-start}.tr{width:26px;height:30px;font-size:13px}
  body[data-mode="split"] .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

  .sk-crates .pick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sk-drums .pick{grid-template-columns:repeat(5,minmax(0,1fr))}
}

<body>
<div id="app">
  <header class="top" id="top" hidden>
    <span class="brand">L'Escala del Far</span>
    <div class="hsea" id="hsea" aria-hidden="true"></div>

    <div class="tbtn"><button type="button" class="small nbbtn" id="bNb" aria-label="Obrir el quadern del farer"></button><button type="button" class="small" id="bRev" hidden>◀ Revisar</button></div>
  </header>
  <div class="stage">
    <div class="scol">
      <div class="view" id="view"></div>
      <div class="dlg" id="dlg" aria-live="polite"></div>

  </div>
</div>
<section id="review" class="k-rv" hidden aria-label="Revisió"></section>
<div class="nbov" id="nbov" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
<script>

/* =====================================================================
   KIT comú: motor d'operacions combinades, estratègies de divisió,

/* ---------------- motor d'expressions ----------------
   Sintaxi: nombres, + - * : (o ·, /, −), ( ) [ ], ^n (potència), rN o r(...) (arrel quadrada) */
function parse(src){
  const s=String(src).replace(/\s+/g,'').replace(/·/g,'*').replace(/−/g,'-').replace(/\//g,':');let i=0;
  function atom(){const c=s[i];
    if(c==='('||c==='['){i++;const L=list(c==='('?')':']');return {k:'G',br:c,L};}
    const j=i;while(i<s.length&&/\d/.test(s[i]))i++;if(j===i)throw new Error('parse '+src+' @'+i);return {k:'N',v:+s.slice(j,i)};}
  function operand(){if(s[i]==='r'){i++;return {k:'R',arg:atom()};}
    let a=atom();if(s[i]==='^'){i++;const j=i;while(i<s.length&&/\d/.test(s[i]))i++;a={k:'P',base:a,e:+s.slice(j,i)};}return a;}
  function list(end){const items=[];
    while(i<s.length&&s[i]!==end){items.push(operand());
      if(i<s.length&&s[i]!==end){const c=s[i++];items.push({k:'O',o:c==='*'?'*':c===':'?'/':c});}}
    if(end)i++;return {k:'L',items};}
  return list(null);
}
const clone=o=>JSON.parse(JSON.stringify(o));
const SYM={'+':'+','-':'−','*':'·','/':':'};
function findStep(L,depth){

    if(x.k==='G'){const r=findStep(x.L,depth+1);if(r)return r;}
    if(x.k==='P'&&x.base.k==='G'){const r=findStep(x.base.L,depth+1);if(r)return r;}
    if(x.k==='R'&&x.arg.k==='G'){const r=findStep(x.arg.L,depth+1);if(r)return r;}}
  for(let j=0;j<it.length;j+=2){const x=it[j];if(x.k==='P'||x.k==='R')return {L,idx:j,ph:'E',depth};}
  for(let j=1;j<it.length;j+=2)if(it[j].o==='*'||it[j].o==='/')return {L,idx:j,ph:'MD',depth};
  for(let j=1;j<it.length;j+=2)return {L,idx:j,ph:'AS',depth};

function normalize(L){
  L.items=L.items.map(x=>{
    if(x.k==='G'){normalize(x.L);if(x.L.items.length===1&&x.L.items[0].k==='N')return x.L.items[0];}
    if(x.k==='P'&&x.base.k==='G'){normalize(x.base.L);if(x.base.L.items.length===1)x.base=x.base.L.items[0];}
    if(x.k==='R'&&x.arg.k==='G'){normalize(x.arg.L);if(x.arg.L.items.length===1)x.arg=x.arg.L.items[0];}
    return x;});
}
function applyStep(st){
  const it=st.L.items;let res,a,b,o,info;
  if(st.ph==='E'){const x=it[st.idx];
    if(x.k==='P'){a=x.base.v;res=Math.pow(a,x.e);info={kind:'pow',a,e:x.e,res};}
    else{a=x.arg.v;res=Math.round(Math.sqrt(a));if(res*res!==a)throw new Error('arrel no exacta '+a);info={kind:'rad',a,res};}
    const N={k:'N',v:res,fresh:true,newest:true};it[st.idx]=N;return {N,info};}
  a=it[st.idx-1].v;b=it[st.idx+1].v;o=it[st.idx].o;
  if(o==='+')res=a+b;else if(o==='-'){res=a-b;if(res<0)throw new Error('negatiu');}
  else if(o==='*')res=a*b;else{if(b===0||a%b)throw new Error('divisió no exacta '+a+':'+b);res=a/b;}
  const N={k:'N',v:res,fresh:true,newest:true};it.splice(st.idx-1,3,N);return {N,info:{kind:'bin',a,b,o,res}};
}
/* tokens per mostrar (pantalla i animació) */
function tokens(L,mark,out){out=out||[];
  const mk=(list,j)=>!!(mark&&mark.L===list&&(mark.ph==='E'?j===mark.idx:(j>=mark.idx-1&&j<=mark.idx+1)));
  function op(x,m){
    if(x.k==='N')out.push({k:'num',v:x.v,m,fresh:!!x.fresh,nw:!!x.newest});
    else if(x.k==='G'){out.push({k:'br',t:x.br});tokens(x.L,mark,out);out.push({k:'br',t:x.br==='('?')':']'});}
    else if(x.k==='P'){if(x.base.k==='N')out.push({k:'pow',v:x.base.v,e:x.e,m});else{op(x.base,false);out.push({k:'sup',e:x.e,m});}}

}
function tokHTML(t,radFn){

function html(L,radFn,mark){const tk=tokens(L,mark);let s='';
  tk.forEach((t,i)=>{const prev=tk[i-1];let h=tokHTML(t,radFn);
    if(t.m)h='<mark>'+h+'</mark>';
    const noSp=!prev||(prev.k==='br'&&(prev.t==='('||prev.t==='['))||(t.k==='br'&&(t.t===')'||t.t===']'))||t.k==='sup'||prev.k==='radsign';
    s+=(noSp?'':' ')+h;});
  return s;
}
/* resol una expressió: llista de passos complets */
function solve(src){
  let cur=typeof src==='string'?parse(src):clone(src);normalize(cur);
  const steps=[];let guard=0;
  while(guard++<60){const c=clone(cur);const st=findStep(c,0);if(!st)break;
    const before=tokens(c,st);
    const {N,info}=applyStep(st);normalize(c);const after=tokens(c);delete N.newest;
    steps.push({ph:st.ph,depth:st.depth,info,before,after,stateAfter:clone(c)});
    cur=c;}
  const v=cur.items.length===1&&cur.items[0].k==='N'?cur.items[0].v:NaN;
  return {start:typeof src==='string'?normalizeCopy(parse(src)):src,steps,value:v};
}
function normalizeCopy(L){normalize(L);return L;}
function valid(src){try{const r=solve(src);return Number.isInteger(r.value)&&r.value>=0?r:null;}catch(e){return null;}}
/* explicació encadenada: expr = ... = <b>valor</b>  (agrupa operacions independents de la mateixa fase) */
function chain(src,radFn){
  const r=solve(src);const parts=[html(parse(src),radFn)];
  r.steps.forEach((s,i)=>{const nx=r.steps[i+1];
    const merge=nx&&nx.ph===s.ph&&nx.depth===s.depth&&(s.ph==='MD'||s.ph==='E')&&!nx.before.some(t=>t.m&&t.fresh);
    if(merge)return;
    parts.push(html(s.stateAfter,radFn));});

  return parts.join(' = ');
}

function stepCaption(s){const i=s.info;let t;
  if(i.kind==='pow')t='Potència: '+i.a+'<sup>'+i.e+'</sup> = '+Array(i.e).fill(i.a).join(' · ')+' = '+nf(i.res);

    h+='<div class="k-rv-scr"><span class="k-rv-tag">Esborrany de la pregunta '+esc(it.label||String(i+1))+'</span>'+(img?'<img alt="Esborrany" src="'+img+'">':'')+(it.scratch.text&&it.scratch.text.trim()?'<pre>'+esc(it.scratch.text)+'</pre>':'')+'</div>';});}

function Review(o){
  /* o: {host, main, units:()=>[], onOpen, onClose, itemExtra, after(el,u)} */
  let idx=0;
  function list(){return o.units().filter(u=>u.items.length);}
  function show(i){const L=list();if(!L.length)return;idx=Math.max(0,Math.min(L.length-1,i));const u=L[idx];
    o.main.hidden=true;o.host.hidden=false;
    o.host.innerHTML='<div class="k-rv-bar"><span class="k-rv-badge">Mode revisió · només lectura</span>'
      +'<span class="k-rv-nav"><button type="button" class="k-prev"'+(idx===0?' disabled':'')+'>◀ Anterior</button>'
      +'<span class="k-rv-count">'+(idx+1)+' de '+L.length+'</span>'
      +'<button type="button" class="k-next"'+(idx===L.length-1?' disabled':'')+'>Següent ▶</button></span></div>'
      +'<div class="k-rv-body">'+unitHTML(u,{itemExtra:o.itemExtra})+'</div>'
      +'<button type="button" class="k-back primary">Tornar on era</button>';
    o.host.querySelector('.k-prev').onclick=()=>show(idx-1);
    o.host.querySelector('.k-next').onclick=()=>show(idx+1);
    o.host.querySelector('.k-back').onclick=close;
    if(o.after)o.after(o.host,u);
    window.scrollTo(0,0);o.host.querySelector('.k-back').focus({preventScroll:true});
    if(o.onOpen)o.onOpen(u);}
  function close(){o.host.hidden=true;o.host.innerHTML='';o.main.hidden=false;if(o.onClose)o.onClose();window.scrollTo(0,0);}
  function openKey(key){const L=list();const i=L.findIndex(u=>u.key===key);show(i<0?L.length-1:i);}
  return {show,close,openKey,openLast:()=>show(list().length-1),count:()=>list().length,isOpen:()=>!o.host.hidden};
}

function fmtDate(t){try{return new Date(t).toLocaleString('ca-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return new Date(t).toISOString();}}
function buildReport(LOG,meta){
  /* meta: {title, subtitle, stats:[[label,value]], extraTop(html), outcomeTitle, outcomeText, footer} */

  const all=[].concat.apply([],units.map(u=>u.items));
  const c={first:0,second:0,fail:0,skip:0};all.forEach(i=>c[i.res]=(c[i.res]||0)+1);
  const mins=Math.max(1,Math.round(((LOG.end||Date.now())-LOG.start)/60000));

   +'<div class="kr-head"><div><p class="kr-kick">Informe de l\'activitat</p><h1>'+meta.title+'</h1><p class="kr-sub">'+(meta.subtitle||'')+'</p></div>'
   +'<table class="kr-id"><tr><th>Alumne/a</th><td>'+(LOG.name?esc(LOG.name):'_____________________')+'</td></tr><tr><th>Data</th><td>'+fmtDate(LOG.end||Date.now())+'</td></tr><tr><th>Durada</th><td>'+mins+' min</td></tr></table></div>'
   +'<div class="kr-stats">'+(meta.stats||[]).map(s=>'<div><b>'+s[1]+'</b><span>'+s[0]+'</span></div>').join('')
   +'<div><b>'+c.first+' / '+all.length+'</b><span>Encerts al primer intent</span></div><div><b>'+c.second+'</b><span>Encerts al segon intent</span></div><div><b>'+(c.fail+c.skip)+'</b><span>No resolts</span></div></div>'
   +(meta.outcomeTitle?'<div class="kr-out"><b>'+meta.outcomeTitle+'</b> '+(meta.outcomeText||'')+'</div>':'')
   +(meta.extraTop||'');
  /* resum per temes */
  h+='<div class="kr-keep"><h2>Resum per reptes</h2><table class="kr-sum"><thead><tr><th>Repte</th><th>Contingut</th><th>1r intent</th><th>2n intent</th><th>No resolts</th>'+(meta.points?'<th>Punts</th>':'')+'<th>Pista</th></tr></thead><tbody>';
  units.forEach(u=>{const k={first:0,second:0,fail:0,skip:0};u.items.forEach(i=>k[i.res]++);
    h+='<tr><td>'+esc(u.label)+' · '+u.title+'</td><td>'+u.topic+'</td><td>'+k.first+'</td><td>'+k.second+'</td><td>'+(k.fail+k.skip)+'</td>'+(meta.points?'<td>'+(u.pts!=null?u.pts:'')+'</td>':'')+'<td>'+((u.hint&&u.hint.used)||u.items.some(i=>i.hint)?'Sí':'—')+'</td></tr>';});
  h+='</tbody></table></div>';
  const weak=units.filter(u=>u.items.some(i=>i.res!=='first'));
  const strong=units.filter(u=>u.items.length&&u.items.every(i=>i.res==='first'));
  h+='<div class="kr-cols"><div class="kr-good"><b>Punts forts</b>'+(strong.length?'<ul>'+strong.map(u=>'<li>'+u.topic+'</li>').join('')+'</ul>':'<p>Encara cap repte sense errors. Endavant!</p>')+'</div>'
    +'<div class="kr-weak"><b>Per repassar</b>'+(weak.length?'<ul>'+weak.map(u=>'<li>'+u.topic+' ('+u.items.filter(i=>i.res!=='first').length+' '+(u.items.filter(i=>i.res!=='first').length===1?'apartat':'apartats')+')</li>').join('')+'</ul>':'<p>Res a repassar: tot correcte al primer intent.</p>')+'</div></div>'+(meta.footer?'<p class="kr-note">'+meta.footer+'</p>':'');
  /* detall */
  units.forEach((u,ui)=>{
    h+='<section class="kr-u"><div class="kr-top">'+(ui===0?'<h2>Detall de cada repte</h2>':'')+'<div class="kr-uh"><span>'+esc(u.label)+'</span><div><b>'+u.title+'</b><i>'+u.topic+'</i></div>'+(u.ptsTxt?'<em>'+u.ptsTxt+'</em>':'')+'</div>';
    if(u.context)h+='<div class="kr-ctx">'+u.context+'</div>';
    h+='</div>';
    u.items.forEach((it,i)=>{
      if(i===u.items.length-1)h+='<div class="kr-tail">';
      h+='<div class="kr-q kr-'+it.res+'"><div class="kr-qh"><span class="kr-l">'+esc(it.label||String(i+1))+'</span><div>'+it.prompt+'</div><span class="kr-badge">'+({first:'✓ 1r intent',second:'✓ 2n intent',fail:'✗ no resolt',skip:'✗ en blanc'})[it.res]+'</span></div>'
        +'<table class="kr-qt"><tr><th>Respostes</th><td>'+(it.attempts.length?(o=>it.attempts.map((a,k)=>o[k]+': '+(a.text===''?'(en blanc)':esc(a.text))+' '+(a.ok?'✓':'✗')).join(' &nbsp;·&nbsp; '))(attOrd(it.attempts)):'(sense resposta)')+'</td></tr>'
        +'<tr><th>Correcta</th><td><b>'+it.correct+'</b></td></tr><tr><th>Explicació</th><td>'+it.explain+'</td></tr>'
        +(it.hint?'<tr><th>Pista</th><td>'+it.hint+'</td></tr>':'')
        +(it.tips?'<tr><th>Suport</th><td>Ha consultat les estratègies de càlcul mental per dividir.</td></tr>':'')
        +'</table>';
      if(it.scratch&&!scratchEmpty(it.scratch)){const img=scratchImage(it.scratch,640,220);h+='<div class="kr-scr"><span>Esborrany</span>'+(img?'<img alt="" src="'+img+'">':'')+(it.scratch.text&&it.scratch.text.trim()?'<pre>'+esc(it.scratch.text)+'</pre>':'')+'</div>';}
      h+='</div>';});
    if(u.hint&&u.hint.used)h+='<p class="kr-hint"><b>Pista utilitzada:</b> '+u.hint.text+'</p>';
    if(!scratchEmpty(u.scratch)){const img=scratchImage(u.scratch,640,220);h+='<div class="kr-scr"><span>Esborrany del repte</span>'+(img?'<img alt="" src="'+img+'">':'')+(u.scratch.text&&u.scratch.text.trim()?'<pre>'+esc(u.scratch.text)+'</pre>':'')+'</div>';}
    if(u.outcome)h+='<p class="kr-o"><b>Conseqüència:</b> '+u.outcome.title+'.</p>';
    h+='</div></section>';});
  h+='</div>';
  /* arrels en text pla (l'SVG no es captura bé al PDF) */
  return h.replace(/<span class="rt"[^>]*>[\s\S]*?<span class="rx">([\s\S]*?)<\/span><\/span>/g,(m,x)=>'√'+(/\s/.test(x.trim())?'('+x+')':x));
}

async function savePDF(reportEl,filename,onState){
  onState=onState||function(){};
  try{onState('loading');await loadScript(window.KIT_PDFLIB||PDFLIB);
    const outer=document.createElement('div');outer.className='k-pdfout';const box=document.createElement('div');box.className='k-pdfbox';box.innerHTML=reportEl.innerHTML;outer.appendChild(box);document.body.appendChild(outer);
    let blob;
    const h1=box.querySelector('h1'),nm=box.querySelector('.kr-id td');const head=(h1?h1.textContent:'Informe')+(nm&&!/^_+$/.test(nm.textContent.trim())?' · '+nm.textContent.trim():'');

        html2canvas:{scale:2,backgroundColor:'#ffffff',useCORS:true,scrollX:0,scrollY:0},
        jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],before:['.kr-u'],avoid:['.kr-tail','.kr-q','.kr-top','.kr-head','.kr-stats','.kr-keep','.kr-cols','.kr-hint','.kr-o','.kr-out','tr','.kr-scr','.kr-note']}})
      .from(box).toPdf().get('pdf').then(pdf=>{const n=pdf.internal.getNumberOfPages(),W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
        for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFont('helvetica','normal');pdf.setFontSize(8.5);pdf.setTextColor(110);
          pdf.text(head,14,11);pdf.text(fmtDate(Date.now()),W-14,11,{align:'right'});pdf.setDrawColor(190);pdf.setLineWidth(.2);pdf.line(14,13,W-14,13);
          pdf.line(14,H-13,W-14,H-13);pdf.text('Pàgina '+i+' de '+n,W-14,H-8,{align:'right'});}}).outputPdf('blob');}
    finally{outer.remove();}
    const dl=await downloadsNS();
    if(dl){try{await dl.save({filename,data:blob});onState('done');}catch(e){onState(e&&e.code==='declined'?'declined':'fail',e);return false;}return true;}
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
    onState('done');return true;
  }catch(e){onState('fail',e);return false;}
}

/* ---------------- botonera de potències ----------------
   mode 'pow': escriure base i/o exponent (els fixos es mostren bloquejats)
   mode 'factors': escriure una multiplicació de factors (3 · 3 · 3) */
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹';
const supNum=s=>String(s).replace(/\d/g,d=>SUPD[d]);
function PowPad(o){
  const el=document.createElement('div');el.className='pp';
  const st={base:o.base!=null?String(o.base):'',exp:o.exp!=null?String(o.exp):'',seq:'',slot:o.mode==='pow'?(o.base!=null?'exp':'base'):'seq',locked:false};
  const fixed={base:o.base!=null,exp:o.exp!=null};
  el.innerHTML='<div class="pp-disp" tabindex="0" role="group" aria-label="'+(o.mode==='pow'?'Potència que escrius':'Multiplicació que escrius')+'"></div>'
    +'<div class="pp-keys" role="group" aria-label="Botonera"><div class="pp-digits">'
    +'1234567890'.split('').map(d=>'<button type="button" data-k="'+d+'">'+d+'</button>').join('')+'</div><div class="pp-ctl">'
    +(o.mode==='pow'?(fixed.base?'':'<button type="button" class="pp-sw" data-k="base">Base</button>')+(fixed.exp?'':'<button type="button" class="pp-sw" data-k="exp">Exponent <sup>↑</sup></button>'):'<button type="button" class="pp-sw" data-k="·" aria-label="per">·</button>')
    +'<button type="button" class="pp-del" data-k="del" aria-label="Esborrar l\'últim">⌫</button><button type="button" class="pp-del" data-k="clr">Esborrar</button></div></div>';
  const disp=el.querySelector('.pp-disp');
  function box(which){const v=st[which];const ed=!fixed[which];const on=ed&&st.slot===which&&!st.locked;
    return '<span class="pp-'+which+(ed?' ed':' fx')+(on?' on':'')+'" data-slot="'+which+'">'+(v===''?'<i>?</i>':v)+'</span>';}
  function draw(){
    if(o.mode==='pow'){
      disp.innerHTML='<span class="pp-pow">'+box('base')+'<span class="pp-sup">'+box('exp')+'</span></span>'
        +'<span class="pp-labels"><span class="'+(st.slot==='base'&&!fixed.base?'on':'')+'">'+(fixed.base?'base: '+st.base:'escriu la <b>BASE</b>')+'</span><span class="'+(st.slot==='exp'&&!fixed.exp?'on':'')+'">'+(fixed.exp?'exponent: '+st.exp:'escriu l\'<b>EXPONENT</b> ↑')+'</span></span>';
      disp.querySelectorAll('[data-slot]').forEach(s=>s.onclick=()=>{if(st.locked||fixed[s.dataset.slot])return;st.slot=s.dataset.slot;draw();});
    }else{
      const t=st.seq.split('·').map(x=>x.trim());disp.innerHTML='<span class="pp-seq">'+(st.seq===''?'<i>escriu els factors: 3 · 3 · …</i>':t.map((x,i)=>'<span>'+(x===''?'<i>?</i>':x)+'</span>').join('<b>·</b>'))+'</span>';}
  }
  function key(k){if(st.locked)return;
    if(o.mode==='pow'){
      if(k==='base'||k==='exp'){if(!fixed[k])st.slot=k;}
      else if(k==='del'){st[st.slot]=st[st.slot].slice(0,-1);}
      else if(k==='clr'){if(!fixed.base)st.base='';if(!fixed.exp)st.exp='';st.slot=fixed.base?'exp':'base';}
      else if(/\d/.test(k)&&st[st.slot].length<4)st[st.slot]+=k;
    }else{
      if(k==='·'){if(st.seq!==''&&!/·\s*$/.test(st.seq))st.seq+=' · ';}
      else if(k==='del'){st.seq=st.seq.replace(/\s*·\s*$/,'');if(!/·\s*$/.test(st.seq))st.seq=st.seq.slice(0,-1);st.seq=st.seq.replace(/\s+$/,'');}
      else if(k==='clr')st.seq='';
      else if(/\d/.test(k)&&st.seq.length<60)st.seq+=k;
    }
    draw();if(o.onChange)o.onChange();}
  el.querySelector('.pp-keys').onclick=e=>{const b=e.target.closest('button');if(b)key(b.dataset.k);};
  disp.addEventListener('keydown',e=>{const k=e.key;
    if(/^\d$/.test(k))key(k);else if(k==='Backspace')key('del');
    else if(o.mode==='pow'&&(k==='^'||k==='ArrowUp'))key('exp');else if(o.mode==='pow'&&k==='ArrowDown')key('base');
    else if(o.mode!=='pow'&&(k==='*'||k==='.'||k==='x'||k===' '))key('·');
    else if(k==='Enter'&&o.onEnter)o.onEnter();else return;e.preventDefault();});
  draw();
  return {el,
    value:()=>o.mode==='pow'?{base:st.base,exp:st.exp}:{seq:st.seq},
    empty:()=>o.mode==='pow'?((!fixed.base&&st.base==='')||(!fixed.exp&&st.exp==='')):st.seq.trim()==='',
    text:()=>o.mode==='pow'?(st.base||'?')+supNum(st.exp||'?'):st.seq,
    set:v=>{if(o.mode==='pow'){st.base=String(v.base);st.exp=String(v.exp);}else st.seq=v;draw();},
    lock:()=>{st.locked=true;el.classList.add('locked');el.querySelectorAll('button').forEach(b=>b.disabled=true);draw();},
    focus:()=>disp.focus({preventScroll:true})};

function setOf(n,test,minY,maxY,gen){let a;do{a=uniq(n,gen);}while(a.length<n||a.filter(test).length<minY||a.filter(test).length>maxY);return a;}

function lastDigitQ(d,X,ctxPrompt){/* procediment: última xifra → sí/no amb pistes → per què */

               5:yes?'Perquè acaba en '+L+(L===0?' (acaba en 0 o en 5)':' (acaba en 0 o en 5)'):'Perquè acaba en '+L+', i no és ni 0 ni 5',
               10:yes?'Perquè acaba en 0':'Perquè acaba en '+L+' i no en 0'}[d];
  const s=String(X);const hasMid0=s.slice(0,-1).indexOf('0')>=0;
  const bad={2:['Perquè la primera xifra és '+(+s[0]%2?'senar':'parella'),'Perquè és un nombre de '+s.length+' xifres'],
             5:[yes?(L===5?'Perquè és un nombre senar':'Perquè és un nombre parell'):'Perquè la suma de les xifres és '+sumD(X),'Perquè la primera xifra és '+s[0]],
             10:[hasMid0?'Perquè té un 0 al mig':'Perquè la suma de les xifres és '+sumD(X),X%2?'Perquè és un nombre senar':'Perquè és un nombre parell']}[d];
  return {prompt:ctxPrompt,
    steps:[{kind:'num',label:'Última xifra',ask:'Quina és l\'<b>última xifra</b> de '+nf(X)+'?',answer:L,fb:'L\'última xifra de '+nf(X)+' és <b>'+L+'</b>.'},
      {kind:'choice',label:'Divisible?',ask:nf(X)+' és divisible per '+d+'?',options:yn(yes),tips:TIP[d],fb:nf(X)+(yes?' <b>és</b>':' <b>no és</b>')+' divisible per '+d+'.'},
      {kind:'choice',label:'Per què',ask:'Per què?',options:why(okWhy,bad),fb:'Criteri del '+d+': '+{2:'acaba en 0, 2, 4, 6 o 8',5:'acaba en 0 o en 5',10:'acaba en 0'}[d]+'. '+nf(X)+' '+crit[d](X)+'.'+(yes?'':' Si fas la divisió, '+nf(X)+' : '+d+' no és exacta: el residu és '+(X%d)+'.')}]};}
