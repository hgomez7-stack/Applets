: "Àrea", "k": "s_c1"}, {"c": "Volum", "k": "s_c2"}, {"c": "Exemple: l’àrea es multiplica per 9", "k": "s_c5"}, {"c": "Un cub ha de tenir 5 vegades el volum d’un altre", "k": "s_c3"}, {"c": "Valor aproximat", "k": "s_c4"}]}, {"t": "Despejar amb arrels", "i": "Per obtenir una longitud a partir d’una àrea s’usa una arrel quadrada; a partir d’un volum, una arrel cúbica.", "b": [{"c": "Costat d’un quadrat d’àrea A", "k": "s_d1"}, {"c": "Aresta d’un cub de volum V", "k": "s_d2"}, {"c": "Radi d’un cercle d’àrea A", "k": "s_d3"}, {"c": "Un cub té un volum de 125 cm³. Quant mesura l’aresta?", "k": "s_d4"}, {"c": "Un cercle té una àrea de 12π cm². Quant mesura el radi?", "k": "s_d5"}]}, {"t": "Teorema de Pitàgores", "i": "En un triangle rectangle, el quadrat de la hipotenusa és la suma dels quadrats dels catets.", "b": [{"c": "", "k": "s_p1"}, {"c": "Exemple: catets 3 i 4", "k": "s_p2"}, {"c": "Si coneixem la hipotenusa, podem buscar un catet", "k": "s_p3"}, {"c": "", "k": "s_p4"}, {"c": "Diagonal d’un quadrat de costat c", "k": "s_q1"}, {"c": "", "k": "s_q2"}, {"c": "Si el costat val 1, la diagonal és un nombre irracional", "k": "s_q3"}]}, {"t": "Unitats d’àrea i volum", "i": "En àrea, cada salt d’unitat decimal multiplica o divideix per 100. En volum, per 1000. Equivalències: 1 ha = 10 000 m²; 1 dm³ = 1 L; 1000 cm³ = 1 L. Per obtenir una longitud a partir d’una àrea cal una arrel quadrada; a partir d’un volum, una arrel cúbica.", "b": [{"c": "Àrea", "k": "s_u1"}, {"c": "Volum", "k": "s_u2"}, {"c": "Error freqüent: duplicar el costat multiplica l’àrea per 4", "k": "s_e1"}, {"c": "Error freqüent: la suma de quadrats no és el quadrat de la suma", "k": "s_e2"}]}]};
const E=DATA.E,T=DATA.T;
// ---------- TeX subset -> MathML ----------
function conv(str,lin){
  let i=0;const s=str;
  const raw=()=>{while(s[i]===' ')i++;if(s[i]!=='{')return s[i++];let d=0,st=i;do{if(s[i]==='{')d++;if(s[i]==='}')d--;i++}while(d>0);return s.slice(st+1,i-1)};
  const rel=c=>'<mo class="rel">'+c+'</mo>';
  function seq(mode){
    const out=[];let prevRel=true;
    while(i<s.length){
      const c=s[i];
      if(mode==='p'&&(c===')'||s.startsWith('\\right',i)))break;
      if(c===' '){i++;continue}
      let x,isRel=false;
      if(c==='{'){x='<mrow>'+conv(raw(),lin)+'</mrow>'}
      else if(c==='^'){i++;const a=raw();const b=out.pop()||'<mi></mi>';x='<msup>'+b+'<mrow>'+conv(a,true)+'</mrow></msup>'}
      else if(c==='('){i++;const inner=seq('p');if(s[i]===')')i++;x='<mrow><mo>(</mo>'+inner+'<mo>)</mo></mrow>'}
      else if(/[0-9]/.test(c)){let t='';while(i<s.length){if(/[0-9]/.test(s[i]))t+=s[i++];else if(s.startsWith('{,}',i)&&/[0-9]/.test(s[i+3]||'')){t+=',';i+=3}else break}x='<mn>'+t+'</mn>'}
      else if(/[a-zA-Z]/.test(c)){i++;x='<mi>'+c+'</mi>'}
      else if(c==='='){i++;x=rel('=');isRel=true}
      else if(c==='<'){i++;x=rel('&lt;');isRel=true}
      else if(c==='+'){i++;x=lin?rel('+'):'<mo>+</mo>'}
      else if(c==='-'){i++;x=prevRel?'<mo form="prefix" lspace="0" rspace="0">−</mo>':'<mo>−</mo>'}
      else if(c===','){i++;x='<mo>,</mo>'}
      else if(c==='\\'){
        let j=i+1;while(/[a-zA-Z]/.test(s[j]||''))j++;
        let name=s.slice(i+1,j);if(j===i+1){name=s[j]||'';j++}i=j;
        switch(name){
          case 'sqrt':{let deg=null;if(s[i]==='['){const e=s.indexOf(']',i);deg=s.slice(i+1,e);i=e+1}const a=conv(raw(),false);x=deg?'<mroot><mrow>'+a+'</mrow><mrow>'+conv(deg,false)+'</mrow></mroot>':'<msqrt>'+a+'</msqrt>';break}
          case 'frac':{const n=raw(),d=raw();x=lin?'<mrow>'+conv(n,false)+'<mo>/</mo>'+conv(d,false)+'</mrow>':'<mfrac><mrow>'+conv(n,false)+'</mrow><mrow>'+conv(d,false)+'</mrow></mfrac>';break}
          case 'left':{i++;const inner=seq('p');if(s.startsWith('\\right',i)){i+=7}x='<mrow><mo>(</mo>'+inner+'<mo>)</mo></mrow>';break}
          case 'pi':x='<mi>π</mi>';break;
          case 'cdot':x=lin?rel('⋅'):'<mo>⋅</mo>';break;
          case 'div':x='<mo>÷</mo>';break;
          case 'neq':x=rel('≠');isRel=true;break;
          case 'approx':x=rel('≈');isRel=true;break;
          case 'Leftrightarrow':x=rel('⇔');isRel=true;break;
          case 'Rightarrow':x=rel('⇒');isRel=true;break;
          case 'quad':x='<mspace width="1.4em"></mspace>';break;
          case 'qquad':x='<mspace width="2.8em"></mspace>';break;
          case ';':case ',':continue;
          case 'mathrm':{const t=raw();x='<mi mathvariant="normal">'+t+'</mi>';break}
          default:x=''
        }
      } else {i++;continue}
      out.push(x);prevRel=isRel;
    }
    return out.join('');
  }
  return seq('top');
}
const ml=tex=>'<math display="inline">'+conv(tex,false)+'</math>';
// split a chain a=b=c at top level for step-by-step reveal
function parts(tex){
  if(/\\(quad|qquad|neq|approx|Rightarrow|Leftrightarrow)|</.test(tex))return[tex];
  const out=[];let d=0,p=0,st=0;
  for(let k=0;k<tex.length;k++){const c=tex[k];if(c==='{')d++;else if(c==='}')d--;else if(c==='(')p++;else if(c===')')p--;else if(c==='='&&d===0&&p===0){out.push(tex.slice(st,k));st=k+1}}
  out.push(tex.slice(st));
  const acc=[];let cur='';out.forEach((x,n)=>{cur=n?cur+'='+x:x;acc.push(cur)});
  return acc;
}
// ---------- Teoria ----------
const $=id=>document.getElementById(id);
let cur=0;
function showTopic(n){
  cur=n;const t=T[n];
  document.querySelectorAll('#nav button').forEach((b,k)=>b.setAttribute('aria-current',k===n?'true':'false'));
  let h='<h2>'+t.t+'</h2>'+(t.i?'<p class="lead">'+t.i+'</p>':'');
  t.b.forEach((b,k)=>{
    h+='<div class="blk">'+(b.c?'<p class="cap">'+b.c+'</p>':'')+'<div class="eqrow"><div class="eq" id="eq'+k+'"></div><button class="step" id="st'+k+'" hidden>Pas següent</button></div></div>';
  });
  h+='<div class="tools"><button class="btn ghost" id="all">Mostra-ho tot</button><button class="btn ghost" id="one">Torna a començar</button></div>';
  $('main').innerHTML=h;
  const state=t.b.map(b=>({p:parts(E[b.k]),n:0}));
  const draw=k=>{const s=state[k];$('eq'+k).innerHTML=ml(s.p[s.n]);$('st'+k).hidden=s.n>=s.p.length-1};
  state.forEach((s,k)=>{draw(k);$('st'+k).onclick=()=>{s.n++;draw(k)}});
  $('all').onclick=()=>state.forEach((s,k)=>{s.n=s.p.length-1;draw(k)});
  $('one').onclick=()=>state.forEach((s,k)=>{s.n=0;draw(k)});
  try{history.replaceState(null,'','#t'+n)}catch(e){}
}
T.forEach((t,k)=>{if(t.g){const g=document.createElement('div');g.className='grp';g.textContent=t.g;$('nav').appendChild(g)}const b=document.createElement('button');b.textContent=t.t;b.onclick=()=>showTopic(k);$('nav').appendChild(b)});
// ---------- Practica ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const KINDS=[
 {name:'Exponent fraccionari',make(){const n=pick([2,3,4]);const b=n===4?pick([2,3]):pick([2,3,4,5]);const m=R(1,n===2?3:3);const a=Math.pow(b,n);return{q:'Calcula la potència.',tex:a+'^{\\frac{'+m+'}{'+n+'}}',fields:[''],sol:[String(Math.pow(b,m))],hint:'Primer l’arrel '+n+'-èsima de '+a+' i després l’exponent '+m+'.'}}},
 {name:'Extreure factors',make(){const a=R(2,6),r=pick([2,3,5,6,7]);return{q:'Escriu el radical com a·√b, amb b el més petit possible.',tex:'\\sqrt{'+a*a*r+'}',fields:['a','b'],sol:[String(a),String(r)],hint:'Descompon '+a*a*r+' en factors primers.'}}},
 {name:'Suma de radicals',make(){const r=pick([2,3,5]);const p=R(2,7),q=R(2,7),s=R(1,Math.min(p+q-1,6));return{q:'Calcula. Escriu el coeficient del radical.',tex:p+'\\sqrt{'+r+'}+'+q+'\\sqrt{'+r+'}-'+s+'\\sqrt{'+r+'}',fields:['coeficient'],sol:[String(p+q-s)],hint:'Els radicals són semblants: se sumen i es resten els coeficients.',suffix:'\\sqrt{'+r+'}'}}},
 {name:'Racionalitzar',make(){const r=pick([2,3,5,7]);const k=r*R(1,4);return{q:'Racionalitza. Escriu el numerador de la fracció simplificada k√r / '+r+' (només k).',tex:'\\frac{'+k+'}{\\sqrt{'+r+'}}',fields:['k'],sol:[String(k)],hint:'Multiplica numerador i denominador per l’arrel. El resultat és '+k+'√'+r+' / '+r+'.',suffix:'\\frac{k\\sqrt{'+r+'}}{'+r+'}'}}},
 {name:'Canvi d’escala',make(){if(Math.random()<.5){const k=R(2,9);return{q:'L’àrea d’una figura es multiplica per '+k*k+'. Per quant es multiplica la longitud?',lhs:'k =',fields:['k'],sol:[String(k)],hint:'Si la longitud es multiplica per k, l’àrea es multiplica per k². Calcula l’arrel quadrada de '+k*k+'.'}}const k=R(2,5);return{q:'El volum d’un cos es multiplica per '+k*k*k+'. Per quant es multiplica la longitud?',lhs:'k =',fields:['k'],sol:[String(k)],hint:'El volum es multiplica per k³. Calcula l’arrel cúbica de '+k*k*k+'.'}}},
 {name:'Despejar',make(){const m=R(0,2);if(m===0){const a=R(2,9);return{q:'Un cub té un volum de '+a*a*a+' cm³. Quant mesura l’aresta (en cm)?',lhs:'a =',fields:['a'],sol:[String(a)],hint:'V = a³, per tant a és l’arrel cúbica del volum.'}}if(m===1){const c=R(3,15);return{q:'Un quadrat té una àrea de '+c*c+' m². Quant mesura el costat (en m)?',lhs:'c =',fields:['c'],sol:[String(c)],hint:'A = c², per tant c és l’arrel quadrada de l’àrea.'}}const r=R(2,9);return{q:'Un cercle té una àrea de '+r*r+'π cm². Quant mesura el radi (en cm)?',lhs:'r =',fields:['r'],sol:[String(r)],hint:'A = πr², així que r² = A/π. Aquí r² = '+r*r+'.'}}},
 {name:'Pitàgores',make(){const T3=[[3,4,5],[5,12,13],[8,15,17],[7,24,25]];const [a,b,h]=pick(T3);const f=R(1,3);const A=a*f,B=b*f,H=h*f;if(Math.random()<.5)return{q:'Calcula la hipotenusa d’un triangle rectangle de catets '+A+' i '+B+'.',tex:'\\sqrt{'+A+'^{2}+'+B+'^{2}}',fields:[''],sol:[String(H)],hint:'h² = a² + b². Suma els quadrats abans de fer l’arrel.'};return{q:'Calcula el catet d’un triangle rectangle de hipotenusa '+H+' i un catet '+A+'.',tex:'\\sqrt{'+H+'^{2}-'+A+'^{2}}',fields:[''],sol:[String(B)],hint:'a² = h² − b². Resta els quadrats abans de fer l’arrel.'}}}
];
let pk=0,ok=0,tot=0,cexe=null;
function newEx(){
  const k=KINDS[pk];cexe=k.make();let h='<h2>'+k.name+'</h2><p class="'+(cexe.tex?'q':'qq')+'">'+cexe.q+'</p><div class="ex"><div class="eqrow">'+(cexe.tex?'<div class="eq">'+ml(cexe.tex)+'</div>':'')+'<span style="font-size:1.7rem;font-family:var(--math)">'+(cexe.lhs||'=')+'</span>';
  cexe.fields.forEach((f,j)=>{h+='<input type="text" inputmode="numeric" autocomplete="off" id="f'+j+'" aria-label="'+(f||'resultat')+'" placeholder="'+f+'">'});
  if(cexe.suffix&&k.name==='Suma de radicals')h+='<div class="eq">'+ml(cexe.suffix)+'</div>';
  h+='</div><div class="tools"><button class="btn" id="chk">Comprova</button><button class="btn ghost" id="hint">Pista</button><button class="btn ghost" id="nxt">Nou exercici</button></div><div id="fb" aria-live="polite"></div><div class="score" id="sc">Encerts: '+ok+' de '+tot+'</div></div>';
  $('pmain').innerHTML=h;
  $('chk').onclick=check;$('hint').onclick=()=>{$('fb').innerHTML='<div class="msg">'+cexe.hint+'</div>'};$('nxt').onclick=newEx;
  document.querySelectorAll('#pmain input').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()}));
}
function check(){
  const v=cexe.fields.map((_,j)=>$('f'+j).value.trim());
  if(v.some(x=>!x)){$('fb').innerHTML='<div class="msg bad">Omple tots els camps.</div>';return}
  tot++;const good=v.every((x,j)=>x===cexe.sol[j]);if(good)ok++;
  $('fb').innerHTML=good?'<div class="msg ok">Correcte.</div>':'<div class="msg bad">No és correcte. Torna-ho a provar amb la pista o fes un exercici nou.</div>';
  $('sc').textContent='Encerts: '+ok+' de '+tot;
}
KINDS.forEach((k,j)=>{const b=document.createElement('button');b.textContent=k.name;b.onclick=()=>{pk=j;document.querySelectorAll('#pnav button').forEach((x,m)=>x.setAttribute('aria-current',m===j?'true':'false'));newEx()};$('pnav').appendChild(b)});
