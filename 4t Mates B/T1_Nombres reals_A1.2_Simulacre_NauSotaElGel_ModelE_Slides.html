<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Nau sota el Gel · MODEL E · SIMULACRE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@500;600&family=VT323&display=swap');
:root{
  --void:#05090c; --panel:rgba(8,18,23,.88); --panel2:rgba(14,28,35,.92);
  --ice:#d3e8ef; --ice2:#8fb7c6; --glow:#7fd6ff; --term:#8dffb4;
  --alert:#ff3b1d; --amber:#ffb454; --line:rgba(143,183,198,.3); --dim:rgba(211,232,239,.62);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--void);}
body{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.65;color:var(--ice);
  background:radial-gradient(ellipse at 50% -10%,#10252e 0,#070e12 55%,#030608 100%) fixed;min-height:100vh;padding:0 14px 60px;overflow-x:hidden;}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.55;}
.scan{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;}
.vig{position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);}
.flash{position:fixed;inset:0;pointer-events:none;z-index:48;background:var(--alert);opacity:0;}
body.glitch .flash{animation:flash .45s ease-out;}
body.glitch .w{animation:jit .45s steps(2,end);}
@keyframes flash{0%{opacity:.28}100%{opacity:0}}
@keyframes jit{0%{transform:translate(0,0)}20%{transform:translate(-4px,1px) skewX(1.2deg)}40%{transform:translate(5px,-1px)}60%{transform:translate(-3px,0) skewX(-1deg)}100%{transform:none}}
.w{position:relative;z-index:2;max-width:1000px;margin:0 auto;}
h1,h2,h3{font-family:'Oswald',Impact,sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;}
sup{font-size:.68em;line-height:0;}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .12em;font-size:.92em;}
.fr i{font-style:normal;padding:0 .2em;}.fr i:first-child{border-bottom:1.5px solid currentColor;}
button{font-family:inherit;}
/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.brand .eb{font-size:11px;letter-spacing:.3em;color:var(--ice2);text-transform:uppercase;}
.brand .ti{font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:#eef8fb;text-shadow:0 0 14px rgba(127,214,255,.35);}
.brand .tag{display:inline-block;margin-left:10px;font-size:11px;letter-spacing:.2em;padding:2px 8px;border:1px solid var(--amber);color:var(--amber);vertical-align:middle;}
.readouts{display:flex;gap:18px;flex-wrap:wrap;font-family:'VT323',monospace;font-size:21px;color:var(--term);}
.readouts div small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--ice2);text-transform:uppercase;line-height:1;margin-bottom:2px;}
.readouts .warn{color:var(--alert);}
/* station map nav */
.map{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;}
.node{flex:1;min-width:92px;padding:7px 8px;border:1px solid var(--line);background:rgba(8,18,23,.6);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:rgba(211,232,239,.38);cursor:default;position:relative;}
.node b{display:block;font-family:'VT323',monospace;font-size:22px;font-weight:400;letter-spacing:.05em;color:inherit;line-height:1;}
.node.reach{color:var(--ice2);cursor:pointer;}
.node.cur{border-color:var(--glow);color:var(--glow);box-shadow:0 0 12px rgba(127,214,255,.25) inset;}
.node.done{border-color:rgba(141,255,180,.55);color:var(--term);cursor:pointer;}
.node.rest{flex:.6;min-width:70px;border-style:dashed;}
.node.extra{border-style:dashed;border-color:rgba(255,180,84,.5);}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);padding:22px 24px;margin-bottom:16px;position:relative;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));}
.plate{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;background:#e6eff2;color:#071014;padding:9px 16px;margin:0 0 14px;
  font-family:'Oswald',sans-serif;letter-spacing:.2em;text-transform:uppercase;font-weight:600;}
.plate .n{font-size:20px;} .plate .pts{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;font-weight:500;}
.tx{border-left:3px solid var(--glow);background:rgba(127,214,255,.06);padding:11px 16px;margin-bottom:14px;font-size:14px;color:#c4dce5;}
.tx::before{content:'TRANSMISSIÓ ▸';display:block;font-size:9.5px;letter-spacing:.28em;color:var(--glow);margin-bottom:3px;}
.remind{border:1px dashed var(--amber);padding:10px 14px;margin:0 0 14px;font-size:13px;color:#f1dcb7;background:rgba(255,180,84,.06);}
.remind b{display:block;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--amber);margin-bottom:3px;}
.item{border:1px solid var(--line);background:var(--panel2);padding:16px 18px;margin-bottom:12px;}
.item.locked{display:none;}
.item.done{border-color:rgba(141,255,180,.45);}
.item.fail{border-color:rgba(255,59,29,.5);}
.ihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ice2);}
.ihead .pill{border:1px solid var(--line);padding:1px 8px;color:var(--ice);}
.comms{margin:6px 0 10px;border:1px solid rgba(255,180,84,.25);background:rgba(255,180,84,.045);padding:8px 12px;font-size:13.5px;}
.comms p{margin:2px 0;}
.who{font-weight:600;letter-spacing:.08em;margin-right:6px;}
.who.n{color:var(--glow);}.who.m{color:var(--amber);}
.prompt{font-size:15px;margin:10px 0;color:#eaf5f8;}
.hintbox{display:none;margin-top:8px;border-left:3px solid var(--amber);padding:6px 12px;font-size:13px;color:#f1dcb7;background:rgba(255,180,84,.07);}
.hintbox.on{display:block;}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;}
.btn{font-family:'Oswald',sans-serif;letter-spacing:.2em;text-transform:uppercase;font-size:13px;cursor:pointer;padding:11px 20px;border:1px solid var(--glow);background:rgba(127,214,255,.1);color:var(--glow);transition:.15s;}
.btn:hover:not(:disabled){background:rgba(127,214,255,.25);}
.btn:disabled{opacity:.35;cursor:default;}
.btn.main{background:var(--glow);color:#021016;}
.btn.main:hover:not(:disabled){background:#a8e6ff;}
.btn.ghost{border-color:var(--line);color:var(--ice2);background:transparent;}
.btn.alert{border-color:var(--alert);color:var(--alert);background:rgba(255,59,29,.08);}
.fb{margin-top:10px;font-size:13.5px;min-height:20px;}
.fb.ok{color:var(--term);}.fb.bad{color:#ff7a62;}.fb.soft{color:var(--amber);}
.reveal{display:none;margin-top:10px;border:1px dashed var(--alert);padding:9px 13px;font-size:13px;color:#ffc2b6;background:rgba(255,59,29,.06);}
.reveal.on{display:block;}
/* inputs */
input[type=text]{font-family:'IBM Plex Mono',monospace;font-size:15px;background:#04100f;border:1px solid var(--ice2);color:var(--term);padding:6px 9px;width:112px;outline:none;caret-color:var(--term);}
input[type=text]:focus{border-color:var(--glow);box-shadow:0 0 0 2px rgba(127,214,255,.2);}
input[type=text].wide{width:240px;}
input[type=text].sm{width:64px;text-align:center;}
input.tiny{width:46px!important;text-align:center;padding:3px 4px;font-size:14px;}
input:disabled{opacity:.75;}
.part{padding:7px 0;border-top:1px dashed rgba(143,183,198,.18);transition:.2s;}
.part:first-child{border-top:none;}
.part.ok{box-shadow:-3px 0 0 var(--term);padding-left:10px;}
.part.bad{box-shadow:-3px 0 0 var(--alert);padding-left:10px;}
.pq{margin-bottom:5px;font-size:14px;}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 10px;}
.opt{display:flex;gap:9px;align-items:flex-start;padding:5px 10px;border:1px solid transparent;cursor:pointer;font-size:14px;}
.opt:hover{background:rgba(127,214,255,.07);}
.opt input{margin-top:5px;accent-color:#7fd6ff;}
.nl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.nl .lab{color:var(--ice);}.nl .suf{color:var(--ice2);}
.sci{display:inline-flex;align-items:center;gap:6px;}
.sci sup{display:inline-flex;align-items:center;}
.tpl{line-height:2.4;font-size:15px;}
.tpl input{margin:0 3px;}.tpl sup input{width:46px;}
.props{display:flex;flex-wrap:wrap;gap:6px;}
.props label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);padding:5px 10px;font-size:12.5px;cursor:pointer;}
.props label:hover{border-color:var(--glow);}
.props input{accent-color:#7fd6ff;}
table.cl{border-collapse:collapse;width:100%;font-size:14px;}
table.cl th,table.cl td{border:1px solid var(--line);padding:7px 10px;text-align:center;}
table.cl th{background:rgba(143,183,198,.12);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;}
table.cl td:first-child{text-align:left;font-size:16px;color:#fff;}
table.cl tr.ok td:first-child{box-shadow:inset 3px 0 0 var(--term);}table.cl tr.bad td:first-child{box-shadow:inset 3px 0 0 var(--alert);}
table.cl input{width:18px;height:18px;accent-color:#7fd6ff;}
/* number line */
.nlbox{border:1px solid var(--line);background:#050f13;padding:6px;margin-top:6px;}
.nlbox svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;}
.legend{font-size:14px;margin:4px 0 2px;color:var(--ice);}
.legend b{color:var(--amber);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;}
.chip{border:1px solid var(--ice2);padding:6px 14px;cursor:pointer;background:rgba(127,214,255,.06);font-size:16px;color:#fff;}
.chip:hover{background:rgba(127,214,255,.2);}
.chip.used{opacity:.25;pointer-events:none;}
.slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;font-size:16px;}
.slot{min-width:70px;min-height:38px;border:1px dashed var(--ice2);display:flex;align-items:center;justify-content:center;padding:4px 10px;cursor:pointer;color:#fff;}
.slot.f{border-style:solid;background:rgba(127,214,255,.1);}
.ir{display:grid;grid-template-columns:1fr 1fr 1.7fr;gap:10px;align-items:stretch;}
.ir>div{border:1px solid var(--line);padding:9px 11px;}
.ir .h{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ice2);margin-bottom:5px;}
.ir .given{font-size:17px;color:#fff;}
.ir .mini{font-size:11px;color:var(--dim);margin-top:4px;}
.ir.ex>div{background:rgba(141,255,180,.05);}
.lnbtns{display:flex;gap:6px;margin-top:4px;}
.lnbtns button{font-size:11px;padding:3px 9px;border:1px solid var(--line);background:transparent;color:var(--ice2);cursor:pointer;}
.lnbtns button:hover{border-color:var(--glow);color:var(--glow);}
@media(max-width:700px){.ir{grid-template-columns:1fr;}.panel{padding:16px 14px;}.brand .ti{font-size:19px;}}
/* rest */
.restfig{border:1px solid var(--line);background:#050f13;padding:6px;margin:10px 0;}
.restfig svg{display:block;width:100%;height:auto;}
.restfig .g{opacity:0;transition:opacity .7s;}.restfig .g.on{opacity:1;}
.log p{opacity:0;transform:translateY(4px);transition:.5s;margin:6px 0;}.log p.on{opacity:1;transform:none;}
/* intro & final */
.boot{font-family:'VT323',monospace;font-size:19px;line-height:1.35;color:var(--term);white-space:pre-wrap;min-height:120px;text-shadow:0 0 6px rgba(141,255,180,.45);}
.cursor{display:inline-block;width:9px;height:17px;background:var(--term);vertical-align:-2px;animation:blk 1s steps(1) infinite;}
@keyframes blk{50%{opacity:0}}
.big{font-family:'VT323',monospace;font-size:54px;line-height:1;color:var(--term);text-shadow:0 0 12px rgba(141,255,180,.5);}
.stamp{display:inline-block;border:2px solid var(--term);color:var(--term);font-family:'Oswald';letter-spacing:.3em;padding:3px 12px;font-size:13px;transform:rotate(-3deg);}
.lightning{display:block;width:100%;height:26px;margin:6px 0 2px;}
.sum{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0;}
.sum th,.sum td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;}
.sum th{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ice2);font-weight:500;}
.doorok{margin:14px 0 4px;padding:10px 14px;border:1px solid var(--term);color:var(--term);background:rgba(141,255,180,.07);display:none;letter-spacing:.05em;}
.doorok.on{display:block;}
input.nm{width:100%;max-width:340px;}
#print-report{display:none;}

html,body{height:100%;}
body{padding:0;overflow:hidden;}
.app{position:relative;z-index:2;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:none!important;margin:0!important;}
.hud{width:100%;max-width:1040px;margin:0 auto;padding:10px 16px 8px;margin-bottom:0;flex:0 0 auto;}
.brand .ti{font-size:21px;}
.deck{flex:1 1 auto;min-height:0;overflow:hidden;position:relative;}
.track{display:flex;height:100%;transition:transform .55s cubic-bezier(.65,0,.25,1);}
.slide{flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden;padding:6px 16px 22px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
.slide[inert]{visibility:hidden;transition:visibility 0s .55s;}
.sl-in{max-width:960px;margin:0 auto;}
.sl-in .plate{margin-top:6px;}
.slide .item{background:var(--panel);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));padding:18px 22px;}
.nav{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px 10px;border-top:1px solid var(--line);background:rgba(5,10,13,.9);max-width:1040px;width:100%;margin:0 auto;}
.nav .arr{font-family:'Oswald',sans-serif;font-size:18px;line-height:1;width:46px;height:40px;border:1px solid var(--glow);background:rgba(127,214,255,.1);color:var(--glow);cursor:pointer;flex:0 0 auto;}
.nav .arr:disabled{opacity:.25;cursor:default;}
.nav .arr:hover:not(:disabled){background:rgba(127,214,255,.28);}
.navmid{flex:1;min-width:0;}
#where{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ice2);text-align:center;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#dots{display:flex;gap:4px;justify-content:center;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.dot{font-family:'VT323',monospace;font-size:16px;line-height:1;min-width:34px;height:26px;padding:0 5px;border:1px solid var(--line);background:rgba(8,18,23,.6);color:rgba(211,232,239,.55);cursor:pointer;flex:0 0 auto;}
.dot:hover{border-color:var(--ice2);}
.dot.extra{border-style:dashed;}
.dot.part{border-color:var(--amber);color:var(--amber);}
.dot.done{border-color:rgba(141,255,180,.6);color:var(--term);}
.dot.fail{border-color:rgba(255,59,29,.7);color:#ff7a62;}
.dot.cur{background:var(--glow);color:#021016;border-color:var(--glow);box-shadow:0 0 10px rgba(127,214,255,.5);}
.solbox{display:none;margin-top:10px;border:1px dashed var(--term);padding:9px 13px;font-size:13px;color:#cdf5da;background:rgba(141,255,180,.05);}
.solbox.on{display:block;}
.howto{font-size:13.5px;color:var(--dim);margin-top:6px;}
.dim{color:var(--ice2);font-size:12px;letter-spacing:.2em;text-transform:uppercase;}
.dim.small{font-size:12px;letter-spacing:.02em;text-transform:none;margin-top:12px;}
h3.sec{font-size:15px;margin:20px 0 8px;color:var(--glow);}
.tbars{display:grid;gap:8px;}
.tb{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr minmax(150px,1fr);gap:12px;align-items:center;font-size:13px;}
.tb .bar{height:12px;border:1px solid var(--line);background:#04100f;}
.tb .bar i{display:block;height:100%;background:var(--term);}
.tb.mid .bar i{background:var(--amber);}.tb.low .bar i{background:var(--alert);}
.tb .tv{color:var(--ice2);font-size:12px;}
.tb.low .tv{color:#ff7a62;}.tb.mid .tv{color:var(--amber);}
#dots{position:relative;}
.boot{font-size:17px!important;line-height:1.22!important;min-height:0!important;}
.nlbox svg{max-height:35vh;}
@media(max-height:760px){.nlbox svg{max-height:31vh;}}
@media(max-width:700px){.tb{grid-template-columns:1fr;gap:3px;}.brand .tag{display:none;}.readouts{gap:12px;font-size:18px;}.nav .arr{width:40px;}}
/* print report */
@media print{
  @page{size:A4;margin:14mm 13mm;}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important;padding:0!important;}
  .app,#snow,.scan,.vig,.flash{display:none!important;}
  #print-report{display:block;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:10.5pt;line-height:1.38;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #print-report h1{font-family:Arial,sans-serif;font-size:19pt;letter-spacing:0;text-transform:none;margin:2px 0 8px;color:#12263a;}
  #print-report h2{font-family:Arial,sans-serif;font-size:13pt;letter-spacing:0;text-transform:none;color:#1F4E79;border-bottom:1.5px solid #1F4E79;padding-bottom:2px;margin:18px 0 8px;break-after:avoid;}
  #print-report h3{font-family:Arial,sans-serif;font-size:11.5pt;letter-spacing:0;text-transform:none;margin:0 0 4px;color:#12263a;break-after:avoid;}
  .rp-eb{font-size:8pt;letter-spacing:.12em;color:#5a6672;}
  table.rp-meta,table.rp-t{width:100%;border-collapse:collapse;margin:4px 0 6px;}
  .rp-meta td,.rp-t th,.rp-t td{border:1px solid #9aa5b1;padding:4px 8px;vertical-align:middle;font-size:10pt;}
  .rp-t th{background:#e3eaf1;text-align:left;}
  .rp-big{font-size:17pt;font-weight:bold;color:#1F4E79;}
  .rp-line{margin:6px 0 0;font-size:10pt;}
  .rbar{height:9px;border:1px solid #9aa5b1;background:#fff;}.rbar i{display:block;height:100%;}
  .rbar i.ok{background:#2f9e5b;}.rbar i.mid{background:#e0a21a;}.rbar i.low{background:#c8402a;}
  .lv.ok{color:#1f7a45;}.lv.mid{color:#a56d00;}.lv.low{color:#b3321f;}
  .rp-topic{break-inside:avoid-page;border:1px solid #c6ced6;border-left:4px solid #1F4E79;padding:7px 11px;margin:9px 0;background:#f8fafc;}
  .rp-topic h3 small{font-weight:normal;font-size:9pt;margin-left:8px;}
  .rp-n{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:#1F4E79;color:#fff;font-size:9pt;margin-right:4px;}
  .rp-topic ul,.rp-topic ol{margin:2px 0 4px 18px;padding:0;}
  .rp-topic li{margin:1px 0;}
  ul.warn li::marker{color:#b3321f;}
  .rp-k{margin:5px 0 1px;color:#1F4E79;font-size:10pt;}
  .rp-s{font-size:9pt;color:#5a6672;}
  .rp-where{font-size:10pt;margin:2px 0;}
  .rp-sol{font-size:9.5pt;color:#1f5f3b;margin-top:1px;}
  .rp-item{break-inside:avoid;border:1px solid #c6ced6;padding:6px 10px;margin:7px 0;}
  .rp-ih{display:flex;justify-content:space-between;gap:10px;font-size:9.5pt;border-bottom:1px solid #dfe5ea;padding-bottom:3px;margin-bottom:3px;}
  .rp-ih span{color:#5a6672;text-align:right;}
  .rp-q{font-size:10.5pt;margin:2px 0;}
  .rp-w{background:#fdecea;border-left:3px solid #c8402a;padding:3px 8px;margin:4px 0;font-size:10pt;}
  .rp-ok{background:#e8f6ee;border-left:3px solid #2f9e5b;padding:3px 8px;margin:4px 0;font-size:10pt;}
  .rp-plan li{margin:3px 0;}
  .rp-foot{margin-top:16px;font-size:8.5pt;color:#7a8794;text-align:center;}
  #print-report .fr{font-size:.92em;}
}

@media(prefers-reduced-motion:reduce){#snow{display:none;}.cursor{animation:none;}body.glitch .w,body.glitch .flash{animation:none;}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas><div class="vig" aria-hidden="true"></div><div class="scan" aria-hidden="true"></div><div class="flash" aria-hidden="true"></div>

  const un = items.filter(i => !i.done).length;
  let h = `<div class="rp-head"><div class="rp-eb">MATEMÀTIQUES B · 4T ESO · INFORME DEL SIMULACRE</div><h1>La Nau sota el Gel · ${esc(MODEL.tag)}</h1>
  <table class="rp-meta"><tr><td><b>Alumne/a</b><br>${esc(nm)}</td><td><b>Data</b><br>${date}</td><td><b>Temps</b><br>${time}</td><td><b>Nota</b><br><span class="rp-big">${fp(total)}</span> / ${fp(MODEL.max)}</td></tr></table>
  <p class="rp-line">Apartats encertats a la primera: <b>${first}</b> de ${items.length} · errors: <b>${S.errors}</b> · pistes: <b>${S.hints}</b>${un ? ' · sense resoldre: <b>' + un + '</b>' : ''}</p></div>`;
  h += '<h2>1. Resultat per temes</h2><table class="rp-t"><thead><tr><th>Tema</th><th>Punts</th><th style="width:34%">Nivell</th><th>Valoració</th></tr></thead><tbody>' +
    stats.map(t => `<tr><td>${TOPICS[t.k].name}</td><td>${fp(t.pts)} / ${fp(t.max)}</td><td><div class="rbar"><i class="${t.level}" style="width:${Math.round(t.pct * 100)}%"></i></div></td><td><b class="lv ${t.level}">${LEVEL[t.level]}</b></td></tr>`).join('') + '</tbody></table>';
  const todo = stats.filter(t => t.level !== 'ok' || t.hints > 0).sort((a, b) => b.lost - a.lost || b.hints - a.hints);
  h += '<h2>2. Temes a repassar</h2>';
  if (!todo.length) h += '<p>Enhorabona: has dominat tots els temes. Fes un repàs ràpid dels apunts abans de l’examen final.</p>';
  todo.forEach((t, n) => {
    const T = TOPICS[t.k], bad = t.items.filter(i => i.attempts > 0 || !i.done || i.revealed);
    h += `<div class="rp-topic"><h3><span class="rp-n">${n + 1}</span> ${T.name} <small class="lv ${t.level}">${LEVEL[t.level]} · ${fp(t.pts)} / ${fp(t.max)}</small></h3>`;
    h += `<p class="rp-where"><b>On has fallat:</b> ${bad.length ? bad.map(i => `Comporta ${i.doorN}${i.label ? ' ' + esc(i.label) : ''}`).join(' · ') : 'sense errors, però has necessitat pistes (' + t.hints + ').'}</p>`;
    h += '<p class="rp-k"><b>Què has de tenir clar</b></p><ul>' + T.key.map(x => `<li>${fmt(x)}</li>`).join('') + '</ul>';
    h += '<p class="rp-k"><b>Errors habituals</b></p><ul class="warn">' + T.mistakes.map(x => `<li>${fmt(x)}</li>`).join('') + '</ul>';
    h += '<p class="rp-k"><b>Practica</b> <span class="rp-s">(intenta’ls sense mirar la solució)</span></p><ol class="prac">' + T.practice.map(p => `<li>${fmt(p[0])}<div class="rp-sol">Solució: ${fmt(p[1])}</div></li>`).join('') + '</ol></div>';
  });
  h += '<h2>3. Revisió dels apartats</h2>';
  const rev = items.filter(i => i.attempts > 0 || !i.done || i.revealed);
  if (!rev.length) h += '<p>No hi ha cap apartat per revisar: tot ben fet.</p>';
  rev.forEach(i => {
    const state = !i.done ? (i.attempts ? 'Incomplet · ' + i.attempts + ' intent' + (i.attempts > 1 ? 's' : '') + ' fallit' + (i.attempts > 1 ? 's' : '') : 'Sense respondre') : i.revealed ? 'No resolt (3 intents fallits)' : `Correcte a l’intent ${i.attempts + 1}`;
    h += `<div class="rp-item"><div class="rp-ih"><b>Comporta ${i.doorN}${i.extra ? ' (extra)' : ''} · ${esc(i.label)}</b><span>${fp(i.pts)} / ${fp(i.max)} pts · ${state} · <i>${TOPICS[i.topic].name}</i></span></div>`;
    if (i.pre) h += `<div class="rp-q">${fmt(i.pre)}</div>`;
    if (i.prompt) h += `<div class="rp-q">${fmt(i.prompt)}</div>`;
    if (i.wrongs.length) h += `<div class="rp-w"><b>La teva resposta ${i.wrongs.length > 1 ? '(primer intent)' : ''}:</b> ${esc(i.wrongs[0])}</div>`;
    h += `<div class="rp-ok"><b>Solució correcta:</b> ${fmt(i.solution)}</div></div>`;
  });
  const hintOnly = items.filter(i => i.hints > 0 && !(i.attempts > 0 || !i.done || i.revealed));
  if (hintOnly.length) h += `<p class="rp-s">Apartats encertats però amb pista: ${hintOnly.map(i => 'Comporta ' + i.doorN + ' ' + esc(i.label)).join(', ')}. Torna’ls a fer sense pistes.</p>`;
  h += '<h2>4. Pla d’estudi</h2><ol class="rp-plan">';
  if (todo.length) {
    todo.forEach(t => h += `<li><b>${TOPICS[t.k].name}</b> — rellegeix «Què has de tenir clar», fes els exercicis de «Practica» i refés els apartats fallats sense mirar la solució.</li>`);
    h += '<li>Torna a fer el simulacre només amb els apartats que hagis fallat i comprova que els encertes a la primera.</li><li>Abans de l’examen final, repassa els errors habituals de cada tema: són els que més puntuació fan perdre.</li>';
  } else h += '<li>Fes un repàs ràpid de les propietats de les potències i de l’ordre de les operacions.</li><li>Practica amb el mode examen (compte enrere) per entrenar el temps.</li>';
  h += '</ol><p class="rp-foot">Informe generat automàticament · La Nau sota el Gel · ' + esc(MODEL.tag) + '</p>';
  return h;
}
function report() {
  S.name = $('#fin-name').value.trim() || S.name;
  $('#print-report').innerHTML = buildReport();
  setTimeout(() => window.print(), 80);
}
/* ═════ deck navigation ═════ */
function buildNav() {
  const d = $('#dots'); d.innerHTML = '';
  S.slides.forEach((s, i) => { const b = mk('button', 'dot', s.short); b.type = 'button'; b.title = s.title; b.onclick = () => go(i); d.append(b); s.dot = b; if (s.type === 'item' && s.extra) b.classList.add('extra'); });
}
function refreshNav() {
  S.slides.forEach((s, i) => {
    if (!s.dot) return; const b = s.dot; b.classList.remove('cur', 'done', 'fail', 'part');
    if (s.type === 'item') { const st = S.items[s.door.id + '.' + s.i]; if (st.done) b.classList.add(st.revealed ? 'fail' : 'done'); else if (st.attempts) b.classList.add('part'); }
    if (i === S.idx) { b.classList.add('cur'); const d = $('#dots'); d.scrollLeft = b.offsetLeft - d.clientWidth / 2 + b.offsetWidth / 2; }
  });
  $('#prev').disabled = S.idx <= 0; $('#next').disabled = S.idx >= S.slides.length - 1 || S.idx === 0;
  const q = S.slides[S.idx]; $('#where').textContent = q.type === 'item' ? q.title + ' · ' + (S.slides.filter((x, k) => x.type === 'item' && k <= S.idx).length) + '/' + (S.slides.length - 2) : q.title;
  if (S.idx === S.slides.length - 1) S.refreshFinal();
}
function go(i) {
  if (i < 0 || i > S.slides.length - 1) return;
  if (S.idx === 0 && i > 0 && !S.t0) return; // must start from the intro
  S.idx = i; $('#track').style.transform = `translateX(${-100 * i}%)`;
  S.slides.forEach((s, k) => { if (k === i) { s.el.removeAttribute('inert'); s.el.scrollTop = 0; s.el.setAttribute('aria-hidden', 'false'); } else { s.el.setAttribute('inert', ''); s.el.setAttribute('aria-hidden', 'true'); } });
  refreshNav();
}
$('#prev').onclick = () => go(S.idx - 1); $('#next').onclick = () => go(S.idx + 1);
addEventListener('keydown', e => {
  const t = e.target.tagName; if (['INPUT', 'TEXTAREA', 'SELECT'].includes(t) || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') go(S.idx + 1); else if (e.key === 'ArrowLeft') go(S.idx - 1);
});
/* ═════ HUD: temp, timer, snow ═════ */
setInterval(() => {
  $('#rd-temp').textContent = '−' + (39 + Math.floor(Math.random() * 7)) + ' °C';
  if (!S.t0) return; const el = Math.floor((Date.now() - S.t0) / 1000);
  if (S.countdown) { const left = 55 * 60 - el; const t = $('#rd-time'); t.textContent = mmss(left); t.className = left < 300 ? 'warn' : ''; }
  else $('#rd-time').textContent = mmss(el);
}, 1000);
(function snow() {
  const c = $('#snow'), x = c.getContext('2d'); if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let W, H, P = [];
  const rs = () => { W = c.width = innerWidth; H = c.height = innerHeight; P = Array.from({ length: Math.round(W * H / 14000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + .4, v: Math.random() * .8 + .3, d: Math.random() * 6 })); };
  rs(); addEventListener('resize', rs);
  (function f() { x.clearRect(0, 0, W, H); x.fillStyle = '#e4f3f8'; P.forEach(p => { p.y += p.v; p.x += 1.1 + Math.sin(p.d += .01) * .6; if (p.y > H) { p.y = -5; p.x = Math.random() * W; } if (p.x > W) p.x = 0; x.globalAlpha = .35 + p.r * .2; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); }); requestAnimationFrame(f); })();
})();
S.slides = buildSlides();
S.slides.forEach(s => { const sec = mk('section', 'slide'); sec.append(s.type === 'intro' ? buildIntro() : s.type === 'final' ? buildFinal() : buildItemSlide(s)); s.el = sec; $('#track').append(sec); });
buildNav(); go(0);


</script>
